              {searchResults.length === 0 ? (
                <div className="rounded-lg p-10 text-center" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>
                  <p className="text-base" style={{ color: COLORS.inkDim }}>{t('noOrdersMatchSearch')}</p>
                </div>
              ) : (
                <div className="space-y-3">{searchResults.map(renderOrderCard)}</div>
              )}
            </div>
          ) : (
            <React.Fragment>
              <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
                <h2 className="font-display text-lg font-semibold uppercase tracking-wide">{t('openWorkOrders')}</h2>
                <div className="flex gap-2 flex-wrap">
                  <select
                    value=""
                    onChange={(e) => { if (e.target.value) pullOntoBoard(e.target.value); }}
                    disabled={queuedOrders.length === 0}
                    className="text-xs font-display uppercase tracking-wider font-semibold px-2 py-1.5 rounded-lg focus:outline-none focus:ring-2"
                    style={{ color: COLORS.accent, background: COLORS.surface, border: `1px solid ${COLORS.line}`, opacity: queuedOrders.length === 0 ? 0.5 : 1 }}
                  >
                    <option value="">
                      {queuedOrders.length === 0 ? 'Nothing queued' : `+ Pull a job onto the board (${queuedOrders.length} queued)`}
                    </option>
                    {queuedUnitGroups.map((unit) => (
                      <optgroup key={unit} label={unit}>
                        {queuedByUnit[unit].map((o) => (
                          <option key={o.id} value={o.id}>
                            {getLocalizedText(o.description, lang) || t('noDescription')}
                          </option>
                        ))}
                      </optgroup>
                    ))}
                  </select>
                  <button
                    onClick={() => setScreen('machines')}
                    className="font-display text-xs uppercase tracking-wider font-semibold px-3 py-2 rounded-lg transition-all hover:scale-105"
                    style={{ color: COLORS.inkDim, background: COLORS.surface, border: `1px solid ${COLORS.line}` }}
                  >
                    {t('viewByMachine')}
                  </button>
                  <label
                    className="font-display font-bold uppercase tracking-wide text-sm px-4 py-3 rounded-xl transition-all cursor-pointer text-center"
                    style={{ background: COLORS.surfaceRaised, color: COLORS.accent, border: `2px solid ${COLORS.accent}` }}
                  >
                    {scanningReceipt ? 'Reading photo…' : '📷 Scan a receipt'}
                    <input
                      type="file"
                      accept="image/*"
                      capture="environment"
                      className="hidden"
                      disabled={scanningReceipt}
                      onChange={(e) => {
                        const file = e.target.files && e.target.files[0];
                        if (file) handleScanReceipt(file);
                        e.target.value = '';
                      }}
                    />
                  </label>
                  <Btn onClick={() => setShowAddOrder((s) => !s)}>{t('newWorkOrder')}</Btn>
                </div>
              </div>

              {showAddOrder && (
                <NewOrderForm
                  mechanics={mechanics}
                  units={units}
                  onCancel={() => { setShowAddOrder(false); setScanReviewData(null); }}
                  onSubmit={(data) => createOrder(data, scanReviewData ? scanReviewData.photoDataUrl : null)}
                  initialDescription={scanReviewData ? scanReviewData.description : ''}
                  initialUnit={scanReviewData ? scanReviewData.unit : ''}
                  scanBanner={!!scanReviewData}
                  t={t}
                />
              )}

              {visibleOpenOrders.length === 0 ? (
                <div className="rounded-lg p-10 text-center" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>
                  <p className="font-body text-base mb-2" style={{ color: COLORS.inkDim }}>
                    {queuedOrders.length > 0 ? 'Board is clear' : 'All caught up!'}
                  </p>
                  <p className="font-body text-sm" style={{ color: COLORS.line }}>
                    {queuedOrders.length > 0
                      ? `${queuedOrders.length} job${queuedOrders.length !== 1 ? 's' : ''} waiting in the dropdown above — pull one out when you're ready to start it.`
                      : t('noOpenOrders')}
                  </p>
                </div>
              ) : (
                <div className="space-y-3">
                  {visibleOpenOrders.map(renderOrderCard)}
                </div>
              )}
            </React.Fragment>
          )}

          <p className="font-body text-xs mt-12 text-center" style={{ color: COLORS.line }}>All mechanics see the same board in real time</p>
        </div>
      </div>
    );
  }

  // ---------- MACHINES (grouped by unit) ----------
  if (screen === 'machines') {
    const counts = (unit) => {
      const list = orders.filter((o) => o.unit === unit);
      return {
        Open: list.filter((o) => o.status === 'Open').length,
        'In Progress': list.filter((o) => o.status === 'In Progress').length,
        Done: list.filter((o) => o.status === 'Done').length,
      };
    };
    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <FireworksOverlay show={showFireworks} />
        <OfflineBanner isOnline={isOnline} />
        <PinModalOverlay
          pinModal={pinModal}
          pinInput={pinInput}
          setPinInput={setPinInput}
          pinError={pinError}
          onSubmit={submitPin}
          onCancel={cancelPinModal}
          onForgot={forgotPin}
          t={t}
        />
        <EmailPromptOverlay
          show={showEmailPrompt}
          onSave={async (email) => {
            await saveMechanicEmail(currentMechanic, email);
            setShowEmailPrompt(false);
          }}
          onSkip={() => setShowEmailPrompt(false)}
        />
        <PushPromptOverlay
          show={showPushPrompt}
          mechanic={currentMechanic}
          onEnable={async () => {
            await registerPushNotifications(currentMechanic);
            setShowPushPrompt(false);
          }}
          onSkip={() => setShowPushPrompt(false)}
        />
        <BiometricOfferOverlay
          mechanic={offerBiometric}
          onEnable={async () => {
            const name = offerBiometric;
            setOfferBiometric(null);
            try {
              await registerBiometric(name);
            } catch (e) {
              // ignore
            }
          }}
          onSkip={() => setOfferBiometric(null)}
        />
        <div className="max-w-5xl mx-auto">
          <button onClick={() => setScreen(landingScreenFor(currentMechanic))} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>

          <div className="flex items-center justify-between mb-5">
            <h2 className="font-display text-lg font-semibold uppercase tracking-wide">Your machines</h2>
            <Btn variant="ghost" onClick={() => setShowAddUnit((s) => !s)}>+ Add machine</Btn>
          </div>

          {showAddUnit && (
            <div className="flex flex-col sm:flex-row gap-2 mb-5">
              <input
                value={newUnitName}
                onChange={(e) => setNewUnitName(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && addUnit(newUnitTypeDraft)}
                placeholder="Unit number, e.g. UNIT-104"
                className="flex-1 rounded-sm px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
              />
              <select
                value={newUnitTypeDraft}
                onChange={(e) => setNewUnitTypeDraft(e.target.value)}
                className="rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-2"
                style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                title="Optional — tags it for Timesheets tracking"
              >
                <option value="">— Untagged —</option>
                {Object.entries(SUPPORT_TYPE_LABELS).map(([type, label]) => (
                  <option key={type} value={type}>{label}</option>
                ))}
                {Object.entries(MACHINE_TYPE_LABELS).map(([type, label]) => (
                  <option key={type} value={type}>{label}</option>
                ))}
              </select>
              <Btn onClick={() => addUnit(newUnitTypeDraft)}>Add</Btn>
            </div>
          )}

          {units.length === 0 ? (
            <div className="rounded-lg p-10 text-center" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>
              <p className="font-body text-base mb-4" style={{ color: COLORS.inkDim }}>No machines added yet</p>
              <p className="font-body text-sm" style={{ color: COLORS.line }}>Tap "Add machine" above to get started</p>
            </div>
          ) : (
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
              {units.map((u) => {
                const c = counts(u);
                const totalJobs = c.Open + c['In Progress'] + c.Done;
                return (
                  <button
                    key={u}
                    onClick={() => { setActiveUnit(u); setScreen('unit'); }}
                    className="text-left rounded-lg p-5 focus:outline-none focus:ring-2 transition-all hover:scale-105 active:scale-95"
                    style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}
                  >
                    <p className="font-mono text-xl font-semibold mb-4 truncate">{u}</p>
                    <div className="space-y-2">
                      <div className="flex items-center justify-between text-sm">
                        <span style={{ color: COLORS.open }}>📋 {t('statusOpen')}</span>
                        <span className="font-semibold" style={{ color: COLORS.open }}>{c.Open}</span>
                      </div>
                      <div className="flex items-center justify-between text-sm">
                        <span style={{ color: COLORS.progress }}>🔧 {t('statusInProgress')}</span>
                        <span className="font-semibold" style={{ color: COLORS.progress }}>{c['In Progress']}</span>
                      </div>
                      <div className="flex items-center justify-between text-sm">
                        <span style={{ color: COLORS.done }}>✓ {t('statusDone')}</span>
                        <span className="font-semibold" style={{ color: COLORS.done }}>{c.Done}</span>
                      </div>
                    </div>
                    {totalJobs > 0 && (
                      <div className="mt-3 pt-3 border-t" style={{ borderColor: COLORS.line }}>
                        <span className="text-xs font-display uppercase tracking-wide" style={{ color: COLORS.inkDim }}>
                          {totalJobs} job{totalJobs !== 1 ? 's' : ''} total
                        </span>
                      </div>
                    )}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      </div>
    );
  }


  // ---------- TIME CLOCK ----------
  // ---------- SHIFT (unified — routes by job type) ----------
  if (screen === 'shift') {
    // People with alternates set (e.g. a mechanic who also drives the
    // winch truck) default straight to their normal, primary role — same
    // as everyone else, no extra step. A dropdown further down lets them
    // pick a different one for today on the rare day they need to.
    const effectiveJobType = todaysJobChoice ? jobTypeForValue(todaysJobChoice) : jobTypeFor(currentMechanic);
    const effectiveUnit = todaysJobChoice ? (todaysJobChoice === '__mechanic__' ? '' : todaysJobChoice) : assignedUnitFor(currentMechanic);

    if (showPreTripForm) {
      return (
        <PreTripInspectionForm
          driver={currentMechanic}
          truckUnitName={effectiveUnit}
          onCancel={() => setShowPreTripForm(false)}
          onSubmit={async (unitsData, signature) => {
            await submitPreTripInspection(unitsData, signature);
            setShowPreTripForm(false);
          }}
        />
      );
    }

    if (showInspectionMode) {
      return (
        <InspectionModeScreen
          driver={currentMechanic}
          allLogs={driverLogs}
          onExit={() => setShowInspectionMode(false)}
        />
      );
    }

    // Mechanics get the exact same screen they've always had — this just
    // hands off to it, using the same redirect pattern already used
    // elsewhere in this file (e.g. Order Detail when an order isn't found).
    if (effectiveJobType === 'mechanic') {
      setScreen('timeclock');
      return null;
    }

    const activeType = openProductionShift ? machineType(openProductionShift.machine, unitTypes) : machineType(effectiveUnit, unitTypes);
    const myProductionShifts = productionShifts
      .filter((s) => s.employee === currentMechanic && s.end)
      .sort((a, b) => b.end.localeCompare(a.end))
      .slice(0, 10);

    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <SidebarMenu
          show={showSidebar}
          onClose={() => setShowSidebar(false)}
          mechanic={currentMechanic}
          isProduction={jobTypeFor(currentMechanic) === 'production'}
          isForeman={isForeman}
          isAdmin={isAdmin}
          onNavigate={(s) => setScreen(s)}
          onCheckUpdates={async () => {
            try {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map((r) => r.unregister()));
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
            } catch (e) {}
            window.location.reload(true);
          }}
          onLogout={async () => {
            const keepSession = !!localStorage.getItem('webauthn_cred_' + currentMechanic);
            if (!keepSession && !navigator.onLine) {
              const proceed = confirm("You're offline right now. Logging out means you won't be able to sign back in until you have signal again. Log out anyway?");
              if (!proceed) return;
            }
            if (!keepSession) { await firebase.auth().signOut().catch(() => {}); }
            setCurrentMechanic(null);
            setScreen('login');
          }}
          t={t}
        />
        <div className="max-w-lg mx-auto">
          <div className="flex items-center justify-between mb-8">
            <div>
              <p className="font-display text-xs uppercase mb-1" style={{ color: COLORS.accent, letterSpacing: '0.3em' }}>Harder Contracting</p>
              <h1 className="font-display text-2xl font-bold">Shift</h1>
            </div>
            <button onClick={() => setShowSidebar(true)} className="text-3xl leading-none px-3 py-2 rounded-lg" style={{ color: COLORS.accent, background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>☰</button>
          </div>

          {!openProductionShift ? (
            <div className="rounded-lg p-8 text-center" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
              <p className="text-base mb-5" style={{ color: COLORS.inkDim }}>Not clocked in</p>
              <Btn onClick={() => startProductionShift(effectiveUnit || undefined)}>Clock In</Btn>
              {hasAltRole(currentMechanic) && (
                <div className="mt-4 text-left">
                  <label className="block text-xs mb-1" style={{ color: COLORS.inkDim }}>Working as today:</label>
                  <select
                    value={todaysJobChoice || altOptionsFor(currentMechanic)[0].value}
                    onChange={(e) => setTodaysJobChoice(e.target.value)}
                    className="w-full rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2"
                    style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                  >
                    {altOptionsFor(currentMechanic).map((opt) => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                  </select>
                </div>
              )}
            </div>
          ) : (
            <React.Fragment>
              <div className="rounded-lg p-4 mb-5 flex items-center justify-between" style={{ background: COLORS.surface, border: `2px solid ${COLORS.accent}` }}>
                <div>
                  <p className="text-xs uppercase tracking-wide" style={{ color: COLORS.inkDim }}>On shift since</p>
                  <p className="font-display text-lg font-bold">{fmtTime(openProductionShift.start)}</p>
                </div>
              </div>

              <Section label="Machine">
                {roleFor(currentMechanic) === 'employee' ? (
                  <div className="rounded-lg px-4 py-2.5 text-base font-semibold" style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}>
                    🚜 {openProductionShift.machine}
                  </div>
                ) : (
                  <Select value={openProductionShift.machine} onChange={(e) => patchOpenProductionShift({ machine: e.target.value })}>
                    {units.filter((u) => u && MACHINE_TYPE_LABELS[unitTypes[slugForUnit(u)]]).map((u) => <option key={u} value={u}>{u}</option>)}
                  </Select>
                )}
              </Section>

              {activeType !== 'fuel' && activeType !== 'winch' && (
                <Section label="Block number">
                  <div className="flex gap-2">
                    <Select value={openProductionShift.block} onChange={(e) => patchOpenProductionShift({ block: e.target.value })} className="flex-1">
                      <option value="" disabled>Select block…</option>
                      {blocks.map((b) => <option key={b} value={b}>{b}</option>)}
                    </Select>
                  </div>
                  <div className="flex gap-2 mt-2">
                    <TextInput value={newBlockText} onChange={(e) => setNewBlockText(e.target.value)} placeholder="Add new block, e.g. 40-A" className="flex-1" />
                    <Btn onClick={async () => { await addBlock(newBlockText); patchOpenProductionShift({ block: newBlockText.trim() }); setNewBlockText(''); }} disabled={!newBlockText.trim()}>Add</Btn>
                  </div>
                </Section>
              )}

              {activeType !== 'crawler' && activeType !== 'grader' && activeType !== 'winch' && activeType !== 'fuel' && (
                <Section label="Machine hours">
                  <div className="grid grid-cols-2 gap-3">
                    <TextInput type="number" inputMode="decimal" placeholder="Start" value={openProductionShift.startHours} onChange={(e) => patchOpenProductionShift({ startHours: e.target.value })} />
                    <TextInput type="number" inputMode="decimal" placeholder="End" value={openProductionShift.endHours} onChange={(e) => patchOpenProductionShift({ endHours: e.target.value })} />
                  </div>
                </Section>
              )}

              {activeType === 'buncher' && (
                <Section label="Tree count (end of shift)">
                  <TextInput type="number" inputMode="numeric" placeholder="0" value={openProductionShift.trees} onChange={(e) => patchOpenProductionShift({ trees: e.target.value })} />
                </Section>
              )}
              {(activeType === 'skidder' || activeType === 'processor') && (
                <Section label="Production count (end of shift)">
                  <div className="grid grid-cols-2 gap-3">
                    <TextInput type="number" inputMode="numeric" placeholder="Spruce" value={openProductionShift.spruce} onChange={(e) => patchOpenProductionShift({ spruce: e.target.value })} />
                    <TextInput type="number" inputMode="numeric" placeholder="Aspen" value={openProductionShift.aspen} onChange={(e) => patchOpenProductionShift({ aspen: e.target.value })} />
                  </div>
                </Section>
              )}
              {activeType === 'loader' && (
                <Section label="Load count (end of shift)">
                  <div className="grid grid-cols-2 gap-3">
                    <TextInput type="number" inputMode="numeric" placeholder="Loads" value={openProductionShift.loadCount} onChange={(e) => patchOpenProductionShift({ loadCount: e.target.value })} />
                    <TextInput type="number" inputMode="numeric" placeholder="Top piles" value={openProductionShift.topPileCount} onChange={(e) => patchOpenProductionShift({ topPileCount: e.target.value })} />
                  </div>
                </Section>
              )}
              {activeType === 'fuel' && (
                <Section label="Fuel delivery log">
                  <div className="space-y-2">
                    {units.filter((u) => u && MACHINE_TYPE_LABELS[unitTypes[slugForUnit(u)]] && unitTypes[slugForUnit(u)] !== 'fuel').map((u) => (
                      <div key={u} className="rounded-lg p-3 flex items-center justify-between" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
                        <span className="text-sm">{u}</span>
                        <div className="flex items-center gap-2">
                          <input
                            type="number" inputMode="decimal" placeholder="0"
                            value={((openProductionShift.fuelLog || {})[u] || [''])[0] || ''}
                            onChange={(e) => patchOpenProductionShift({ fuelLog: { ...openProductionShift.fuelLog, [u]: [e.target.value] } })}
                            className="w-20 rounded-lg px-2 py-1.5 text-sm text-right font-mono focus:outline-none focus:ring-2"
                            style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                          />
                          <span className="text-xs" style={{ color: COLORS.inkDim }}>L</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </Section>
              )}

              <ExtraTasksEditor shift={openProductionShift} onAdd={addExtraTask} onRemove={removeExtraTask} />

              <Section label="Notes">
                <textarea
                  value={openProductionShift.notes}
                  onChange={(e) => patchOpenProductionShift({ notes: e.target.value })}
                  placeholder="Anything else worth logging…"
                  rows={3}
                  className="w-full rounded-lg px-4 py-2.5 text-base focus:outline-none focus:ring-2 resize-none"
                  style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                />
              </Section>

              <DowntimeButton onLog={logDowntime} />

              <div className="mt-6 flex gap-2">
                {altOptionsFor(currentMechanic).length > 1 && (
                  <Btn variant="ghost" onClick={() => setShowSwitchMachine(true)} className="flex-1">🔄 Switch Machine</Btn>
                )}
                <Btn onClick={attemptProductionClockOut} className="flex-1">Clock Out</Btn>
              </div>
              {showSwitchMachine && (
                <div style={{ position: 'fixed', inset: 0, zIndex: 150, background: 'rgba(0,0,0,0.75)', display: 'flex', alignItems: 'flex-end' }} onClick={() => setShowSwitchMachine(false)}>
                  <div className="w-full p-5" style={{ background: COLORS.bg, borderRadius: '16px 16px 0 0', border: `2px solid ${COLORS.line}`, borderBottom: 'none' }} onClick={(e) => e.stopPropagation()}>
                    <h2 className="font-display text-lg font-bold mb-1">Switch machine</h2>
                    <p className="text-xs mb-3" style={{ color: COLORS.inkDim }}>
                      Moving to a different kind of machine finalizes today's numbers on this one first, then opens a fresh shift — keeping each machine's production separate. Switching between two units of the same type just relabels this shift.
                    </p>
                    <div className="space-y-2">
                      {altOptionsFor(currentMechanic).filter((opt) => opt.value !== '__mechanic__' && opt.value !== openProductionShift.machine).map((opt) => (
                        <button
                          key={opt.value}
                          onClick={() => requestMachineSwitch(opt.value)}
                          className="w-full text-left rounded-lg p-3 font-display font-semibold"
                          style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                        >
                          {opt.label}
                        </button>
                      ))}
                    </div>
                    <button onClick={() => setShowSwitchMachine(false)} className="text-xs underline mt-3 block" style={{ color: COLORS.inkDim }}>Cancel</button>
                  </div>
                </div>
              )}
            </React.Fragment>
          )}

          {activeType === 'winch' && (
            <DriverLogSection
              driver={currentMechanic}
              openLog={openDriverLog}
              allLogs={driverLogs}
              onStart={(odo) => startDriverLog(odo, effectiveUnit)}
              onAddStatus={addDriverStatusChange}
              onEnd={endDriverLog}
              onUpdateStatusChange={updateDriverStatusChange}
              hasValidInspection={hasValidInspection(effectiveUnit, currentMechanic)}
              inspectionHoursRemaining={(() => {
                const latest = latestInspectionFor(effectiveUnit, currentMechanic);
                if (!latest) return null;
                const elapsedHrs = (Date.now() - new Date(latest.time).getTime()) / (1000 * 60 * 60);
                return 24 - elapsedHrs;
              })()}
              onOpenPreTrip={() => setShowPreTripForm(true)}
              onOpenInspectionMode={() => setShowInspectionMode(true)}
              isAdmin={isAdmin}
            />
          )}

          {activeType === 'winch' && (
            <DriverRecentLogsSection
              driver={currentMechanic}
              allLogs={driverLogs}
              onBackfillOffDuty={backfillOffDutyDriverLogs}
            />
          )}

          <ProductionClockOutReviewOverlay
            show={showProductionClockOutReview}
            shift={openProductionShift}
            mechanic={currentMechanic}
            unitTypes={unitTypes}
            isSwitch={!!pendingSwitchMachine}
            onConfirm={pendingSwitchMachine ? confirmMachineSwitch : confirmProductionClockOut}
            onCancel={() => { setShowProductionClockOutReview(false); setPendingSwitchMachine(null); }}
          />

          <ProductionShiftHistory
            shifts={myProductionShifts}
            editingId={editingShiftId}
            onEdit={(id) => setEditingShiftId(id)}
            onCancelEdit={() => setEditingShiftId(null)}
            onSave={updateProductionShift}
            onDelete={deleteProductionShift}
            unitTypes={unitTypes}
            units={units}
            isAdmin={isAdmin}
          />
        </div>
      </div>
    );
  }

  if (screen === 'timeclock') {
    const myEntries = timesheets
      .filter((t) => t.mechanic === currentMechanic)
      .slice()
      .sort((a, b) => b.date.localeCompare(a.date) || (b.clockIn || '').localeCompare(a.clockIn || ''));
    const onLunch = openEntry && openEntry.lunchStart && !openEntry.lunchEnd;

    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <OfflineBanner isOnline={isOnline} />
        <div className="max-w-2xl mx-auto">
          <button onClick={() => setScreen(landingScreenFor(currentMechanic))} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>
          <h1 className="font-display text-3xl font-bold mb-2">{t('timeClock')}</h1>
          <p className="text-sm mb-8" style={{ color: COLORS.inkDim }}>{currentMechanic}</p>

          {/* Current status card */}
          <div className="rounded-lg p-6 mb-8 text-center" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
            {!openEntry ? (
              <React.Fragment>
                <p className="text-base mb-5" style={{ color: COLORS.inkDim }}>{t('notClockedIn')}</p>
                <Btn onClick={clockIn} disabled={timeClockActionPending}>{timeClockActionPending ? '…' : t('clockIn')}</Btn>
                {hasAltRole(currentMechanic) && (
                  <div className="mt-4 text-left">
                    <label className="block text-xs mb-1" style={{ color: COLORS.inkDim }}>Working as today:</label>
                    <select
                      value={todaysJobChoice || altOptionsFor(currentMechanic)[0].value}
                      onChange={(e) => { setTodaysJobChoice(e.target.value); setScreen('shift'); }}
                      className="w-full rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2"
                      style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                    >
                      {altOptionsFor(currentMechanic).map((opt) => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                    </select>
                  </div>
                )}
              </React.Fragment>
            ) : (
              <React.Fragment>
                <p className="font-mono text-sm mb-1" style={{ color: COLORS.inkDim }}>{t('clockedInAt')}</p>
                <p className="font-display text-2xl font-bold mb-5">{fmtTime(openEntry.clockIn)}</p>

                {onLunch ? (
                  <React.Fragment>
                    <p className="text-sm mb-4" style={{ color: COLORS.progress }}>{t('onBreakSince')} {fmtTime(openEntry.lunchStart)}</p>
                    <Btn onClick={endLunch} disabled={timeClockActionPending}>{timeClockActionPending ? '…' : t('endBreak')}</Btn>
                  </React.Fragment>
                ) : (
                  <div className="flex flex-col gap-3 items-center">
                    {openEntry.lunchStart && openEntry.lunchEnd && (
                      <p className="text-xs font-mono" style={{ color: COLORS.inkDim }}>
                        {t('breakLabel')}: {fmtTime(openEntry.lunchStart)} – {fmtTime(openEntry.lunchEnd)}
                      </p>
                    )}
                    <div className="flex gap-3">
                      {!openEntry.lunchStart && (
                        <Btn variant="ghost" onClick={startLunch} disabled={timeClockActionPending}>{timeClockActionPending ? '…' : t('startBreak')}</Btn>
                      )}
                      <Btn onClick={attemptClockOut} disabled={timeClockActionPending}>{t('clockOut')}</Btn>
                    </div>
                  </div>
                )}
              </React.Fragment>
            )}
          </div>

          {lunchPrompt && (
            <div className="fixed inset-0 z-50 p-6" style={{ background: 'rgba(0,0,0,0.75)', minHeight: '100vh' }}>
              <div className="w-full max-w-xs mx-auto my-8 rounded-2xl p-6 overflow-y-auto" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}`, maxHeight: '85vh' }}>
                <p className="font-display text-lg font-bold mb-3 text-center">{t('noBreakLoggedToday')}</p>
                <p className="text-sm mb-5 text-center" style={{ color: COLORS.inkDim }}>
                  {t('goBackBreakReminder')}
                </p>
                <div className="flex flex-col gap-2">
                  <Btn variant="ghost" onClick={() => setLunchPrompt(false)}>{t('goBack')}</Btn>
                  <Btn variant="danger" onClick={() => { setLunchPrompt(false); setPendingClockOutSkippedLunch(true); }}>{t('workedStraightThrough')}</Btn>
                </div>
              </div>
            </div>
          )}

          <ClockOutReviewOverlay
            show={pendingClockOutSkippedLunch !== null}
            openEntry={openEntry}
            skippedLunch={pendingClockOutSkippedLunch}
            mechanic={currentMechanic}
            onConfirm={(signature) => clockOut(pendingClockOutSkippedLunch, signature)}
            onCancel={() => setPendingClockOutSkippedLunch(null)}
          />

          {/* Jobs worked on today */}
          {openEntry && (
            <div className="mb-8">
              <h2 className="font-display text-lg font-semibold uppercase tracking-wide mb-4">{t('whatDidYouWorkOn')}</h2>
              <TimesheetJobsEditor entry={openEntry} onAdd={addTimesheetJob} onRemove={removeTimesheetJob} />
            </div>
          )}

          {/* Add a missed day */}
          {showAddMissedDay ? (
            <AddMissedDayForm
              t={t}
              defaultMechanic={currentMechanic}
              onSubmit={async (mechanicName, date, ci, co, ls, le, setError) => {
                if (isWeekApproved(weekStartOf(date))) {
                  setError("That week's already been approved — ask admin to add this one for you.");
                  return;
                }
                await addManualEntry(mechanicName, date, ci, co, ls, le);
                setShowAddMissedDay(false);
              }}
              onCancel={() => setShowAddMissedDay(false)}
            />
          ) : (
            <button
              onClick={() => setShowAddMissedDay(true)}
              className="w-full text-center text-sm font-display uppercase tracking-wide mb-8 py-3 rounded-lg"
              style={{ color: COLORS.accent, background: COLORS.surface, border: `2px dashed ${COLORS.accent}` }}
            >
              + Add a missed day
            </button>
          )}

          {/* Past entries */}
          <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
            <h2 className="font-display text-sm font-bold uppercase tracking-wide mb-1">{t('checkMyHours')}</h2>
            <p className="text-xs mb-3" style={{ color: COLORS.inkDim }}>
              {t('checkMyHoursHelp')}
            </p>
            <div className="grid grid-cols-2 gap-3 mb-3">
              <label className="block">
                <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>{t('from')}</span>
                <input
                  type="date"
                  value={mySummaryStart}
                  onChange={(e) => setMySummaryStart(e.target.value)}
                  className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                  style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                />
              </label>
              <label className="block">
                <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>{t('to')}</span>
                <input
                  type="date"
                  value={mySummaryEnd}
                  onChange={(e) => setMySummaryEnd(e.target.value)}
                  className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                  style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                />
              </label>
            </div>
            {mySummaryStart && mySummaryEnd ? (
              <p className="font-display text-xl font-bold" style={{ color: COLORS.accent }}>
                {fmtHours(
                  myEntries
                    .filter((e) => e.date >= mySummaryStart && e.date <= mySummaryEnd)
                    .reduce((sum, e) => sum + entryHours(e), 0)
                )}
              </p>
            ) : (
              <p className="text-sm" style={{ color: COLORS.line }}>{t('pickBothDates')}</p>
            )}
          </div>

          <h2 className="font-display text-lg font-semibold uppercase tracking-wide mb-4">Your recent shifts</h2>
          {myEntries.length === 0 ? (
            <p className="text-sm" style={{ color: COLORS.line }}>No shifts logged yet.</p>
          ) : (
            <div className="space-y-3">
              {myEntries.map((entry) => (
                <TimesheetEntryCard
                  key={entry.id}
                  entry={entry}
                  locked={isWeekApproved(weekStartOf(entry.date))}
                  canEdit={isAdmin || !isWeekApproved(weekStartOf(entry.date))}
                  isEditing={editingEntryId === entry.id}
                  onEdit={() => setEditingEntryId(entry.id)}
                  onCancelEdit={() => setEditingEntryId(null)}
                  onSave={async (patch) => {
                    await updateTimesheetEntry(entry.id, patch);
                    setEditingEntryId(null);
                  }}
                  onDelete={() => deleteTimesheetEntry(entry.id)}
                  onAddJob={addTimesheetJob}
                  onRemoveJob={removeTimesheetJob}
                  isAdmin={isAdmin}
                />
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ---------- TIMESHEETS (admin only) ----------
  if (screen === 'timesheets') {
    if (!isAdmin && !isSafety) {
      return (
        <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8 flex items-center justify-center">
          {FONT_STYLE}
          <div className="text-center">
            <p className="font-display text-lg font-bold mb-4">Admins only</p>
            <Btn onClick={() => setScreen(landingScreenFor(currentMechanic))}>Back to board</Btn>
          </div>
        </div>
      );
    }

    const filtered = timesheets.filter((t) => {
      if (tsFilterMechanic && t.mechanic !== tsFilterMechanic) return false;
      if (tsFilterStart && t.date < tsFilterStart) return false;
      if (tsFilterEnd && t.date > tsFilterEnd) return false;
      return true;
    });

    const totalsByMechanic = {};
    filtered.forEach((e) => {
      totalsByMechanic[e.mechanic] = (totalsByMechanic[e.mechanic] || 0) + entryHours(e);
    });

    // Group shifts by mechanic (each person's shifts together, newest first)
    // instead of interleaving everyone by date.
    const groupedByMechanic = {};
    filtered.forEach((e) => {
      if (!groupedByMechanic[e.mechanic]) groupedByMechanic[e.mechanic] = [];
      groupedByMechanic[e.mechanic].push(e);
    });
    Object.values(groupedByMechanic).forEach((list) => list.sort((a, b) => b.date.localeCompare(a.date)));
    const mechanicGroups = Object.keys(groupedByMechanic).sort((a, b) => a.localeCompare(b));

    const clockedInNow = timesheets.filter((t) => !t.clockOut && t.date === todayStr());
    const baseWeekStart = weekStartOf(todayStr());
    const viewedWeekStart = (() => {
      const d = new Date(baseWeekStart + 'T00:00:00');
      d.setDate(d.getDate() + tsWeekOffset * 7);
      return d.toISOString().slice(0, 10);
    })();
    const viewedWeekEnd = weekEndOf(viewedWeekStart);
    const weekEntries = timesheets.filter((t) => t.date >= viewedWeekStart && t.date <= viewedWeekEnd);
    const weekTotalsByMechanic = {};
    weekEntries.forEach((e) => {
      weekTotalsByMechanic[e.mechanic] = (weekTotalsByMechanic[e.mechanic] || 0) + entryHours(e);
    });
    const weekApproved = isWeekApproved(viewedWeekStart);

    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <OfflineBanner isOnline={isOnline} />
        <div className="max-w-3xl mx-auto">
          <button onClick={() => setScreen(landingScreenFor(currentMechanic))} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>
          <div className="flex items-center justify-between mb-8">
            <h1 className="font-display text-3xl font-bold">Timesheets</h1>
            <button onClick={() => setShowTimesheetMigration(true)} className="text-xs underline" style={{ color: COLORS.inkDim }}>🔄 Data migration</button>
          </div>

          {/* Who's clocked in right now */}
          <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
            <h2 className="font-display text-sm font-bold uppercase tracking-wide mb-3">Clocked in right now</h2>
            {clockedInNow.length === 0 ? (
              <p className="text-sm" style={{ color: COLORS.line }}>Nobody's clocked in at the moment.</p>
            ) : (
              <div className="space-y-2">
                {clockedInNow.map((t) => (
                  <div key={t.id} className="flex items-center justify-between">
                    <span className="font-display font-semibold">🟢 {t.mechanic}</span>
                    <span className="font-mono text-sm" style={{ color: COLORS.inkDim }}>
                      since {fmtTime(t.clockIn)}{t.lunchStart && !t.lunchEnd ? ' (on break)' : ''}
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Weekly totals, overtime flag, and approval */}
          <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
            <div className="flex items-center justify-between mb-4">
              <button onClick={() => setTsWeekOffset(tsWeekOffset - 1)} className="text-lg px-2" style={{ color: COLORS.inkDim }}>←</button>
              <div className="text-center">
                <p className="font-display font-bold">{fmtWeekRange(viewedWeekStart)}</p>
                {weekApproved && (
                  <p className="text-xs font-semibold mt-1" style={{ color: COLORS.done }}>
                    ✓ Approved by {timesheetApprovals[viewedWeekStart].approvedBy}
                  </p>
                )}
              </div>
              <button
                onClick={() => setTsWeekOffset(Math.min(0, tsWeekOffset + 1))}
                disabled={tsWeekOffset >= 0}
                className="text-lg px-2"
                style={{ color: COLORS.inkDim, opacity: tsWeekOffset >= 0 ? 0.3 : 1 }}
              >
                →
              </button>
            </div>

            {Object.keys(weekTotalsByMechanic).length === 0 ? (
              <p className="text-sm text-center mb-4" style={{ color: COLORS.line }}>No shifts this week.</p>
            ) : (
              <div className="space-y-2 mb-4">
                {Object.entries(weekTotalsByMechanic).map(([name, hours]) => (
                  <div key={name} className="flex items-center justify-between py-1">
                    <span className="font-display font-semibold">{name}</span>
                    <span className="font-mono flex items-center gap-2">
                      <span style={{ color: COLORS.ink }}>{fmtHours(hours)}</span>
                    </span>
                  </div>
                ))}
              </div>
            )}

            {weekApproved ? (
              <Btn variant="ghost" onClick={() => unapproveWeek(viewedWeekStart)}>Un-approve this week</Btn>
            ) : (
              <div className="flex gap-2 flex-wrap">
                <Btn onClick={() => approveWeek(viewedWeekStart)} disabled={Object.keys(weekTotalsByMechanic).length === 0}>
                  Approve this week
                </Btn>
                <Btn variant="ghost" onClick={() => setShowWeekTable((s) => !s)} disabled={weekEntries.length === 0}>
                  {showWeekTable ? '✕ Hide table' : '👁️ View here'}
                </Btn>
                <Btn variant="ghost" onClick={() => exportTimesheets(weekEntries, [], 'week-review', viewedWeekStart, weekEndOf(viewedWeekStart))} disabled={weekEntries.length === 0}>
                  📊 Open as spreadsheet
                </Btn>
                <Btn variant="ghost" onClick={() => window.print()} disabled={weekEntries.length === 0}>
                  🖨️ Print
                </Btn>
              </div>
            )}
            {showWeekTable && (
              <React.Fragment>
                <WeekReviewTable entries={weekEntries} />
                <PrintPortal>
                  <WeekReviewTable entries={tsFilterMechanic ? weekEntries.filter((e) => e.mechanic === tsFilterMechanic) : weekEntries} printMode />
                </PrintPortal>
              </React.Fragment>
            )}
            <p className="text-xs mt-3 no-print" style={{ color: COLORS.line }}>
              Approving a week locks it — mechanics can no longer edit shifts within it themselves.
            </p>
          </div>

          {/* Email settings */}
          <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
            <h2 className="font-display text-sm font-bold uppercase tracking-wide mb-4">Automatic reports</h2>

            <EmailListEditor
              label="Weekly timesheet — sends every Monday"
              helper="Anyone who should get the weekly timesheet CSV (comma-separated for more than one)"
              value={(timesheetSettings.weeklyEmails || []).join(', ')}
              onSave={(list) => saveTimesheetSettings({ ...timesheetSettings, weeklyEmails: list })}
            />

            <EmailListEditor
              label="Weekly backup — sends every Monday"
              helper="Anyone who should get the full app backup file (usually just you)"
              value={(timesheetSettings.backupEmails || []).join(', ')}
              onSave={(list) => saveTimesheetSettings({ ...timesheetSettings, backupEmails: list })}
            />

            <EmailListEditor
              label="Monthly hours summary — sends the 1st of each month"
              helper="One email for whoever handles payroll/books — a simple total-hours-per-person report for last month"
              value={(timesheetSettings.monthlyEmail || '')}
              single
              onSave={(list) => saveTimesheetSettings({ ...timesheetSettings, monthlyEmail: list[0] || '' })}
            />

            <label className="flex items-center justify-between gap-3 cursor-pointer mt-2">
              <div>
                <span className="text-sm font-semibold block" style={{ color: COLORS.ink }}>Weekly emails turned on</span>
                <span className="text-xs" style={{ color: COLORS.line }}>Turn off to pause the weekly timesheet and backup emails without deleting the addresses above. The monthly summary isn't affected by this.</span>
              </div>
              <input
                type="checkbox"
                checked={!!timesheetSettings.autoEmail}
                onChange={(e) => saveTimesheetSettings({ ...timesheetSettings, autoEmail: e.target.checked })}
                className="w-5 h-5 flex-shrink-0"
                style={{ accentColor: COLORS.accent }}
              />
            </label>
          </div>

          {/* Add a missed day (any employee) */}
          {showAddMissedDayAdmin ? (
            <AddMissedDayForm
              t={t}
              mechanics={mechanics}
              onSubmit={async (mechanicName, date, ci, co, ls, le, setError) => {
                await addManualEntry(mechanicName, date, ci, co, ls, le);
                setShowAddMissedDayAdmin(false);
              }}
              onCancel={() => setShowAddMissedDayAdmin(false)}
            />
          ) : (
            <button
              onClick={() => setShowAddMissedDayAdmin(true)}
              className="w-full text-center text-sm font-display uppercase tracking-wide mb-6 py-3 rounded-lg"
              style={{ color: COLORS.accent, background: COLORS.surface, border: `2px dashed ${COLORS.accent}` }}
            >
              + Add a missed day for someone
            </button>
          )}

          {/* Filters */}
          <div className="rounded-lg p-5 mb-6" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
            <select
              value={tsFilterMechanic}
              onChange={(e) => setTsFilterMechanic(e.target.value)}
              className="w-full rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2"
              style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
            >
              <option value="">Everyone</option>
              {mechanics.map((m) => <option key={m} value={m}>{m}</option>)}
            </select>
            <div className="grid grid-cols-2 gap-3 mt-3">
                <label className="block">
                  <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>From</span>
                  <input
                    type="date"
                    value={tsFilterStart}
                    onChange={(e) => setTsFilterStart(e.target.value)}
                    className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                    style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                  />
                </label>
                <label className="block">
                  <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>To</span>
                  <input
                    type="date"
                    value={tsFilterEnd}
                    onChange={(e) => setTsFilterEnd(e.target.value)}
                    className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                    style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                  />
                </label>
              </div>
          </div>

          <div className="flex items-center justify-between mb-4">
            <h2 className="font-display text-lg font-semibold uppercase tracking-wide">Totals</h2>
            <Btn variant="ghost" onClick={() => exportTimesheets(filtered, [], undefined, tsFilterStart, tsFilterEnd)}>📤 Export & Share</Btn>
          </div>

          {Object.keys(totalsByMechanic).length === 0 ? (
            <p className="text-sm mb-8" style={{ color: COLORS.line }}>No shifts in this range.</p>
          ) : (
            <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
              {Object.entries(totalsByMechanic).map(([name, hours]) => (
                <div key={name} className="flex items-center justify-between py-2" style={{ borderBottom: `1px solid ${COLORS.line}` }}>
                  <span className="font-display font-semibold">{name}</span>
                  <span className="font-mono">{fmtHours(hours)}</span>
                </div>
              ))}
            </div>
          )}

          {tsFilterMechanic && (
          <React.Fragment>
          <h2 className="font-display text-lg font-semibold uppercase tracking-wide mb-4">All shifts</h2>
          <p className="text-xs mb-4" style={{ color: COLORS.line }}>As an admin, you can edit or delete anyone's shift here — including in approved weeks.</p>
          {filtered.length === 0 ? (
            <p className="text-sm" style={{ color: COLORS.line }}>Nothing to show yet.</p>
          ) : (
            <div className="space-y-6">
              {mechanicGroups.map((name) => (
                <div key={name}>
                  <p
                    className="font-display text-xs uppercase tracking-wide mb-2 pb-2 flex items-center justify-between"
                    style={{ color: COLORS.accent, borderBottom: `1px solid ${COLORS.line}` }}
                  >
                    <span>{name}</span>
                    <span>{fmtHours(totalsByMechanic[name] || 0)} total</span>
                  </p>
                  <div className="space-y-3">
                    {groupedByMechanic[name].map((entry) => (
                      <TimesheetEntryCard
                        key={entry.id}
                        entry={entry}
                        locked={false}
                        canEdit={true}
                        isEditing={editingEntryId === entry.id}
                        onEdit={() => setEditingEntryId(entry.id)}
                        onCancelEdit={() => setEditingEntryId(null)}
                        onSave={async (patch) => {
                          await updateTimesheetEntry(entry.id, patch);
                          setEditingEntryId(null);
                        }}
                        onDelete={() => deleteTimesheetEntry(entry.id)}
                        onAddJob={addTimesheetJob}
                        onRemoveJob={removeTimesheetJob}
                        isAdmin={isAdmin}
                      />
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
          </React.Fragment>
          )}
        </div>

        {showTimesheetMigration && (
          <DataMigrationOverlay onClose={() => setShowTimesheetMigration(false)} />
        )}
      </div>
    );
  }

  // ---------- TEAM (admin only) ----------
  if (screen === 'timesheets' || screen === 'team') {
    setScreen('admin');
    return null;
  }

  // ---------- ADMIN (consolidated: team, payroll, production, billing) ----------
  if (screen === 'admin') {
    if (!isAdmin && !isForeman && !isSafety) {
      return (
        <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8 flex items-center justify-center">
          {FONT_STYLE}
          <div className="text-center">
            <p className="font-display text-lg font-bold mb-4">Admins only</p>
            <Btn onClick={() => setScreen(landingScreenFor(currentMechanic))}>Back to board</Btn>
          </div>
        </div>
      );
    }

    const filtered = timesheets.filter((t) => {
      if (tsFilterMechanic && t.mechanic !== tsFilterMechanic) return false;
      if (tsFilterStart && t.date < tsFilterStart) return false;
      if (tsFilterEnd && t.date > tsFilterEnd) return false;
      return true;
    });
    const filteredProduction = productionShifts.filter((s) => {
      if (!s.end) return false;
      const d = s.end.slice(0, 10);
      if (tsFilterMechanic && s.employee !== tsFilterMechanic) return false;
      if (tsFilterStart && d < tsFilterStart) return false;
      if (tsFilterEnd && d > tsFilterEnd) return false;
      return true;
    });
    const totalsByMechanic = {};
    filtered.forEach((e) => { totalsByMechanic[e.mechanic] = (totalsByMechanic[e.mechanic] || 0) + entryHours(e); });
    const groupedByMechanic = {};
    filtered.forEach((e) => {
      if (!groupedByMechanic[e.mechanic]) groupedByMechanic[e.mechanic] = [];
      groupedByMechanic[e.mechanic].push(e);
    });
    Object.values(groupedByMechanic).forEach((list) => list.sort((a, b) => b.date.localeCompare(a.date)));
    const mechanicGroups = Object.keys(groupedByMechanic).sort((a, b) => a.localeCompare(b));
    const clockedInNow = timesheets.filter((t) => !t.clockOut && t.date === todayStr());

    const baseWeekStart = weekStartOf(todayStr());
    const viewedWeekStart = (() => {
      const d = new Date(baseWeekStart + 'T00:00:00');
      d.setDate(d.getDate() + tsWeekOffset * 7);
      return d.toISOString().slice(0, 10);
    })();
    const viewedWeekEnd = weekEndOf(viewedWeekStart);
    const weekEntries = timesheets.filter((t) => t.date >= viewedWeekStart && t.date <= viewedWeekEnd);
    const weekTotalsByMechanic = {};
    weekEntries.forEach((e) => { weekTotalsByMechanic[e.mechanic] = (weekTotalsByMechanic[e.mechanic] || 0) + entryHours(e); });
    const weekApproved = isWeekApproved(viewedWeekStart);

    const productionClockedInNow = productionShifts.filter((s) => !s.end);
    const recentProductionShifts = productionShifts.filter((s) => s.end).sort((a, b) => b.end.localeCompare(a.end)).slice(0, 20);

    // Combined weekly breakdown for Timesheets — everyone, grouped by job
    // the same way the Employees picker is, with hours plus whatever
    // production number fits their actual machine. Extra/billable hours are
    // tracked separately and never folded into the hours total, since
    // they're for billing only. Fuel deliveries don't show a "production"
    // number here at all — that's what the Fuel Log section is for.
    const weekProductionShifts = productionShifts.filter((s) => s.end && s.end.slice(0, 10) >= viewedWeekStart && s.end.slice(0, 10) <= viewedWeekEnd);
    const productionWeekByPerson = {};
    weekProductionShifts.forEach((s) => {
      if (!productionWeekByPerson[s.employee]) {
        productionWeekByPerson[s.employee] = { hours: 0, extraHours: 0, trees: 0, spruce: 0, aspen: 0, loadCount: 0, topPileCount: 0 };
      }
      const p = productionWeekByPerson[s.employee];
      p.hours += (new Date(s.end) - new Date(s.start)) / 1000 / 60 / 60;
      p.extraHours += (s.extraTasks || []).reduce((sum, t) => sum + (parseFloat(t.hours) || 0), 0);
      p.trees += parseFloat(s.trees) || 0;
      p.spruce += parseFloat(s.spruce) || 0;
      p.aspen += parseFloat(s.aspen) || 0;
      p.loadCount += parseFloat(s.loadCount) || 0;
      p.topPileCount += parseFloat(s.topPileCount) || 0;
    });
    const weekGroups = groupedEmployees().map((group) => ({
      ...group,
      names: group.names.filter((n) => (group.label === 'Mechanics' ? weekTotalsByMechanic[n] !== undefined : productionWeekByPerson[n])),
    })).filter((group) => group.names.length > 0);
    // Safety net: a name might have real hours this week but not exactly
    // match anyone in the current roster (a rename, a spelling difference,
    // anything) — that must never mean the data silently vanishes from
    // view. Catch anything not already shown above and surface it plainly.
    const namesAlreadyShown = new Set(weekGroups.flatMap((g) => g.names));
    const orphanedMechanicNames = Object.keys(weekTotalsByMechanic).filter((n) => !namesAlreadyShown.has(n));
    const orphanedProductionNames = Object.keys(productionWeekByPerson).filter((n) => !namesAlreadyShown.has(n));
    if (orphanedMechanicNames.length > 0 || orphanedProductionNames.length > 0) {
      weekGroups.push({ label: "Needs attention — name doesn't match current roster", names: [...orphanedMechanicNames, ...orphanedProductionNames] });
    }

    // Fuel Log — a completely separate concern from Timesheets/payroll,
    // purely informational tracking of who delivered how much fuel to which
    // unit and when.
    const fuelDeliveries = [];
    productionShifts.forEach((s) => {
      if (machineType(s.machine, unitTypes) !== 'fuel' || !s.fuelLog) return;
      Object.entries(s.fuelLog).forEach(([receivingUnit, amounts]) => {
        const liters = (amounts || []).reduce((sum, v) => sum + (parseFloat(v) || 0), 0);
        if (liters > 0) {
          fuelDeliveries.push({ date: (s.end || s.start || '').slice(0, 10), truck: s.machine, receivingUnit, liters });
        }
      });
    });
    const fuelByUnit = {};
    fuelDeliveries.forEach((d) => {
      if (!fuelByUnit[d.receivingUnit]) fuelByUnit[d.receivingUnit] = { total: 0, monthly: {} };
      fuelByUnit[d.receivingUnit].total += d.liters;
      const month = d.date.slice(0, 7);
      fuelByUnit[d.receivingUnit].monthly[month] = (fuelByUnit[d.receivingUnit].monthly[month] || 0) + d.liters;
    });
    const fuelGroups = [];
    Object.entries(MACHINE_TYPE_LABELS).forEach(([type, label]) => {
      const unitsOfType = units.filter((u) => u && unitTypes[slugForUnit(u)] === type && fuelByUnit[u]);
      if (unitsOfType.length > 0) fuelGroups.push({ label, units: unitsOfType });
    });
    const taggedFuelUnits = new Set(fuelGroups.flatMap((g) => g.units));
    const untrackedUnits = Object.keys(fuelByUnit).filter((u) => !taggedFuelUnits.has(u));
    if (untrackedUnits.length > 0) fuelGroups.push({ label: 'Other', units: untrackedUnits });

    // Log Book — grouped into one folder per driver, since there may be
    // more than one winch truck driver eventually. A driver's folder shows
    // up here as soon as they've ever logged anything, regardless of the
    // currently viewed week.
    const driverLogWeekStart = (() => {
      const d = new Date(weekStartOf(todayStr()) + 'T00:00:00');
