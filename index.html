                          <div className="flex items-center gap-2 mt-2 pt-2" style={{ borderTop: `1px solid ${COLORS.line}` }}>
                            <div className="flex items-center justify-center flex-shrink-0" style={{ width: 32, height: 32, background: COLORS.surface, borderRadius: 6, border: `1px solid ${COLORS.line}` }}>
                              {customUrl || fallbackImage ? (
                                <img src={customUrl || fallbackImage} alt={u} style={{ maxWidth: '100%', maxHeight: '100%', objectFit: 'contain' }} />
                              ) : (
                                <span style={{ fontSize: '1rem' }}>{MACHINE_ICONS[uType] || '📍'}</span>
                              )}
                            </div>
                            <span className="text-xs flex-1" style={{ color: COLORS.inkDim }}>
                              {customUrl ? `Custom icon for ${u}` : 'Using the type default'}
                            </span>
                            <label
                              className="text-xs font-semibold px-2 py-1.5 rounded-lg whitespace-nowrap cursor-pointer flex-shrink-0"
                              style={{ background: COLORS.surface, color: COLORS.accent, border: `1px solid ${COLORS.accent}` }}
                            >
                              {isUploading ? 'Uploading…' : 'Upload'}
                              <input
                                type="file"
                                accept="image/*"
                                className="hidden"
                                disabled={isUploading}
                                onChange={(e) => {
                                  const file = e.target.files && e.target.files[0];
                                  if (file) uploadUnitIcon(uSlug, file);
                                  e.target.value = '';
                                }}
                              />
                            </label>
                            {customUrl && (
                              <button onClick={() => resetUnitIcon(uSlug)} className="text-xs underline flex-shrink-0" style={{ color: COLORS.line }}>
                                Reset
                              </button>
                            )}
                          </div>
                        );
                      })()}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
            {showAddUnit ? (
              <div className="space-y-2">
                <TextInput value={newUnitName} onChange={(e) => setNewUnitName(e.target.value)} placeholder="Unit number, e.g. UNIT-104" className="w-full" />
                <select
                  value={newUnitTypeDraft}
                  onChange={(e) => setNewUnitTypeDraft(e.target.value)}
                  className="w-full rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2"
                  style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                >
                  <option value="">— Untagged —</option>
                  {Object.entries(SUPPORT_TYPE_LABELS).map(([type, label]) => (
                  <option key={type} value={type}>{label}</option>
                ))}
                  {Object.entries(MACHINE_TYPE_LABELS).map(([type, label]) => (
                    <option key={type} value={type}>{label}</option>
                  ))}
                </select>
                <div className="flex gap-2">
                  <Btn onClick={async () => { await addUnit(newUnitTypeDraft); setNewUnitTypeDraft(''); }} disabled={!newUnitName.trim()}>Add unit</Btn>
                  <Btn variant="ghost" onClick={() => { setShowAddUnit(false); setNewUnitName(''); setNewUnitTypeDraft(''); }}>Cancel</Btn>
                </div>
              </div>
            ) : (
              <Btn variant="ghost" onClick={() => setShowAddUnit(true)}>+ Add unit</Btn>
            )}
          </div>
          </AdminSection>
          )}

          {isAdmin && (
          <AdminSection
            icon="📍"
            title="Block Numbers"
            expanded={expandedAdmin === 'blocks'}
            onToggle={() => setExpandedAdmin(expandedAdmin === 'blocks' ? null : 'blocks')}
          >
          <div className="rounded-lg p-5" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
            {blocks.length === 0 ? (
              <p className="text-sm mb-3" style={{ color: COLORS.inkDim }}>No blocks added yet.</p>
            ) : (
              <div className="flex flex-wrap gap-2 mb-3">
                {blocks.map((b) => (
                  <span key={b} className="text-xs font-mono rounded-lg px-2 py-1.5 flex items-center gap-2" style={{ background: COLORS.surfaceRaised, border: `1px solid ${COLORS.line}` }}>
                    {b}
                    <button
                      onClick={() => persistBlocks(blocks.filter((x) => x !== b))}
                      style={{ color: COLORS.inkDim }}
                    >
                      ×
                    </button>
                  </span>
                ))}
              </div>
            )}
            {addingBlock ? (
              <div className="flex gap-2">
                <TextInput value={newBlockText} onChange={(e) => setNewBlockText(e.target.value)} placeholder="e.g. 40-A" className="flex-1" />
                <Btn onClick={async () => { await addBlock(newBlockText); setNewBlockText(''); setAddingBlock(false); }} disabled={!newBlockText.trim()}>Add</Btn>
                <Btn variant="ghost" onClick={() => { setAddingBlock(false); setNewBlockText(''); }}>Cancel</Btn>
              </div>
            ) : (
              <Btn variant="ghost" onClick={() => setAddingBlock(true)}>+ Add block</Btn>
            )}
          </div>
          </AdminSection>
          )}

          {isAdmin && (
          <AdminSection
            icon="🔔"
            title="Push Notification Wording"
            expanded={expandedAdmin === 'push'}
            onToggle={() => setExpandedAdmin(expandedAdmin === 'push' ? null : 'push')}
          >
          <PushMessageEditor pushMessages={pushMessages} onSave={savePushMessages} />
          </AdminSection>
          )}
        </div>

        {showTimesheetMigration && (
          <DataMigrationOverlay onClose={() => setShowTimesheetMigration(false)} />
        )}
      </div>
    );
  }

  // ---------- TEAM SHOUTOUTS ----------
  if (screen === 'shoutouts') {
    const allShoutouts = [];
    orders.forEach((o) => {
      (o.notes || []).forEach((n) => {
        if (n.type === 'shoutout') {
          allShoutouts.push({ ...n, orderId: o.id, orderUnit: o.unit, orderDescription: getLocalizedText(o.description, lang) });
        }
      });
    });
    allShoutouts.sort((a, b) => new Date(b.ts) - new Date(a.ts));

    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <OfflineBanner isOnline={isOnline} />
        <div className="max-w-2xl mx-auto">
          <button onClick={() => setScreen(landingScreenFor(currentMechanic))} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>
          <h1 className="font-display text-3xl font-bold mb-2">🎉 Team Shoutouts</h1>
          <p className="text-sm mb-8" style={{ color: COLORS.inkDim }}>
            Give credit where it's due — tap into any work order and check "Make this a shoutout" on a note.
          </p>

          {allShoutouts.length === 0 ? (
            <div className="rounded-lg p-10 text-center" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>
              <p className="text-base mb-2" style={{ color: COLORS.inkDim }}>No shoutouts yet</p>
              <p className="text-sm" style={{ color: COLORS.line }}>Be the first to give someone credit for a job well done.</p>
            </div>
          ) : (
            <div className="space-y-3">
              {allShoutouts.map((s) => (
                <button
                  key={s.id}
                  onClick={() => {
                    const order = orders.find((o) => o.id === s.orderId);
                    if (order) {
                      setActiveUnit(order.unit);
                      setActiveOrderId(order.id);
                      setScreen('order');
                    }
                  }}
                  className="w-full text-left rounded-lg p-4 transition-all hover:scale-102"
                  style={{ background: 'rgba(127,163,126,0.14)', border: `1px solid ${COLORS.accent}` }}
                >
                  <div className="flex items-center justify-between mb-2">
                    <span className="font-display font-semibold text-sm" style={{ color: COLORS.accent }}>🎉 {s.author}</span>
                    <span className="font-mono text-xs" style={{ color: COLORS.line }}>{new Date(s.ts).toLocaleDateString()}</span>
                  </div>
                  <p className="text-base mb-2">{s.text}</p>
                  <p className="text-xs font-mono" style={{ color: COLORS.inkDim }}>
                    {s.orderUnit} — {s.orderDescription || t('workOrder')}
                  </p>
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ---------- MAPS ----------
  if (screen === 'maps') {
    const publicMaps = [...maps, ...localMaps].filter((m) => m.isPublic);
    const defaultMap = publicMaps.find((m) => m.isDefault) || publicMaps[0] || null;
    const currentMap = (selectedMapId && publicMaps.find((m) => m.id === selectedMapId)) || defaultMap;

    const currentMapGeoreferenced = currentMap && isMapGeoreferenced(currentMap);
    const currentMapLivePositions = (currentMap && currentMapGeoreferenced)
      ? liveFleetPositions.map((p) => {
          const px = latLngToPixel(currentMap, p.lat, p.lng);
          if (!px || px.px < 0 || px.px > currentMap.imageWidth || px.py < 0 || px.py > currentMap.imageHeight) return null;
          return {
            name: p.name, px: px.px, py: px.py, time: p.time,
            icon: MACHINE_ICONS[machineType(p.name, unitTypes)] || '📍',
            iconImage: unitIconOverrides[slugForUnit(p.name)] || machineIconOverrides[machineType(p.name, unitTypes)] || MACHINE_ICON_IMAGES[machineType(p.name, unitTypes)] || null,
          };
        }).filter(Boolean)
      : [];
    const currentMapLiveTrails = (currentMap && currentMapGeoreferenced && isAdmin)
      ? machineTracks
          .filter((tr) => !tr.endedAt && tr.points && tr.points.length > 1)
          .map((tr) => {
            const pts = tr.points.map((p) => latLngToPixel(currentMap, p.lat, p.lng)).filter(Boolean);
            return pts.length > 1 ? { points: pts.map((p) => ({ x: p.px, y: p.py })), color: colorForOperator(tr.employee) } : null;
          })
          .filter(Boolean)
      : [];

    const formatLineLength = (points) => {
      const real = realLineLength(currentMap, points, mapUnit);
      if (real !== null) return `${real.toFixed(0)} ${mapUnit === 'feet' ? 'ft' : 'm'}`;
      return `${lineLength(points).toFixed(0)} map units (calibrate this map for real measurements)`;
    };

    const currentMapMyPosition = (currentMap && currentMapGeoreferenced && myLiveLocation)
      ? (() => {
          const px = latLngToPixel(currentMap, myLiveLocation.lat, myLiveLocation.lng);
          if (!px || px.px < 0 || px.px > currentMap.imageWidth || px.py < 0 || px.py > currentMap.imageHeight) return null;
          return px;
        })()
      : null;
    // Diagnostic only — tells the calibration/troubleshooting message below
    // *why* the dot is missing, without affecting whether it's drawn.
    const myPositionStatus = !currentMapGeoreferenced
      ? null
      : !myLiveLocation
      ? 'waiting for GPS on this device'
      : currentMapMyPosition
      ? 'ok'
      : 'computed position falls outside this map\'s calibrated area — recheck the two calibration points';

    // Live preview of the walk-in-progress, converted to this map's pixel
    // space just for display — the real conversion (and the actual save)
    // happens once in stopPersonalTrackingAndSave, using whatever map is
    // current at that moment.
    const personalTrackPreviewPoints = (personalTrackingOn && currentMap && currentMapGeoreferenced)
      ? personalTrackPoints.map((p) => latLngToPixel(currentMap, p.lat, p.lng)).filter(Boolean).map((p) => ({ x: p.px, y: p.py }))
      : [];

    const stopPersonalTrackingAndSave = () => {
      setPersonalTrackingOn(false);
      if (!currentMap || !currentMapGeoreferenced || personalTrackPoints.length < 2) {
        setPersonalTrackPoints([]);
        if (personalTrackPoints.length > 0 && (!currentMap || !currentMapGeoreferenced)) {
          alert("This map isn't calibrated, so the walk can't be placed on it — nothing was saved.");
        }
        return;
      }
      const pixelPoints = personalTrackPoints.map((p) => latLngToPixel(currentMap, p.lat, p.lng)).filter(Boolean);
      setPersonalTrackPoints([]);
      if (pixelPoints.length < 2) return;
      setLinePoints(pixelPoints);
      setPendingLineSubmit(true);
    };

    return (
      <div style={{ position: 'fixed', inset: 0, background: COLORS.bg, color: COLORS.ink }} className="font-body">
        {FONT_STYLE}

        {publicMaps.length === 0 ? (
          <div className="h-full flex items-center justify-center px-5" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
            <div className="rounded-lg p-8 text-center max-w-sm" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
              <p className="text-sm mb-3" style={{ color: COLORS.inkDim }}>No public maps yet.</p>
              {(isAdmin || isForeman) ? (
                <Btn onClick={() => setShowManageMaps(true)}>Add a map</Btn>
              ) : (
                <p className="text-xs" style={{ color: COLORS.inkDim }}>Ask an admin to add one.</p>
              )}
            </div>
          </div>
        ) : (
          <React.Fragment>
            {/* Full-screen map, filling the entire area behind the overlaid controls below */}
            <div style={{ position: 'absolute', inset: 0 }}>
              <GestureMapViewport
                ref={gestureMapViewportRef}
                key={currentMap.id}
                disablePan={pencilMode}
                tapPriorityMode={placingPin || measureMode || calibratingMap}
                onCenterOnMe={currentMapMyPosition ? () => gestureMapViewportRef.current && gestureMapViewportRef.current.centerOnPoint(currentMapMyPosition.px, currentMapMyPosition.py) : null}
                personalTracking={personalTrackingOn}
                onTogglePersonalTracking={() => (personalTrackingOn ? stopPersonalTrackingAndSave() : setPersonalTrackingOn(true))}
              >
                <MapCanvas
                  viewBoxWidth={currentMap.imageWidth}
                  viewBoxHeight={currentMap.imageHeight}
                  backgroundImageUrl={currentMapImageSrc}
                  pinsToShow={mapPins.filter((p) => p.mapId === currentMap.id && canSeePin(p))}
                  linesToShow={mapLines.filter((l) => l.mapId === currentMap.id && canSeeLine(l))}
                  placingPin={placingPin}
                  measureMode={measureMode}
                  pencilMode={pencilMode}
                  drawingPoints={personalTrackingOn ? personalTrackPreviewPoints : linePoints}
                  calibrating={calibratingMap}
                  refPoints={currentMap.refPoints}
                  livePositions={currentMapLivePositions}
                  liveTrails={currentMapLiveTrails}
                  myPosition={currentMapMyPosition}
                  onMapTap={(x, y) => {
                    if (calibratingMap) {
                      setPendingCalibrationPixel({ px: x, py: y });
                    } else if (measureMode) {
                      setLinePoints((pts) => [...pts, { x, y }]);
                    } else {
                      setPendingPinPosition({ x, y });
                      setPlacingPin(false);
                    }
                  }}
                  onFreehandPoint={(x, y) => {
                    setLinePoints((pts) => {
                      const last = pts[pts.length - 1];
                      // Skip points that are too close to the last one kept —
                      // pointermove fires far more often than needed for a
                      // smooth line, and keeping every event would balloon
                      // a single stroke into hundreds of stored points.
                      if (last && Math.hypot(x - last.x, y - last.y) < 4) return pts;
                      return [...pts, { x, y }];
                    });
                  }}
                  onFreehandEnd={() => {
                    setLinePoints((pts) => {
                      if (pts.length >= 2) setPendingLineSubmit(true);
                      return pts;
                    });
                  }}
                  onPinTap={(pinId) => setViewingPinId(pinId)}
                  onLineTap={(lineId) => setViewingLineId(lineId)}
                  onLiveTap={(name) => setViewingMachineName(name)}
                />
              </GestureMapViewport>
            </div>

            {/* Overlaid controls, floating on top of the map — pointerEvents
                'none' on this outer wrapper lets pan/zoom gestures pass
                straight through in any gap between controls, while 'auto' on
                the inner content makes the actual buttons/text tappable. */}
            <div style={{ position: 'absolute', top: 0, left: 0, zIndex: 10, paddingTop: 'env(safe-area-inset-top)', pointerEvents: 'none' }}>
              <div className="px-4 pt-3" style={{ pointerEvents: 'auto' }}>
                <button
                  onClick={() => setScreen(landingScreenFor(currentMechanic))}
                  className="font-display text-xs uppercase tracking-wider font-semibold px-3 py-1.5 rounded-lg focus:outline-none"
                  style={{ color: COLORS.ink, background: 'rgba(27,31,25,0.85)', border: `1px solid ${COLORS.line}` }}
                >
                  {t('backToBoard')}
                </button>
              </div>
            </div>

            {/* Everything else lives down here now, out of the way of the
                map itself — left side, so it doesn't collide with the
                compass/center-on-me/track-me buttons on the bottom right. */}
            <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 10, paddingBottom: 'env(safe-area-inset-bottom)', pointerEvents: 'none' }}>
              <div className="px-4 pb-3" style={{ pointerEvents: 'auto' }}>
                {placingPin && (
                  <p className="text-xs mb-2 text-center rounded-lg py-1.5 px-2" style={{ color: COLORS.accent, background: 'rgba(27,31,25,0.85)' }}>Tap anywhere on the map to place your pin</p>
                )}
                {calibratingMap && (
                  <p className="text-xs mb-2 text-center rounded-lg py-1.5 px-2" style={{ color: COLORS.accent, background: 'rgba(27,31,25,0.85)' }}>
                    Tap a spot you know the real coordinates of — point {calibrationPointIndex + 1} of 2. Pick two points far apart for the best accuracy.
                  </p>
                )}
                {measureMode && (
                  <div className="flex items-center justify-between mb-2 gap-2 rounded-lg py-1.5 px-2" style={{ background: 'rgba(27,31,25,0.85)' }}>
                    <p className="text-xs" style={{ color: COLORS.accent }}>
                      {linePoints.length === 0
                        ? 'Tap the map to start the line'
                        : `${linePoints.length} point${linePoints.length === 1 ? '' : 's'} · ${formatLineLength(linePoints)}`}
                    </p>
                    <div className="flex gap-2">
                      {linePoints.length > 0 && (
                        <button
                          onClick={() => setLinePoints((pts) => pts.slice(0, -1))}
                          className="text-xs underline"
                          style={{ color: COLORS.inkDim }}
                        >
                          Undo point
                        </button>
                      )}
                      {linePoints.length >= 2 && (
                        <button
                          onClick={() => setPendingLineSubmit(true)}
                          className="text-xs font-semibold underline"
                          style={{ color: COLORS.accent }}
                        >
                          Done
                        </button>
                      )}
                    </div>
                  </div>
                )}
                {pencilMode && (
                  <p className="text-xs mb-2 text-center rounded-lg py-1.5 px-2" style={{ color: COLORS.accent, background: 'rgba(27,31,25,0.85)' }}>
                    {linePoints.length === 0 ? 'Press and drag to draw' : `Drawing… ${formatLineLength(linePoints)}`}
                  </p>
                )}
                {myPositionStatus && myPositionStatus !== 'ok' && (
                  <p className="text-xs mb-2 rounded-lg py-1.5 px-2" style={{ color: COLORS.warn || '#c17a2f', background: 'rgba(27,31,25,0.85)' }}>{myPositionStatus}</p>
                )}

                <button
                  onClick={() => setShowMapPicker(true)}
                  className="flex items-center gap-2 rounded-lg px-3 py-2 mb-2 max-w-full"
                  style={{ background: 'rgba(27,31,25,0.85)', border: `1px solid ${COLORS.line}` }}
                >
                  <span className="font-display font-bold text-base truncate">🗺️ {currentMap.name}</span>
                  {publicMaps.length > 1 && <span style={{ color: COLORS.inkDim }}>▾</span>}
                </button>

                <div className="flex gap-2">
                  {/* Single pin button — tap arms placement using the currently
                      selected type; a long-press (500ms) opens the type picker
                      instead of arming placement, so switching types doesn't
                      require dropping a pin of the wrong kind first. */}
                  <button
                    onPointerDown={() => {
                      pinLongPressFiredRef.current = false;
                      pinLongPressTimerRef.current = setTimeout(() => {
                        pinLongPressFiredRef.current = true;
                        setShowPinTypePicker(true);
                      }, 500);
                    }}
                    onPointerUp={() => {
                      if (pinLongPressTimerRef.current) clearTimeout(pinLongPressTimerRef.current);
                      if (pinLongPressFiredRef.current) return; // long-press already handled it
                      setMeasureMode(false);
                      setPencilMode(false);
                      setLinePoints([]);
                      setPlacingPin((v) => !v);
                    }}
                    onPointerLeave={() => { if (pinLongPressTimerRef.current) clearTimeout(pinLongPressTimerRef.current); }}
                    className="text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap flex items-center gap-1.5"
                    style={{ background: placingPin ? COLORS.accent : 'rgba(27,31,25,0.85)', color: placingPin ? COLORS.ink2 : COLORS.ink, border: `1px solid ${COLORS.line}` }}
                  >
                    {placingPin ? (
                      'Cancel'
                    ) : (
                      <React.Fragment>
                        <span>{PIN_TYPES[selectedPinType].icon}</span>
                        Drop a pin
                      </React.Fragment>
                    )}
                  </button>
                  <button
                    onClick={() => setShowMapToolsMenu(true)}
                    className="text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap"
                    style={{ background: 'rgba(27,31,25,0.85)', color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                  >
                    ⋯ Tools
                  </button>
                </div>
              </div>
            </div>


            {showMapPicker && (
              <div style={{ position: 'fixed', inset: 0, zIndex: 150, background: 'rgba(0,0,0,0.75)', display: 'flex', alignItems: 'flex-end' }} onClick={() => setShowMapPicker(false)}>
                <div
                  className="w-full p-5"
                  style={{ background: COLORS.bg, borderRadius: '16px 16px 0 0', maxHeight: '75vh', overflowY: 'auto', border: `2px solid ${COLORS.line}`, borderBottom: 'none' }}
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="flex items-center justify-between mb-4">
                    <h2 className="font-display text-lg font-bold">Choose a map</h2>
                    <button onClick={() => setShowMapPicker(false)} className="text-2xl" style={{ color: COLORS.inkDim }}>✕</button>
                  </div>
                  <div className="space-y-2">
                    {publicMaps.map((m) => (
                      <button
                        key={m.id}
                        onClick={() => { setSelectedMapId(m.id); setShowMapPicker(false); }}
                        className="w-full text-left rounded-lg p-3 flex items-center justify-between"
                        style={{
                          background: currentMap.id === m.id ? COLORS.accent : COLORS.surfaceRaised,
                          color: currentMap.id === m.id ? COLORS.ink2 : COLORS.ink,
                          border: `1px solid ${COLORS.line}`,
                        }}
                      >
                        <span className="font-display font-semibold">{m.name}</span>
                        {m.isDefault && <span className="text-xs">default</span>}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {showPinTypePicker && (
              <PinTypePicker
                selected={selectedPinType}
                onChoose={(key) => { setSelectedPinType(key); cacheSet('selectedPinType', key); }}
                onClose={() => setShowPinTypePicker(false)}
              />
            )}

            {showMapToolsMenu && (
              <div style={{ position: 'fixed', inset: 0, zIndex: 150, background: 'rgba(0,0,0,0.75)', display: 'flex', alignItems: 'flex-end' }} onClick={() => setShowMapToolsMenu(false)}>
                <div
                  className="w-full p-5"
                  style={{ background: COLORS.bg, borderRadius: '16px 16px 0 0', border: `2px solid ${COLORS.line}`, borderBottom: 'none' }}
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="flex items-center justify-between mb-4">
                    <h2 className="font-display text-lg font-bold">Tools</h2>
                    <button onClick={() => setShowMapToolsMenu(false)} className="text-2xl" style={{ color: COLORS.inkDim }}>✕</button>
                  </div>
                  <div className="space-y-2">
                    {currentMap.imageUrl && (
                      <button
                        onClick={() => {
                          setShowMapToolsMenu(false);
                          if (currentMapGeoreferenced) {
                            shareGeoreferencedMap(currentMap);
                          } else {
                            shareCurrentMapImage(currentMap);
                          }
                        }}
                        className="w-full text-left rounded-lg p-3 font-display font-semibold flex items-center gap-2"
                        style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                      >
                        📤 Share this map
                      </button>
                    )}
                    <button
                      onClick={() => {
                        setShowMapToolsMenu(false);
                        setPlacingPin(false);
                        setPencilMode(false);
                        setLinePoints([]);
                        setMeasureMode(!measureMode);
                      }}
                      className="w-full text-left rounded-lg p-3 font-display font-semibold flex items-center gap-2"
                      style={{ background: measureMode ? COLORS.accent : COLORS.surfaceRaised, color: measureMode ? COLORS.ink2 : COLORS.ink, border: `1px solid ${COLORS.line}` }}
                    >
                      📏 {measureMode ? 'Stop measuring' : 'Draw & Measure'}
                    </button>
                    <button
                      onClick={() => {
                        setShowMapToolsMenu(false);
                        setPlacingPin(false);
                        setMeasureMode(false);
                        setLinePoints([]);
                        setPencilMode(!pencilMode);
                      }}
                      className="w-full text-left rounded-lg p-3 font-display font-semibold flex items-center gap-2"
                      style={{ background: pencilMode ? COLORS.accent : COLORS.surfaceRaised, color: pencilMode ? COLORS.ink2 : COLORS.ink, border: `1px solid ${COLORS.line}` }}
                    >
                      ✏️ {pencilMode ? 'Stop drawing' : 'Pencil'}
                    </button>
                    {(isAdmin || isForeman) && currentMap.imageUrl && (
                      <button
                        onClick={() => {
                          setShowMapToolsMenu(false);
                          if (calibratingMap) {
                            setCalibratingMap(false);
                            setCalibrationPointIndex(0);
                            setPendingCalibrationPixel(null);
                          } else {
                            setPlacingPin(false);
                            setMeasureMode(false);
                            setPencilMode(false);
                            setLinePoints([]);
                            // Resume at whichever point isn't set yet, so
                            // returning later to place the second point
                            // (after actually walking/driving to that
                            // spot) doesn't overwrite the first one.
                            const existingPoints = currentMap.refPoints || [];
                            const firstMissingIndex = existingPoints[0] ? 1 : 0;
                            setCalibrationPointIndex(firstMissingIndex);
                            setCalibratingMap(true);
                          }
                        }}
                        className="w-full text-left rounded-lg p-3 font-display font-semibold flex items-center gap-2"
                        style={{ background: calibratingMap ? COLORS.accent : COLORS.surfaceRaised, color: calibratingMap ? COLORS.ink2 : COLORS.ink, border: `1px solid ${COLORS.line}` }}
                      >
                        {calibratingMap ? 'Stop calibrating' : ((currentMap.refPoints || [])[0] ? '📍 Set second calibration point' : '📍 Calibrate this map')}
                      </button>
                    )}
                    {(isAdmin || isForeman) && (currentMap.refPoints || []).some(Boolean) && !calibratingMap && (
                      <button
                        onClick={() => {
                          if (confirm(`Reset calibration on "${currentMap.name}"? Both reference points will be cleared, and pins/lines will stop showing real-world positions until it's calibrated again.`)) {
                            setShowMapToolsMenu(false);
                            clearMapRefPoints(currentMap.id);
                          }
                        }}
                        className="w-full text-left rounded-lg p-3 font-display font-semibold flex items-center gap-2"
                        style={{ background: COLORS.surfaceRaised, color: '#E07A5F', border: `1px solid ${COLORS.line}` }}
                      >
                        ↺ Reset calibration
                      </button>
                    )}
                    <button
                      onClick={() => { setShowMapToolsMenu(false); setShowMapSettings(true); }}
                      className="w-full text-left rounded-lg p-3 font-display font-semibold flex items-center gap-2"
                      style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                    >
                      ⚙️ Map settings
                    </button>
                    {isAdmin && machineTracks.length > 0 && (
                      <button
                        onClick={() => { setShowMapToolsMenu(false); setShowMachineTracksPanel(true); }}
                        className="w-full text-left rounded-lg p-3 font-display font-semibold flex items-center gap-2"
                        style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                      >
                        🛰️ Machine tracks
                      </button>
                    )}
                    {(isAdmin || isForeman) && (
                      <button
                        onClick={() => { setShowMapToolsMenu(false); setShowManageMaps(true); }}
                        className="w-full text-left rounded-lg p-3 font-display font-semibold flex items-center gap-2"
                        style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                      >
                        🗂️ Manage maps
                      </button>
                    )}
                  </div>
                </div>
              </div>
            )}
          </React.Fragment>
        )}

        {showMachineTracksPanel && isAdmin && (
          <div style={{ position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(0,0,0,0.75)', display: 'flex', alignItems: 'flex-end' }} onClick={() => setShowMachineTracksPanel(false)}>
            <div
              className="w-full p-5"
              style={{ background: COLORS.bg, borderRadius: '16px 16px 0 0', maxHeight: '75vh', overflowY: 'auto', border: `2px solid ${COLORS.line}`, borderBottom: 'none' }}
              onClick={(e) => e.stopPropagation()}
            >
              <div className="flex items-center justify-between mb-4">
                <h2 className="font-display text-lg font-bold">🛰️ Machine Tracks</h2>
                <button onClick={() => setShowMachineTracksPanel(false)} className="text-2xl" style={{ color: COLORS.inkDim }}>✕</button>
              </div>
              <div className="space-y-2">
                {[...machineTracks].sort((a, b) => b.startedAt.localeCompare(a.startedAt)).slice(0, 10).map((track) => (
                  <div key={track.id} className="rounded-lg p-3 text-xs" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
                    <div className="flex items-center justify-between">
                      <span className="font-semibold">{track.machine || '(no unit)'} — {track.employee}</span>
                      <span style={{ color: track.endedAt ? COLORS.line : COLORS.accent }}>{track.endedAt ? 'Closed' : '● Open'}</span>
                    </div>
                    <p style={{ color: COLORS.inkDim }}>
                      {fmtDate(track.startedAt)} {fmtTime(track.startedAt)} → {track.endedAt ? fmtTime(track.endedAt) : 'now'} · {(track.points || []).length} point{(track.points || []).length === 1 ? '' : 's'} recorded
                    </p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {showMapSettings && (
          <div style={{ position: 'fixed', inset: 0, zIndex: 150, background: 'rgba(0,0,0,0.75)', display: 'flex', alignItems: 'flex-end' }} onClick={() => setShowMapSettings(false)}>
            <div
              className="w-full p-5"
              style={{ background: COLORS.bg, borderRadius: '16px 16px 0 0', border: `2px solid ${COLORS.line}`, borderBottom: 'none' }}
              onClick={(e) => e.stopPropagation()}
            >
              <div className="flex items-center justify-between mb-4">
                <h2 className="font-display text-lg font-bold">⚙️ Map settings</h2>
                <button onClick={() => setShowMapSettings(false)} className="text-2xl" style={{ color: COLORS.inkDim }}>✕</button>
              </div>
              <p className="text-xs font-semibold mb-2" style={{ color: COLORS.inkDim }}>Measurement unit</p>
              <p className="text-xs mb-3" style={{ color: COLORS.inkDim }}>
                Applies to Draw & Measure and Pencil lengths, for everyone — real distances only show once a map is calibrated.
              </p>
              <div className="flex gap-2">
                {[{ key: 'feet', label: 'Feet' }, { key: 'meters', label: 'Meters' }].map((opt) => (
                  <button
                    key={opt.key}
                    onClick={() => setMapUnitPref(opt.key)}
                    className="flex-1 rounded-lg py-3 text-sm font-semibold"
                    style={{ background: mapUnit === opt.key ? COLORS.accent : COLORS.surfaceRaised, color: mapUnit === opt.key ? '#fff' : COLORS.ink, border: `1px solid ${COLORS.line}` }}
                  >
                    {opt.label}
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}

        {showManageMaps && (isAdmin || isForeman) && (
          <ManageMapsOverlay
            maps={maps}
            onAdd={addMap}
            onTogglePublic={setMapPublic}
            onSetDefault={setMapAsDefault}
            onDelete={deleteMap}
            onUploadPdf={uploadMapPdf}
            uploadingMapId={uploadingMapPdf}
            onSharePdf={shareMapPdf}
            localMaps={localMaps}
            onAddLocalMap={addLocalMapFromFile}
            onDeleteLocalMap={deleteLocalMap}
            addingLocalMap={addingLocalMap}
            onClose={() => setShowManageMaps(false)}
          />
        )}

        {pendingCalibrationPixel && currentMap && (
          <RefPointForm
            pointIndex={calibrationPointIndex}
            onCancel={() => setPendingCalibrationPixel(null)}
            onSubmit={async (lat, lng) => {
              await setMapRefPoint(currentMap.id, calibrationPointIndex, { px: pendingCalibrationPixel.px, py: pendingCalibrationPixel.py, lat, lng });
              setPendingCalibrationPixel(null);
              if (calibrationPointIndex === 0) {
                setCalibrationPointIndex(1);
              } else {
                setCalibratingMap(false);
                setCalibrationPointIndex(0);
              }
            }}
          />
        )}

        {viewingMachineName && currentMap && (() => {
          const pos = currentMapLivePositions.find((p) => p.name === viewingMachineName);
          if (!pos) return null;
          const activeTrack = machineTracks.find((tr) => !tr.endedAt && tr.machine === viewingMachineName);
          return (
            <MachineMarkerDetail
              position={{ ...pos, employee: activeTrack ? activeTrack.employee : null }}
              onClose={() => setViewingMachineName(null)}
            />
          );
        })()}

        {pendingPinPosition && currentMap && (
          <MapPinForm
            type={selectedPinType}
            canChoosePublic={isAdmin || isForeman}
            onCancel={() => setPendingPinPosition(null)}
            onSubmit={async (type, note, isPublicChoice) => {
              await addMapPin(currentMap.id, pendingPinPosition.x, pendingPinPosition.y, type, note, isPublicChoice);
              setPendingPinPosition(null);
            }}
          />
        )}

        {pendingLineSubmit && currentMap && (
          <MapLineForm
            canChoosePublic={isAdmin || isForeman}
            onCancel={() => { setPendingLineSubmit(false); }}
            onSubmit={async (type, note, isPublicChoice, color, strokeWidth) => {
              await addMapLine(currentMap.id, linePoints, type, note, isPublicChoice, color, strokeWidth);
              setPendingLineSubmit(false);
              setMeasureMode(false);
              setPencilMode(false);
              setLinePoints([]);
            }}
          />
        )}

        {viewingPinId && (() => {
          const pin = mapPins.find((p) => p.id === viewingPinId);
          if (!pin) return null;
          return (
            <MapPinDetail
              pin={pin}
              canManage={canManagePin(pin)}
              canTogglePublic={isAdmin || isForeman}
              onDelete={async () => { await deleteMapPin(pin.id); setViewingPinId(null); }}
              onSetPublic={async (isPublic) => { await setMapPinPublic(pin.id, isPublic); }}
              onClose={() => setViewingPinId(null)}
            />
          );
        })()}

        {viewingLineId && (() => {
          const line = mapLines.find((l) => l.id === viewingLineId);
          if (!line) return null;
          return (
            <MapLineDetail
              line={line}
              map={currentMap}
              unit={mapUnit}
              canManage={canManageLine(line)}
              canTogglePublic={isAdmin || isForeman}
              onDelete={async () => { await deleteMapLine(line.id); setViewingLineId(null); }}
              onSetPublic={async (isPublic) => { await setMapLinePublic(line.id, isPublic); }}
              onClose={() => setViewingLineId(null)}
            />
          );
        })()}
      </div>
    );
  }

  if (screen === 'highwayMap') {
    const stopHighwayTrackingAndSave = () => {
      setPersonalTrackingOn(false);
      if (personalTrackPoints.length < 2) {
        setPersonalTrackPoints([]);
        return;
      }
      setHighwayPendingLineSubmit(true);
      // personalTrackPoints stays populated until the save form actually
      // submits or cancels — that's what addHighwayLine below reads from.
    };

    return (
      <div
        style={{
          position: 'fixed', inset: 0, background: COLORS.bg, color: COLORS.ink,
          display: 'flex', flexDirection: 'column',
          paddingTop: 'env(safe-area-inset-top)',
          paddingBottom: 'env(safe-area-inset-bottom)',
          paddingLeft: 'env(safe-area-inset-left)',
          paddingRight: 'env(safe-area-inset-right)',
        }}
        className="font-body"
      >
        {FONT_STYLE}
        <div className="px-4 pt-3 pb-2 flex-shrink-0">
          <button onClick={() => setScreen(landingScreenFor(currentMechanic))} className="font-display text-xs uppercase tracking-wider mb-2 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>
          <div className="flex items-center justify-between">
            <h1 className="font-display text-xl font-bold">🛣️ Highway Map</h1>
            <div className="flex gap-2">
              <button
                onClick={() => {
                  if (directionsDestination) { setDirectionsDestination(null); setRouteInfo(null); setPickingDestination(false); return; }
                  setPickingDestination(!pickingDestination);
                }}
                className="text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap"
                style={{ background: (pickingDestination || directionsDestination) ? COLORS.accent : COLORS.surfaceRaised, color: (pickingDestination || directionsDestination) ? COLORS.ink2 : COLORS.ink, border: `1px solid ${COLORS.line}` }}
              >
                {directionsDestination ? '✕ Clear directions' : (pickingDestination ? 'Cancel' : '🧭 Directions')}
              </button>
              {(isAdmin || isForeman) && (
                <button
                  onClick={() => setPlacingHighwayPin(!placingHighwayPin)}
                  className="text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap"
                  style={{ background: placingHighwayPin ? COLORS.accent : COLORS.surfaceRaised, color: placingHighwayPin ? COLORS.ink2 : COLORS.ink, border: `1px solid ${COLORS.line}` }}
                >
                  {placingHighwayPin ? 'Cancel' : '📍 Add location'}
                </button>
              )}
            </div>
          </div>
          {placingHighwayPin && (
            <p className="text-xs mt-1 text-center" style={{ color: COLORS.accent }}>Tap the map to place a location</p>
          )}
          {pickingDestination && (
            <p className="text-xs mt-1 text-center" style={{ color: COLORS.accent }}>Tap the map, or tap a known location, to get directions there</p>
          )}
          {routeInfo && routeInfo.error && (
            <p className="text-xs mt-1 text-center" style={{ color: '#E07A5F' }}>{routeInfo.error}</p>
          )}
          {routeInfo && !routeInfo.error && (
            <>
              <p className="text-xs mt-1 text-center" style={{ color: COLORS.accent }}>🧭 {routeInfo.distance} · about {routeInfo.duration}</p>
              {routeInfo.note && <p className="text-xs text-center" style={{ color: COLORS.inkDim }}>{routeInfo.note}</p>}
            </>
          )}
        </div>

        <div className="flex-1 min-h-0" style={{ position: 'relative' }}>
          <HighwayMap
            ref={highwayMapRef}
            knownLocations={highwayLocations}
            machinePositions={machinePositions}
            openTracks={openTracks}
            placingPin={placingHighwayPin}
            myLocation={myLiveLocation}
            savedLines={highwayLines.filter(canSeeHighwayLine)}
            liveTrackPoints={personalTrackingOn ? personalTrackPoints : []}
            pickingDestination={pickingDestination}
            onPickDestination={(lat, lng) => { setDirectionsDestination({ lat, lng }); setPickingDestination(false); setRouteInfo(null); }}
            directionsDestination={directionsDestination}
            onRouteCalculated={setRouteInfo}
            onMapClick={(lat, lng) => { setPendingHighwayPosition({ lat, lng }); setPlacingHighwayPin(false); }}
            onLocationTap={(id) => {
              if (pickingDestination) {
                const loc = highwayLocations.find((l) => l.id === id);
                if (loc) { setDirectionsDestination({ lat: loc.lat, lng: loc.lng }); setPickingDestination(false); setRouteInfo(null); }
                return;
              }
              setViewingMachineName(null); setViewingHighwayLocationId(id);
            }}
            onMachineTap={(name) => { setViewingHighwayLocationId(null); setViewingMachineName(name); }}
            onLineTap={(id) => setViewingHighwayLineId(id)}
          />
          {myLiveLocation && (
            <button
              onClick={() => highwayMapRef.current && highwayMapRef.current.centerOnMe()}
              title="Center on me"
              style={{
                position: 'absolute', bottom: 16, right: 16, width: 44, height: 44, borderRadius: '50%',
                background: 'rgba(255,255,255,0.92)', border: `2px solid #333`,
                display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 5,
                boxShadow: '0 1px 4px rgba(0,0,0,0.35)', fontSize: 20,
              }}
            >
              🎯
            </button>
          )}
          <button
            onClick={() => (personalTrackingOn ? stopHighwayTrackingAndSave() : setPersonalTrackingOn(true))}
            title={personalTrackingOn ? 'Stop tracking me' : 'Track me'}
            style={{
              position: 'absolute', bottom: 68, right: 16, width: 44, height: 44, borderRadius: '50%',
              background: personalTrackingOn ? COLORS.accent : 'rgba(255,255,255,0.92)',
              color: personalTrackingOn ? '#fff' : '#333',
              border: `2px solid ${personalTrackingOn ? COLORS.accent : '#333'}`,
              display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 5,
              boxShadow: '0 1px 4px rgba(0,0,0,0.35)', fontSize: 20,
            }}
          >
            {personalTrackingOn ? '⏹️' : '🚶'}
          </button>
        </div>

        {highwayPendingLineSubmit && (
          <MapLineForm
            canChoosePublic={isAdmin || isForeman}
            onCancel={() => { setHighwayPendingLineSubmit(false); setPersonalTrackPoints([]); }}
            onSubmit={async (type, note, isPublicChoice, color, strokeWidth) => {
              await addHighwayLine(personalTrackPoints, type, note, isPublicChoice, color, strokeWidth);
              setHighwayPendingLineSubmit(false);
              setPersonalTrackPoints([]);
            }}
          />
        )}

        {viewingHighwayLineId && (() => {
          const line = highwayLines.find((l) => l.id === viewingHighwayLineId);
          if (!line) return null;
          return (
            <MapLineDetail
              line={line}
              map={null}
              unit={mapUnit}
              canManage={canManageHighwayLine(line)}
              canTogglePublic={isAdmin || isForeman}
              onDelete={async () => { await deleteHighwayLine(line.id); setViewingHighwayLineId(null); }}
              onSetPublic={async (isPublic) => { await setHighwayLinePublic(line.id, isPublic); }}
              onClose={() => setViewingHighwayLineId(null)}
            />
          );
        })()}

        {machinePositions.length === 0 && (
          <p className="px-4 py-2 flex-shrink-0 text-xs text-center" style={{ color: COLORS.line }}>
            No live machine positions yet — this fills in automatically once Samsara is connected.
          </p>
        )}

        {pendingHighwayPosition && (
          <HighwayLocationForm
            onCancel={() => setPendingHighwayPosition(null)}
            onSubmit={async (name) => {
              await addHighwayLocation(name, pendingHighwayPosition.lat, pendingHighwayPosition.lng);
              setPendingHighwayPosition(null);
            }}
          />
        )}

        {viewingHighwayLocationId && (() => {
          const loc = highwayLocations.find((l) => l.id === viewingHighwayLocationId);
          if (!loc) return null;
          return (
            <HighwayLocationDetail
              location={loc}
              canManage={isAdmin || isForeman}
              onDelete={async () => { await deleteHighwayLocation(loc.id); setViewingHighwayLocationId(null); }}
              onClose={() => setViewingHighwayLocationId(null)}
            />
          );
        })()}

        {viewingMachineName && (() => {
          const pos = machinePositions.find((p) => p.name === viewingMachineName);
          if (!pos) return null;
          // A machine's marker doesn't know on its own who (if anyone) is
          // driving it — that's cross-referenced here against whichever
          // shift, if any, currently has this exact machine name assigned.
          const activeTrack = openTracks.find((tr) => tr.machine === viewingMachineName);
          return (
            <MachineMarkerDetail
              position={{ ...pos, employee: activeTrack ? activeTrack.employee : null }}
              onClose={() => setViewingMachineName(null)}
            />
          );
        })()}
      </div>
    );
  }

  // ---------- CHECKLIST TEMPLATES ----------
  if (screen === 'settings') {
    const slug = slugForMechanic(currentMechanic);
    const tokenInfo = pushTokens[slug];
    const pushEnabled = tokenInfo ? tokenInfo.enabled !== false : true;
    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <div className="max-w-lg mx-auto">
          <button onClick={() => setScreen(landingScreenFor(currentMechanic))} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>
          <h1 className="font-display text-3xl font-bold mb-8">Settings</h1>

          <div className="rounded-lg p-5" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
            <label className="flex items-center justify-between gap-3 cursor-pointer">
              <div>
                <span className="text-sm font-semibold block" style={{ color: COLORS.ink }}>🔔 Shift reminders</span>
                <span className="text-xs" style={{ color: COLORS.inkDim }}>
                  A push notification 5 minutes before your shift starts and ends.
                </span>
              </div>
              <input
                type="checkbox"
                checked={pushEnabled}
                onChange={async (e) => {
                  if (e.target.checked) {
                    localStorage.setItem('pushAsked_' + currentMechanic, '1');
                    const ok = await registerPushNotifications(currentMechanic);
                    if (!ok) alert("Couldn't enable notifications — check that this phone allows notifications for this app in its system settings, then try again.");
                  } else {
                    await setPushEnabled(currentMechanic, false);
                  }
                }}
                className="w-5 h-5 flex-shrink-0"
                style={{ accentColor: COLORS.accent }}
              />
            </label>
          </div>

          {isAdmin && (
            <div className="rounded-lg p-5 mt-4" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
              <h2 className="font-display text-sm font-bold uppercase tracking-wide mb-4">Automatic reports</h2>
              <EmailListEditor
                label="Weekly timesheet — sends every Monday"
                helper="Anyone who should get the weekly timesheet CSV (comma-separated for more than one)"
                value={(timesheetSettings.weeklyEmails || []).join(', ')}
                onSave={(list) => saveTimesheetSettings({ ...timesheetSettings, weeklyEmails: list })}
              />
              <EmailListEditor
                label="Weekly backup — sends every Monday"
                helper="Anyone who should get the full app backup file (usually just you)"
                value={(timesheetSettings.backupEmails || []).join(', ')}
                onSave={(list) => saveTimesheetSettings({ ...timesheetSettings, backupEmails: list })}
              />
              <EmailListEditor
                label="Monthly hours summary — sends the 1st of each month"
                helper="One email for whoever handles payroll/books — a simple total-hours-per-person report for last month"
                value={(timesheetSettings.monthlyEmail || '')}
                single
                onSave={(list) => saveTimesheetSettings({ ...timesheetSettings, monthlyEmail: list[0] || '' })}
              />
              <label className="flex items-center justify-between gap-3 cursor-pointer mt-2">
                <div>
                  <span className="text-sm font-semibold block" style={{ color: COLORS.ink }}>Weekly emails turned on</span>
                  <span className="text-xs" style={{ color: COLORS.inkDim }}>Turn off to pause the weekly timesheet and backup emails without deleting the addresses above. The monthly summary isn't affected by this.</span>
                </div>
                <input
                  type="checkbox"
                  checked={!!timesheetSettings.autoEmail}
                  onChange={(e) => saveTimesheetSettings({ ...timesheetSettings, autoEmail: e.target.checked })}
                  className="w-5 h-5 flex-shrink-0"
                  style={{ accentColor: COLORS.accent }}
                />
              </label>
            </div>
          )}

          <div className="rounded-lg p-5 mt-4 space-y-1" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
            <button
              onClick={startChangePin}
              className="w-full flex items-center gap-3 text-left px-3 py-3 rounded-lg font-display font-semibold text-sm uppercase tracking-wide transition-all hover:scale-102"
              style={{ color: COLORS.ink, background: COLORS.surfaceRaised }}
            >
              <span style={{ fontSize: '1.1rem' }}>🔑</span>
              Change PIN
            </button>
            <button
              onClick={toggleBiometric}
              className="w-full flex items-center gap-3 text-left px-3 py-3 rounded-lg font-display font-semibold text-sm uppercase tracking-wide transition-all hover:scale-102"
              style={{ color: COLORS.ink, background: COLORS.surfaceRaised }}
            >
              <span style={{ fontSize: '1.1rem' }}>🔓</span>
              {!!localStorage.getItem('webauthn_cred_' + currentMechanic) ? 'Turn off Face/Touch ID' : 'Enable Face/Touch ID'}
            </button>

  if (screen === 'checklists') {

                    <NewTemplateForm

  // ---------- UNIT VIEW ----------

          }}

        />
        <BiometricOfferOverlay
          mechanic={offerBiometric}
          onEnable={async () => {
            const name = offerBiometric;
            setOfferBiometric(null);
            try {
              await registerBiometric(name);

              // ignore — user can enable it later from the board
            }
          }}

        />
        <div className="max-w-3xl mx-auto">

            {t('backToBoard')}

          </div>

          {showAddOrder && (
            <NewOrderForm

              onSubmit={createOrder}

          {unitOrders.length === 0 ? (
            <div className="rounded-lg p-10 text-center mt-6" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>

                    className="relative rounded-lg p-5 pl-8 text-left w-full focus:outline-none focus:ring-2 transition-all hover:scale-102 active:scale-98"
                  >
                    <PunchHole bg={isDone ? COLORS.line : COLORS.manila} />
                    <div className="flex items-start justify-between gap-3">
                      <div className="flex-1 min-w-0">
                        <p className="font-body font-semibold text-base leading-snug mb-2">{getLocalizedText(o.description, lang) || t('noDescription')}</p>
                        <div className="flex flex-wrap items-center gap-4 font-mono text-xs" style={{ color: isDone ? COLORS.line : '#5B5342', opacity: isDone ? 0.6 : 1 }}>
                          {getAssignedMechanics(o).length > 0 && <span>👤 {getAssignedMechanics(o).join(', ')}</span>}
                          {o.hours && o.hours !== '' && <span>⏱️ {o.hours}h</span>}

                          </div>

                      </div>
                      <StatusStamp status={o.status} small t={t} />
                    </div>
                  </button>

          onForgot={forgotPin}
          t={t}
        />
        <EmailPromptOverlay
          show={showEmailPrompt}
          onSave={async (email) => {
            await saveMechanicEmail(currentMechanic, email);
            setShowEmailPrompt(false);
          }}
          onSkip={() => setShowEmailPrompt(false)}
        />
        <PushPromptOverlay
          show={showPushPrompt}
          mechanic={currentMechanic}
          onEnable={async () => {

            setShowPushPrompt(false);
          }}

        <BiometricOfferOverlay

        <div className="max-w-2xl mx-auto">

              {t('backTo')} {activeUnit}
            </button>
            {isAdmin && (
              <button
                onClick={() => window.print()}
                className="font-display text-xs uppercase tracking-wider font-semibold px-3 py-2 rounded-lg transition-all hover:scale-105"
                style={{ color: COLORS.accent, background: COLORS.surface, border: `1px solid ${COLORS.line}` }}

              </button>

            <PrintPortal>

          )}

                </button>
              </div>
              <textarea
                value={getLocalizedText(order.description, lang)}
                onChange={(e) => {
                  const val = e.target.value;
                  const current = typeof order.description === 'string'
                    ? { text: order.description, origLang: 'en', translations: {} }
                    : order.description || { text: '', origLang: lang, translations: {} };
                  const nextDescription = current.origLang === lang
                    ? { ...current, text: val }
                    : { ...current, translations: { ...current.translations, [lang]: val } };
                  updateOrder(order.id, { description: nextDescription });
                }}
                rows={3}
                className="w-full rounded-sm px-3 py-2 text-sm font-body focus:outline-none focus:ring-2"
                style={{ background: '#EFE3C4', color: COLORS.ink2, border: `1px solid ${COLORS.manilaDark}` }}
              />
              {typeof order.description === 'object' && order.description.origLang !== lang && !order.description.translations[lang] && (
                <p className="text-xs mt-1" style={{ color: COLORS.accent }}>{t('noTranslationYet')}</p>
              )}
              {pdtEditingDescription && (
                <PdtChecklistForm
                  name={getLocalizedText(order.description, 'en')}
                  items={[]}
                  nameTranslations={typeof order.description === 'object' ? order.description.translations : {}}
                  itemTranslations={[]}
                  onSave={async (namePdt) => {
                    const current = typeof order.description === 'string'
                      ? { text: order.description, origLang: 'en', translations: {} }
                      : order.description || { text: '', origLang: 'en', translations: {} };
                    const translations = { ...current.translations };
                    if (namePdt.trim()) translations.pdt = namePdt.trim(); else delete translations.pdt;
                    await updateOrder(order.id, { description: { ...current, translations } });

                  }}

                />

            </label>

                  style={{
                    border: `2px solid ${statusColor('Open')}`,
                    color: order.status === 'Open' ? COLORS.ink2 : statusColor('Open'),
                    background: order.status === 'Open' ? statusColor('Open') : 'transparent',

                >
                  {t('statusOpen')}
                </button>

                  onClick={() => {
                    updateOrder(order.id, { status: 'Done' });

                      setShowFireworks(true);
                      setTimeout(() => setShowFireworks(false), 2600);
                    }
                  }}
                  className="font-display text-base uppercase font-bold tracking-wide px-6 py-3 rounded-lg focus:outline-none focus:ring-2 transition-all hover:scale-105"
                  style={{
                    border: `3px solid ${statusColor('Done')}`,
                    color: order.status === 'Done' ? '#1B1F19' : statusColor('Done'),
                    background: order.status === 'Done' ? statusColor('Done') : 'transparent',
                    boxShadow: order.status === 'Done' ? `0 2px 12px ${statusColor('Done')}66` : 'none',
                  }}
                >
                  ✓ {t('statusDone')}
                </button>
              </div>
            </div>
          </div>

                  editingOrderChecklistId === c.id ? (

                      key={c.id}
                      checklist={c}
                      onCancel={() => setEditingOrderChecklistId(null)}
                      onSave={(name, itemsText) => updateOrderChecklist(order.id, c.id, name, itemsText)}
                    />
                  ) : (
                  <div key={c.id} className="rounded-lg p-5" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
                    <div className="flex items-center justify-between mb-4 pb-4" style={{ borderBottomColor: COLORS.line, borderBottomWidth: '1px' }}>

function WeekReviewTable({ entries, printMode }) {
  const sorted = [...entries].sort((a, b) => (a.mechanic || '').localeCompare(b.mechanic || '') || a.date.localeCompare(b.date));
  const groups = [];
  sorted.forEach((e) => {
    const last = groups[groups.length - 1];
    if (last && last.mechanic === e.mechanic) {
      last.entries.push(e);
    } else {
      groups.push({ mechanic: e.mechanic, entries: [e] });
    }
  });

  // On screen this uses the app's dark palette (COLORS.*) same as always.
  // In printMode it swaps to plain dark-on-white — the dark theme's near-
  // white text on a dark background would print as barely-visible pale
  // gray on paper (or waste ink filling the whole background), so paper
  // output gets its own light palette instead of reusing COLORS.
  const pal = printMode
    ? { bg: '#fff', line: '#ccc', ink: '#1B1F19', inkDim: '#555', accent: '#1B1F19', done: '#1B1F19', surface: '#f2f2f2' }
    : { bg: COLORS.surfaceRaised, line: COLORS.line, ink: COLORS.ink, inkDim: COLORS.inkDim, accent: COLORS.accent, done: COLORS.done, surface: COLORS.surface };

  const th = { padding: '8px 12px', textAlign: 'left', fontWeight: 600, whiteSpace: 'nowrap', borderBottom: `2px solid ${pal.line}` };
  const td = { padding: '8px 12px', whiteSpace: 'nowrap', borderBottom: `1px solid ${pal.line}` };

  return (
    <div className="mt-4 rounded-lg overflow-x-auto" style={{ background: pal.bg, border: `1px solid ${pal.line}` }}>
      <table className="text-xs font-mono w-full" style={{ borderCollapse: 'collapse' }}>
        <thead>
          <tr style={{ color: pal.inkDim }}>
            <th style={th}>Date</th>
            <th style={th}>In</th>
            <th style={th}>Out</th>
            <th style={th}>Break</th>
            <th style={th}>Worked thru break</th>
            <th style={th}>Paid hrs</th>
            <th style={th}>Signed</th>
            <th style={th}>Jobs</th>
          </tr>
        </thead>
        <tbody>
          {groups.map((g) => (
            <React.Fragment key={g.mechanic}>
              <tr>
                <td colSpan={8} style={{ padding: '8px 12px', fontWeight: 700, color: pal.accent, background: pal.surface, borderBottom: `1px solid ${pal.line}` }}>
                  {g.mechanic}
                </td>
              </tr>
              {g.entries.map((e) => (
                <tr key={e.id} style={{ color: pal.ink }}>
                  <td style={td}>{fmtDate(e.date)}</td>
                  <td style={td}>{fmtTime(e.clockIn)}</td>
                  <td style={td}>{e.clockOut ? fmtTime(e.clockOut) : '—'}</td>
                  <td style={td}>{!e.skippedLunch && e.lunchStart && e.lunchEnd ? `${fmtTime(e.lunchStart)}–${fmtTime(e.lunchEnd)}` : '—'}</td>
                  <td style={td}>{e.skippedLunch ? 'Yes' : 'No'}</td>
                  <td style={{ ...td, color: pal.accent, fontWeight: 700 }}>{fmtHoursDecimal(entryHours(e))}</td>
                  <td style={{ ...td, color: e.signature ? pal.done : pal.line }}>{e.signature ? '✓' : '—'}</td>
                  <td style={td}>{(e.jobs || []).map((j) => `${j.unit}: ${j.hours}h`).join(' | ') || '—'}</td>
                </tr>
              ))}
            </React.Fragment>
          ))}
        </tbody>
      </table>
    </div>
  );
}

          <div style={{ fontSize: 12, textAlign: 'right', color: '#555' }}>
            <p>{fmtTime(entry.clockIn)} – {fmtTime(entry.clockOut)}</p>

          </div>
        )}
      </div>

      <table style={{ width: '100%', fontSize: 12, borderCollapse: 'collapse', marginBottom: 12 }}>

          <tr>
            <td style={{ padding: '3px 6px', color: '#555' }}>Break</td>
            <td style={{ padding: '3px 6px' }}>

          <p style={{ fontSize: 11, fontWeight: 600, color: '#555', marginBottom: 4 }}>Jobs</p>
          {entry.jobs.map((j, i) => (

function TimesheetEntryCard({ entry, locked, canEdit, isEditing, onEdit, onCancelEdit, onSave, onDelete, onAddJob, onRemoveJob, isAdmin }) {
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [showSignature, setShowSignature] = useState(false);
  const [showRawData, setShowRawData] = useState(false);
  const [fixDraft, setFixDraft] = useState({});
  // Clock in/out — like breaks, these are time-only inputs now. Each keeps
  // its OWN original calendar day locked in place behind the scenes (so a
  // shift that genuinely crosses midnight still works correctly), removing
  // the same "picked the wrong date by accident" risk that caused a real
  // mis-entry with break times earlier.
  const getLocalDatePart = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  };
  const toLocalTime = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const combineDateTime = (datePart, time) => {
    if (!time || !datePart) return null;
    return new Date(`${datePart}T${time}`).toISOString();
  };
  const clockInDatePart = getLocalDatePart(entry.clockIn) || entry.date;
  const clockOutDatePart = getLocalDatePart(entry.clockOut) || clockInDatePart;
  const [clockInTime, setClockInTime] = useState(toLocalTime(entry.clockIn));
  const [clockOutTime, setClockOutTime] = useState(toLocalTime(entry.clockOut));
  const [lunchStartTime, setLunchStartTime] = useState(toLocalTime(entry.lunchStart));
  const [lunchEndTime, setLunchEndTime] = useState(toLocalTime(entry.lunchEnd));

  if (isEditing) {
    return (
      <div className="rounded-lg p-5" style={{ background: COLORS.surface, border: `2px solid ${COLORS.accent}` }}>
        <p className="font-display font-semibold mb-4">{fmtDate(entry.date)}</p>
        <div className="grid grid-cols-2 gap-3 mb-3">
          <label className="block">
            <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Clock in</span>
            <input type="time" value={clockInTime} onChange={(e) => setClockInTime(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2" style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }} />
          </label>
          <label className="block">
            <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Clock out</span>
            <input type="time" value={clockOutTime} onChange={(e) => setClockOutTime(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2" style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }} />
          </label>
          <label className="block">
            <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Break start</span>
            <input type="time" value={lunchStartTime} onChange={(e) => setLunchStartTime(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2" style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }} />
          </label>
          <label className="block">
            <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Break end</span>
            <input type="time" value={lunchEndTime} onChange={(e) => setLunchEndTime(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2" style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }} />
          </label>
        </div>
        <TimesheetJobsEditor entry={entry} onAdd={onAddJob} onRemove={onRemoveJob} />
        {confirmDelete ? (
          <div className="mt-4 rounded-lg p-3" style={{ background: COLORS.surfaceRaised }}>
            <p className="text-sm mb-3" style={{ color: COLORS.inkDim }}>Delete this whole shift? This can't be undone.</p>
            <div className="flex gap-2">
              <Btn variant="danger" onClick={onDelete}>Yes, delete it</Btn>
              <Btn variant="ghost" onClick={() => setConfirmDelete(false)}>Cancel</Btn>
            </div>
          </div>
        ) : (
          <div className="flex gap-2 mt-4">
            <Btn
              onClick={() =>
                onSave({
                  clockIn: combineDateTime(clockInDatePart, clockInTime),
                  clockOut: combineDateTime(clockOutDatePart, clockOutTime),
                  lunchStart: combineDateTime(clockInDatePart, lunchStartTime),
                  lunchEnd: combineDateTime(clockInDatePart, lunchEndTime),
                })
              }
            >
              Save changes
            </Btn>
            <Btn variant="ghost" onClick={onCancelEdit}>Cancel</Btn>
            <button onClick={() => setConfirmDelete(true)} className="text-xs underline ml-auto" style={{ color: '#E07A5F' }}>
              Delete shift
            </button>
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="rounded-lg p-4" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
      <div className="flex items-center justify-between mb-2">
        <span className="font-display font-semibold">{fmtDate(entry.date)}</span>
        <div className="flex items-center gap-3">
          {isAdmin && (
            <button onClick={() => window.print()} className="text-xs underline" style={{ color: COLORS.inkDim }}>🖨️ Print</button>
          )}
          {!canEdit ? (
            <span className="text-xs" style={{ color: COLORS.line }}>Ask admin to fix a mistake</span>
          ) : locked ? (
            <span className="text-xs font-semibold" style={{ color: COLORS.done }}>🔒 Approved</span>
          ) : (
            <button onClick={onEdit} className="text-xs underline" style={{ color: COLORS.accent }}>Edit</button>
          )}
        </div>
      </div>
      {isAdmin && (
        <PrintPortal>
          <PrintableTimesheetEntry entry={entry} />
        </PrintPortal>
      )}
      <div className="flex flex-wrap gap-4 text-xs font-mono mb-1" style={{ color: COLORS.inkDim }}>
        <span>In {fmtTime(entry.clockIn)}</span>
        <span>Out {entry.clockOut ? fmtTime(entry.clockOut) : '—'}</span>
        {!entry.skippedLunch && entry.lunchStart && entry.lunchEnd && <span>Break {fmtTime(entry.lunchStart)}–{fmtTime(entry.lunchEnd)}</span>}
        {entry.skippedLunch && <span>No break taken</span>}
      </div>
      {entry.clockOut && (
        <p className="text-xs font-mono mb-2" style={{ color: entryHours(entry) > 16 ? '#E07A5F' : COLORS.accent }}>
          Total for the day: <span className="font-bold">{fmtHours(entryHours(entry))}</span>
          {entryHours(entry) > 16 && ' ⚠️ looks wrong — likely a corrupted date on one of the saved times'}
        </p>
      )}
      {isAdmin && (
        <div className="mb-2">
          <button onClick={() => setShowRawData((s) => !s)} className="text-xs underline" style={{ color: COLORS.line }}>
            {showRawData ? 'Hide raw data' : '🔍 Show raw data'}
          </button>
          {showRawData && (
            <div className="mt-2 rounded-lg p-3 font-mono text-xs" style={{ background: COLORS.surfaceRaised, color: COLORS.inkDim }}>
              <p className="mb-2">mechanic: {entry.mechanic}</p>
              <p className="mb-2">date: {entry.date}</p>
              {['clockIn', 'clockOut', 'lunchStart', 'lunchEnd'].map((field) => {
                const iso = entry[field];
                if (!iso) return <p key={field} className="mb-2">{field}: —</p>;
                const storedDate = getLocalDatePart(iso);
                const time = toLocalTime(iso);
                const mismatched = storedDate !== entry.date;
                const draftDate = fixDraft[field] !== undefined ? fixDraft[field] : storedDate;
                return (
                  <div key={field} className="mb-3">
                    <p style={{ color: mismatched ? '#E07A5F' : COLORS.inkDim }}>
                      {field}: {iso}{mismatched ? ' ⚠️ date differs from shift date' : ''}
                    </p>
                    <div className="flex items-center gap-2 mt-1">
                      <input
                        type="date"
                        value={draftDate}
                        onChange={(e) => setFixDraft((d) => ({ ...d, [field]: e.target.value }))}
                        className="rounded px-2 py-1 text-xs"
                        style={{ background: COLORS.surface, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                      />
                      <button
                        onClick={() => onSave({ [field]: combineDateTime(draftDate, time) })}
                        disabled={draftDate === storedDate}
                        className="text-xs underline"
                        style={{ color: draftDate === storedDate ? COLORS.line : COLORS.accent }}
                      >
                        Fix date (keeps {time} as the time)
                      </button>
                    </div>
                  </div>
                );
              })}
              <p>skippedLunch: {String(!!entry.skippedLunch)}</p>
            </div>
          )}
        </div>
      )}
      {(entry.jobs || []).length > 0 && (
        <p className="text-xs" style={{ color: COLORS.line }}>
          {entry.jobs.map((j) => `${j.unit} (${j.hours}h)`).join(' • ')}
        </p>
      )}
      {entry.signature && (
        <div className="mt-2">
          <button
            onClick={() => setShowSignature((s) => !s)}
            className="text-xs underline"
            style={{ color: COLORS.done }}
          >
            ✓ Signed {showSignature ? '(hide)' : '(view)'}
          </button>
          {showSignature && (
            <div className="mt-2 rounded-lg p-2 inline-block" style={{ background: '#fff' }}>
              <img src={entry.signature} alt="Signature" style={{ height: 60, display: 'block' }} />
            </div>
          )}
        </div>
      )}
    </div>
  );
}
