  // Hands the original georeferenced PDF back out via the iPhone/iPad share
  // sheet — AirDrop it to a machine's iPad, save it to Files, or email it —
  // so the same file that was uploaded here can be added on the Field Map
  // app's "Add map from Files" button.
  // Shares a single PNG with this map's calibration data (refPoints from
  // manual 2-point calibration, or geoCorners/geoBBoxFraction from an
  // auto-georeferenced PDF upload) embedded directly inside the file
  // itself as a tEXt chunk — no separate JSON file needed, and the image
  // still opens and looks completely normal anywhere else it's used.
  // Uses the exact same field names this app stores internally, on the
  // theory that a receiving app built by referencing this one has the
  // best shot at recognizing it.
  const shareGeoreferencedMap = async (map) => {
    if (!map.imageUrl) {
      alert("This map doesn't have an image uploaded yet — nothing to share.");
      return;
    }
    if (!isMapGeoreferenced(map)) {
      alert("This map isn't calibrated yet — calibrate it first so there's real georeferencing data to include.");
      return;
    }
    const baseName = (map.name || 'map').replace(/[^\w\- ]/g, '');
    try {
      const res = await fetch(map.imageUrl);
      const arrayBuffer = await res.arrayBuffer();
      const geoData = {
        name: map.name,
        imageWidth: map.imageWidth,
        imageHeight: map.imageHeight,
        refPoints: map.refPoints || null,
        geoCorners: map.geoCorners || null,
        geoBBoxFraction: map.geoBBoxFraction || null,
      };
      const embeddedBytes = embedJsonInPng(arrayBuffer, JSON.stringify(geoData));
      // .hcmap instead of .png, and a generic MIME type instead of
      // image/png — this is still exactly a valid PNG underneath, but a
      // non-image extension/type keeps iOS's share sheet from treating it
      // as a Photo, which would route it into the Photos library rather
      // than Files, and Photos' picker isn't reliable about preserving
      // custom metadata chunks like this one when it's picked back up.
      const imageFile = new File([embeddedBytes], baseName + '.hcmap', { type: 'application/octet-stream' });
      if (navigator.canShare && navigator.canShare({ files: [imageFile] })) {
        try {
          await navigator.share({ files: [imageFile], title: baseName });
          return;
        } catch (e) {
          if (e && e.name === 'AbortError') return; // user cancelled the share sheet
          // fall through to the download fallback below
        }
      }
      const url = URL.createObjectURL(imageFile);
      const a = document.createElement('a');
      a.href = url; a.download = imageFile.name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    } catch (e) {
      alert("Couldn't share this map — check your signal and try again.");
    }
  };
  // Shares the map's actual displayed image via the native share sheet —

  const shareCurrentMapImage = async (map) => {

    }

  const startMachineTrack = async (sourceType, shiftId, machine, employee) => {

  const appendTrackPoint = async (trackId, lat, lng) => {

  // Calls our Cloud Run backend (never Samsara directly — the token can't
  // live in client-side code), which proxies a read-only request to
  // Samsara for every vehicle's current position in one call. Cached for a
  // few seconds so several open tracks polling around the same moment
  // share one Samsara call instead of one each.
  const samsaraCacheRef = useRef({ time: 0, positions: null });
  const fetchAllSamsaraPositions = async () => {
    const cache = samsaraCacheRef.current;
    if (cache.positions && Date.now() - cache.time < 30000) return cache.positions;
    try {
      const res = await fetch(CLOUD_FUNCTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: APP_SECRET, mode: 'samsaraLocations' }),
      });
      if (!res.ok) return cache.positions || [];
      const data = await res.json();
      const positions = data.positions || [];
      samsaraCacheRef.current = { time: Date.now(), positions };
      return positions;
    } catch (e) {
      return cache.positions || []; // offline or the call failed — just skip this cycle
    }
  };
  const pollSamsaraLocation = async (machine) => {
    const positions = await fetchAllSamsaraPositions();
    const match = positions.find((p) => p.name === machine);
    return match ? { lat: match.lat, lng: match.lng } : null;
  };

  // While any track session is open, check for a new position every couple
  // minutes. Safe to leave running even with pollSamsaraLocation stubbed
  // out — it just resolves to null and nothing happens.
  useEffect(() => {
    const openTracks = machineTracks.filter((t) => !t.endedAt);
    if (openTracks.length === 0) return;
    const interval = setInterval(async () => {
      for (const track of openTracks) {
        const pos = await pollSamsaraLocation(track.machine);
        if (pos) await appendTrackPoint(track.id, pos.lat, pos.lng);
      }
    }, 120000);
    return () => clearInterval(interval);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [machineTracks.filter((t) => !t.endedAt).map((t) => t.id).join(',')]);

  // Live fleet icons on the Highway Map (and any georeferenced internal
  // map, once it has reference points) show every machine's current
  // position regardless of who (if anyone) is clocked into it — this is
  // deliberately separate from the track-recording poll above, which only
  // runs for open shifts. Only polls while one of those screens is open.
  useEffect(() => {
    if (screen !== 'highwayMap' && screen !== 'maps') return;
    let cancelled = false;
    const poll = async () => {
      const positions = await fetchAllSamsaraPositions();
      if (!cancelled) setLiveFleetPositions(positions);
    };
    poll();
    const interval = setInterval(poll, 30000);
    return () => { cancelled = true; clearInterval(interval); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [screen]);

  // The device's own "you are here" position — a continuous watch (not a
  // one-shot request) so the dot actually tracks movement while either map
  // screen is open, same as the machine positions above. Silently does
  // nothing if location access isn't available or gets denied, rather than
  // interrupting the person with an error — the map still works fine
  // without it, this is just an extra layer on top.
  useEffect(() => {
    if (screen !== 'highwayMap' && screen !== 'maps') return;
    if (!navigator.geolocation) return;
    const watchId = navigator.geolocation.watchPosition(
      (pos) => setMyLiveLocation({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => {}, // denied or unavailable — just leave the marker off, no error shown
      { enableHighAccuracy: true, maximumAge: 0 }
    );
    return () => navigator.geolocation.clearWatch(watchId);
  }, [screen]);

  // Personal tracking's own independent GPS watch — deliberately NOT tied
  // to the blue-dot watcher above, which only runs on the two map screens
  // to save battery when nobody's looking at a map. Once someone's
  // actively turned tracking on, that's an explicit choice to keep
  // recording regardless of which screen they're on — checking a work
  // order or clocking someone in shouldn't silently pause the walk.
  useEffect(() => {
    if (!personalTrackingOn) return;
    if (!navigator.geolocation) return;
    const watchId = navigator.geolocation.watchPosition(
      (pos) => {
        const point = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        setPersonalTrackPoints((prev) => {
          const last = prev[prev.length - 1];
          if (last && last.lat === point.lat && last.lng === point.lng) return prev;
          return [...prev, point];
        });
      },
      () => {},
      { enableHighAccuracy: true, maximumAge: 0 }
    );
    return () => navigator.geolocation.clearWatch(watchId);
  }, [personalTrackingOn]);

  // that tracking is even on, both survive the app being closed or killed

  useEffect(() => {
    cacheSet('personalTrackingOn', personalTrackingOn);
  }, [personalTrackingOn]);
  useEffect(() => {
    cacheSet('personalTrackPoints', personalTrackPoints);

    await saveOneHighwayLocation(entry);

  const deleteHighwayLocation = async (locationId) => {
    await deleteOneHighwayLocation(locationId);

  const saveOneHighwayLine = async (line) => {
    const next = [...highwayLines, line];

    cacheSet('highwayLines', next);

  const deleteOneHighwayLine = async (lineId) => {
    const next = highwayLines.filter((l) => l.id !== lineId);
    setHighwayLines(next);
    cacheSet('highwayLines', next);
    await queueWrite('highwayLines', { kind: 'delete', entryId: lineId });

  const patchOneHighwayLine = async (lineId, patch) => {
    const next = highwayLines.map((l) => (l.id === lineId ? { ...l, ...patch } : l));
    setHighwayLines(next);
    cacheSet('highwayLines', next);
    await queueWrite('highwayLines', { kind: 'patch', entryId: lineId, patch });
  };
  const addHighwayLine = async (points, type, note, isPublicChoice, color, strokeWidth) => {
    const entry = {
      id: uid(),
      points, type,
      note: note.trim(),
      addedBy: currentMechanic,
      isPublic: LINE_TYPES[type].alwaysPublic || !!isPublicChoice,

      color: color || null,
      strokeWidth: strokeWidth || 3,

  const deleteHighwayLine = async (lineId) => {
    await deleteOneHighwayLine(lineId);

  const setHighwayLinePublic = async (lineId, isPublic) => {
    await patchOneHighwayLine(lineId, { isPublic });
  };
  const canManageHighwayLine = (line) => line.addedBy === currentMechanic || isAdmin || isForeman;
  const canSeeHighwayLine = (line) => LINE_TYPES[line.type].alwaysPublic || line.isPublic || line.addedBy === currentMechanic;


  // The most recent inspection that covered a given unit, used both for the
  // "block starting a log without one" check and the "24 hours has passed
  // mid-shift" warning — Alberta's rule is a strict rolling 24 hours from
  // the time recorded, not "once per calendar day".
  const latestInspectionFor = (unitName, driverName) => {
    const covering = preTripInspections.filter((insp) =>
      insp.driver === driverName && (insp.units || []).some((u) => u.unitName === unitName)
    );
    if (covering.length === 0) return null;
    return covering.sort((a, b) => b.time.localeCompare(a.time))[0];
  };
  const hasValidInspection = (unitName, driverName) => {
    const latest = latestInspectionFor(unitName, driverName);
    if (!latest) return false;
    return Date.now() - new Date(latest.time).getTime() < 24 * 60 * 60 * 1000;
  };
  // Hours left before the inspection actually expires — null if there's no
  // valid one at all. Used to nudge him to redo it at the start of a shift
  // rather than waiting to interrupt him mid-drive later.
  const hoursUntilInspectionExpires = (unitName, driverName) => {
    const latest = latestInspectionFor(unitName, driverName);
    if (!latest) return null;
    const elapsed = Date.now() - new Date(latest.time).getTime();
    const remaining = 24 * 60 * 60 * 1000 - elapsed;
    return remaining / 1000 / 60 / 60;
  };

  const submitPreTripInspection = async (unitsData, signature) => {
    const now = new Date().toISOString();
    const record = { id: uid(), driver: currentMechanic, time: now, units: unitsData, signature, signedAt: now };
    await saveOneInspection(record);

    // One work order per unit that had any deficiencies — every item found
    // on that unit, minor or major, goes into its own work order tagged to
    // that specific unit, exactly as needed for the paperwork.
    const newOrders = [];
    for (const u of unitsData) {
      const deficient = u.items.filter((item) => item.status === 'deficiency');
      if (deficient.length === 0) continue;
      if (!units.includes(u.unitName)) {
        await persistMeta(mechanics, [...units, u.unitName]);
      }
      const lines = deficient.map((item) => `${item.severity === 'major' ? '🔴 MAJOR' : '🟡 Minor'} — ${item.label}${item.note ? ': ' + item.note : ''}`);
      const description = await buildLocalizedField(`⚠ Pre-trip deficiencies (${fmtDate(now)}):\n${lines.join('\n')}`, lang);
      newOrders.push({
        id: uid(),
        unit: u.unitName,
        description,
        workedOnBy: [],
        hours: '',
        dueDate: '',
        dateCreated: localDateStr(),
        status: 'Open',
        notes: [],
        createdBy: currentMechanic,
        media: deficient.flatMap((item) => item.photos || []),

    }
    if (newOrders.length > 0) {
      await bulkSaveOrders(newOrders);

  };

  const openDriverLog = driverLogs.find((l) => l.driver === currentMechanic && !l.end);

  // Keeps a winch truck driver's timesheet in sync with their HOS log book
  // — the legally-binding on-duty record, not raw clock-in/out, is what
  // should determine their paid hours for that day, so the two can't
  // quietly drift apart. Called after every driver log mutation below.
  // Passing null for logForDay clears the override (used when a log is
  // deleted or a status change removed leaves nothing to sync), reverting
  // that day's entry back to normal clock-in/out math.
  const syncTimesheetToLogBook = async (driverName, dateStr, logForDay) => {
    const entry = timesheets.find((t) => t.mechanic === driverName && t.date === dateStr);
    if (!entry) return; // nothing to sync to yet — no timesheet entry for this day
    if (!logForDay) {
      await patchOneTimesheetEntry(entry.id, { logBookHours: null });
      return;
    }
    const totals = computeDutyDurations(logForDay.statusChanges, logForDay.end);
    const onDutyHours = totals.driving + totals.onDuty;
    await patchOneTimesheetEntry(entry.id, { logBookHours: Math.round(onDutyHours * 2) / 2 });
  };

  const startDriverLog = async (odometerStart, unit) => {
    const now = new Date().toISOString();
    const entry = {
      id: uid(),
      driver: currentMechanic,
      unit: unit || '',
      start: now,
      end: null,
      odometerStart: odometerStart || '',
      odometerEnd: '',
      statusChanges: [{ id: uid(), status: 'off', time: now, note: 'Starting shift' }],
      signature: null,
      signedAt: null,
    };
    await saveOneDriverLog(entry);
    await syncTimesheetToLogBook(currentMechanic, localDateStr(new Date(now)), entry);
  };

  const addDriverStatusChange = async (status, note) => {
    if (!openDriverLog) return;
    const change = { id: uid(), status, time: new Date().toISOString(), note: note || '' };
    const nextChanges = [...(openDriverLog.statusChanges || []), change];
    await patchOneDriverLog(openDriverLog.id, { statusChanges: nextChanges });
    await syncTimesheetToLogBook(currentMechanic, localDateStr(new Date(openDriverLog.start)), { ...openDriverLog, statusChanges: nextChanges });
  };

  const endDriverLog = async (odometerEnd, signature) => {
    if (!openDriverLog) return;
    const now = new Date().toISOString();
    const finalStatus = { id: uid(), status: 'off', time: now, note: 'Ending shift' };
    const nextChanges = [...(openDriverLog.statusChanges || []), finalStatus];
    await patchOneDriverLog(openDriverLog.id, {
      end: now,
      odometerEnd: odometerEnd || '',
      signature,
      signedAt: now,
      statusChanges: nextChanges,
    });
    await syncTimesheetToLogBook(currentMechanic, localDateStr(new Date(openDriverLog.start)), { ...openDriverLog, end: now, statusChanges: nextChanges });
  };

  // Fills in any of the last 14 calendar days that have no log at all, as a
  // full day of Off Duty, all signed with the same one signature — for
  // catching up after a stretch with no driving, so the required 14 days
  // on hand are never actually missing entries.
  const backfillOffDutyDriverLogs = async (dates, signature) => {
    const now = new Date().toISOString();
    const entries = dates.map((dateStr) => {
      const dayStart = new Date(dateStr + 'T00:00:00');
      return {
        id: uid(),
        driver: currentMechanic,
        start: dayStart.toISOString(),
        end: new Date(dayStart.getTime() + 24 * 60 * 60 * 1000 - 1000).toISOString(),
        odometerStart: '',
        odometerEnd: '',
        statusChanges: [{ id: uid(), status: 'off', time: dayStart.toISOString(), note: 'Off duty — did not drive' }],
        signature,
        signedAt: now,
      };
    });
    await bulkSaveDriverLogs(entries);
    await Promise.all(entries.map((e) => syncTimesheetToLogBook(currentMechanic, localDateStr(new Date(e.start)), e)));
  };

  // Admin-side editing — always available, even on an approved log, per
  // how this was specifically asked for (unlike Timesheets, where approval
  // is closer to a soft lock).
  const updateDriverLog = async (logId, patch) => {
    await patchOneDriverLog(logId, patch);
    const log = driverLogs.find((l) => l.id === logId);
    if (log) await syncTimesheetToLogBook(log.driver, localDateStr(new Date(log.start)), { ...log, ...patch });
  };
  const deleteDriverLog = async (logId) => {
    const log = driverLogs.find((l) => l.id === logId);
    await deleteOneDriverLog(logId);
    setEditingDriverLogId(null);
    if (log) await syncTimesheetToLogBook(log.driver, localDateStr(new Date(log.start)), null);
  };
  // For a status change that was genuinely missed in the moment — a real
  // break he took but forgot to log — admin needs to backfill it with
  // whatever time it actually happened, not "now".
  const addMissedStatusChange = async (logId, status, time, note) => {
    const change = { id: uid(), status, time: new Date(time).toISOString(), note: note || '' };
    const log = driverLogs.find((l) => l.id === logId);
    if (!log) return;
    const nextChanges = [...(log.statusChanges || []), change].sort((a, b) => new Date(a.time) - new Date(b.time));
    await patchOneDriverLog(logId, { statusChanges: nextChanges });
    await syncTimesheetToLogBook(log.driver, localDateStr(new Date(log.start)), { ...log, statusChanges: nextChanges });
  };
  const updateDriverStatusChange = async (logId, changeId, patch) => {
    const log = driverLogs.find((l) => l.id === logId);
    if (!log) return;
    const nextChanges = (log.statusChanges || [])
      .map((c) => (c.id === changeId ? { ...c, ...patch } : c))
      .sort((a, b) => new Date(a.time) - new Date(b.time));
    await patchOneDriverLog(logId, { statusChanges: nextChanges });
    await syncTimesheetToLogBook(log.driver, localDateStr(new Date(log.start)), { ...log, statusChanges: nextChanges });
  };
  const removeDriverStatusChange = async (logId, changeId) => {
    const log = driverLogs.find((l) => l.id === logId);
    if (!log) return;
    const nextChanges = (log.statusChanges || []).filter((c) => c.id !== changeId);
    await patchOneDriverLog(logId, { statusChanges: nextChanges });
    await syncTimesheetToLogBook(log.driver, localDateStr(new Date(log.start)), { ...log, statusChanges: nextChanges });
  };

  const isDriverLogWeekApproved = (weekStart) => !!driverLogApprovals[weekStart];
  const approveDriverLogWeek = async (weekStart) => {
    const next = { ...driverLogApprovals, [weekStart]: { approvedBy: currentMechanic, approvedAt: new Date().toISOString() } };
    setDriverLogApprovals(next);
    await firebase.database().ref('driverLogApprovals').set(next).catch(() => alert("Couldn't save — check your signal and try again."));
  };
  const unapproveDriverLogWeek = async (weekStart) => {
    const next = { ...driverLogApprovals };
    delete next[weekStart];
    setDriverLogApprovals(next);
    await firebase.database().ref('driverLogApprovals').set(next).catch(() => alert("Couldn't save — check your signal and try again."));
  };

  const persistBlocks = async (next) => {
    setBlocks(next);
    cacheSet('blocks', next);
    await queueWrite('blocks', { kind: 'setWhole', value: next });
  };
  const persistProductionSettings = async (next) => {
    setProductionSettings(next);
    cacheSet('productionSettings', next);
    await queueWrite('productionSettings', { kind: 'setWhole', value: next });
  };

  const openProductionShift = productionShifts.find((s) => s.employee === currentMechanic && !s.end);

  const startProductionShift = async (machineOverride) => {
    const entry = {
      id: uid(),
      employee: currentMechanic,
      employeeRole: roleFor(currentMechanic),
      machine: machineOverride || assignedUnitFor(currentMechanic),
      block: '',
      start: new Date().toISOString(),
      end: null,
      startHours: '',
      endHours: '',
      spruce: '',
      aspen: '',
      trees: '',
      loadCount: '',
      topPileCount: '',
      fuelLog: {},
      extraTasks: [],
      notes: '',
      downtimeLog: [],
    };
    await saveOneProductionShift(entry);
    if (TRACK_ELIGIBLE_TYPES.includes(machineType(entry.machine, unitTypes))) {
      await startMachineTrack('productionShift', entry.id, entry.machine, currentMechanic);
    }

  const patchOpenProductionShift = async (patch) => {
    if (!openProductionShift) return;
    await patchOneProductionShift(openProductionShift.id, patch);
  };

  const attemptProductionClockOut = () => {
    if (!openProductionShift) return;
    const shiftType = machineType(openProductionShift.machine, unitTypes);
    if (shiftType !== 'fuel' && shiftType !== 'winch' && !openProductionShift.block) {
      alert('Select or add a block number before clocking out.');
      return;
    }
    setShowProductionClockOutReview(true);
  };

  const confirmProductionClockOut = async (signatureDataUrl) => {
    await patchOpenProductionShift({ end: new Date().toISOString(), signature: signatureDataUrl, signedAt: new Date().toISOString() });
    if (openProductionShift && TRACK_ELIGIBLE_TYPES.includes(machineType(openProductionShift.machine, unitTypes))) {
      await endMachineTrack('productionShift', openProductionShift.id);
    }
    setShowProductionClockOutReview(false);
    setTodaysJobChoice(null);
  };

  // Switching to a unit of the same machine type (e.g. one buncher to
  // another) just relabels the current shift — same kind of work, no
  // reason to split the numbers. A genuinely different kind of machine
  // finalizes the current shift (through the normal review/signature
  // step, so nothing about that machine's numbers gets skipped) and opens
  // a fresh one, so each machine's production stays cleanly separated
  // instead of one shift's tallies mixing work from two different jobs.
  const requestMachineSwitch = (newMachine) => {
    if (!openProductionShift || !newMachine || newMachine === openProductionShift.machine) {
      setShowSwitchMachine(false);
      return;
    }
    const currentType = machineType(openProductionShift.machine, unitTypes);
    const newType = machineType(newMachine, unitTypes);
    setShowSwitchMachine(false);
    if (currentType === newType) {
      patchOpenProductionShift({ machine: newMachine });
      return;
    }
    const shiftType = currentType;
    if (shiftType !== 'fuel' && shiftType !== 'winch' && !openProductionShift.block) {
      alert('Select or add a block number for the current machine before switching — that finalizes its numbers first.');
      return;
    }
    setPendingSwitchMachine(newMachine);
    setShowProductionClockOutReview(true);
  };
  const confirmMachineSwitch = async (signatureDataUrl) => {
    const newMachine = pendingSwitchMachine;
    await patchOpenProductionShift({ end: new Date().toISOString(), signature: signatureDataUrl, signedAt: new Date().toISOString() });
    if (openProductionShift && TRACK_ELIGIBLE_TYPES.includes(machineType(openProductionShift.machine, unitTypes))) {
      await endMachineTrack('productionShift', openProductionShift.id);
    }
    setShowProductionClockOutReview(false);
    setPendingSwitchMachine(null);
    setTodaysJobChoice(newMachine);
    await startProductionShift(newMachine);
  };

  const addExtraTask = async (desc, hours) => {
    if (!openProductionShift || !desc.trim() || !parseFloat(hours)) return;
    const next = [...(openProductionShift.extraTasks || []), { id: uid(), desc: desc.trim(), hours: parseFloat(hours) }];
    await patchOpenProductionShift({ extraTasks: next });
  };
  const removeExtraTask = async (taskId) => {
    if (!openProductionShift) return;
    await patchOpenProductionShift({ extraTasks: (openProductionShift.extraTasks || []).filter((t) => t.id !== taskId) });
  };

  const logDowntime = async (reason) => {
    if (!openProductionShift || !reason.trim()) return;
    const entry = { id: uid(), reason: reason.trim(), ts: new Date().toISOString() };
    await patchOpenProductionShift({ downtimeLog: [...(openProductionShift.downtimeLog || []), entry] });
    // Also creates a real Open work order on the board, tagged to the
    // machine, so it doesn't just sit as a log entry nobody sees.
    if (!units.includes(openProductionShift.machine)) {
      await persistMeta(mechanics, [...units, openProductionShift.machine]);
    }
    const order = {
      id: uid(),
      unit: openProductionShift.machine,
      description: await buildLocalizedField('⚠ Downtime: ' + reason.trim(), lang),
      workedOnBy: [],
      hours: '',
      dueDate: '',
      dateCreated: localDateStr(),
      status: 'Open',
      notes: [],
      createdBy: currentMechanic,
      media: [],
    };
    await saveOneOrder(order);
  };

  const addBlock = async (name) => {
    const trimmed = name.trim();
    if (!trimmed || blocks.includes(trimmed)) return;
    await persistBlocks([...blocks, trimmed]);
  };
  const updateProductionShift = async (id, patch) => {
    await patchOneProductionShift(id, patch);
    setEditingShiftId(null);
  };
  const deleteProductionShift = async (id) => {
    await deleteOneProductionShift(id);
    setEditingShiftId(null);
  };

  const removeMechanic = async (name) => {
    const nextMechanics = mechanics.filter((m) => m !== name);
    await persistMeta(nextMechanics, units);
    const nextPins = { ...pins };
    delete nextPins[name];
    await persistPins(nextPins);
    if (admins.includes(name)) {
      const nextAdmins = admins.filter((a) => a !== name);
      setAdmins(nextAdmins);
      await saveAdmins(nextAdmins);
    }
    // Also clear their role/job/machine so a future same-name re-invite
    // (a genuine possibility over the years) starts fresh rather than
    // silently inheriting whatever access this person used to have.
    const slug = slugForMechanic(name);
    await firebase.database().ref('roles/' + slug).remove().catch(() => {});
    await firebase.database().ref('unitAssignments/' + slug).remove().catch(() => {});
    setShowRemoveConfirm(null);
  };

  const removeAllExceptSelf = async () => {
    const keep = [currentMechanic];
    await persistMeta(keep, units);
    await persistPins({ [currentMechanic]: pins[currentMechanic] });
    await saveAdmins(admins.filter((a) => a === currentMechanic));
    setAdmins(admins.filter((a) => a === currentMechanic));
    // Same cleanup as removeMechanic, for everyone being removed here too.
    await Promise.all(
      mechanics.filter((m) => m !== currentMechanic).map(async (m) => {
        const slug = slugForMechanic(m);
        await firebase.database().ref('roles/' + slug).remove().catch(() => {});
        await firebase.database().ref('unitAssignments/' + slug).remove().catch(() => {});
      })
    );
    setShowRemoveAllConfirm(false);
  };


  // Saves are retried once automatically (a weak signal in the shop can make
  // a single attempt fail), and if it still fails, the person is told
  // directly rather than the app silently pretending it worked.
  const persistTimesheets = async (next) => {
    const check = await safeToOverwrite('timesheets', next);
    if (!check.ok) {
      alert(`Save blocked to protect existing data — this device only has ${check.nextCount} entries loaded, but the server has ${check.serverCount}. Close and fully reopen the app to sync everything, then try again.`);
      return;
    }
    setTimesheets(next);
    try {
      await saveTimesheets(next);
    } catch (e) {
      try {
        await new Promise((r) => setTimeout(r, 1500));
        await saveTimesheets(next);
      } catch (e2) {
        alert(t('saveFailedWarning'));
      }
    }
  };

  // Per-record equivalents — each one only ever touches its own entry's
  // own node, so two people saving at the same moment can never collide.
  // No safeToOverwrite guard needed here: that check existed specifically
  // to catch a stale FULL ARRAY about to overwrite newer data written by
  // someone else, which simply can't happen when every write is scoped to
  // one entry's own id.
  const saveOneTimesheetEntry = async (entry) => {
    const next = timesheets.some((t) => t.id === entry.id) ? timesheets.map((t) => (t.id === entry.id ? entry : t)) : [...timesheets, entry];
    setTimesheets(next);
    cacheSet('timesheets', next);
    await queueWrite('timesheets', { kind: 'save', entry });
  };
  const patchOneTimesheetEntry = async (entryId, patch) => {
    const next = timesheets.map((t) => (t.id === entryId ? { ...t, ...patch } : t));
    setTimesheets(next);
    cacheSet('timesheets', next);
    await queueWrite('timesheets', { kind: 'patch', entryId, patch });
  };
  const deleteOneTimesheetEntry = async (entryId) => {
    const next = timesheets.filter((t) => t.id !== entryId);
    setTimesheets(next);
    cacheSet('timesheets', next);
    await queueWrite('timesheets', { kind: 'delete', entryId });
  };

  const todayStr = () => localDateStr();

  // The "open" entry for the current mechanic today: clocked in but not yet clocked out.
  // Find the mechanic's most recent still-open shift, regardless of what
  // calendar date it is right now — a shift that started before midnight and
  // gets clocked out after midnight must still be findable.
  const openEntry = timesheets
    .filter((t) => t.mechanic === currentMechanic && !t.clockOut)
    .sort((a, b) => new Date(b.clockIn) - new Date(a.clockIn))[0];

  // Prompt to clock in once per login, if they haven't already for today.
  // Mechanics only — production employees already get a clear "Not clocked
  // in" prompt right on their own Shift screen, no need to duplicate it here.
  useEffect(() => {
    if (currentMechanic && !openEntry && jobTypeFor(currentMechanic) === 'mechanic') {
      setShowClockInPrompt(true);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [currentMechanic]);

  // Detect completed-work-order milestones per mechanic. Small ones celebrate
  // themselves automatically; big ones wait for the admin to personalize them.
  useEffect(() => {
    if (!currentMechanic || mechanics.length === 0) return;
    mechanics.forEach((m) => {
      const doneOrders = orders.filter((o) => o.status === 'Done' && getAssignedMechanics(o).includes(m));
      const count = doneOrders.length;
      if (count === 0) return;
      const already = milestonesCelebrated[m] || [];
      const nextMilestone = ALL_MILESTONES.find((n) => n <= count && !already.includes(n));
      if (!nextMilestone) return;
      const latestOrder = doneOrders.slice().sort((a, b) => (b.dateCreated || '').localeCompare(a.dateCreated || ''))[0];
      if (!latestOrder) return;

      if (BIG_MILESTONES.includes(nextMilestone)) {
        if (isAdmin && !milestonePrompt) {
          setMilestonePrompt({ mechanic: m, count: nextMilestone, orderId: latestOrder.id });
        }
      } else {
        const nextCelebrated = { ...milestonesCelebrated, [m]: [...already, nextMilestone] };
        setMilestonesCelebrated(nextCelebrated);
        saveMilestonesCelebrated(nextCelebrated);
        addNote(latestOrder.id, `🎉 ${m} just completed their ${nextMilestone}th work order! Great work.`, 'shoutout');
      }
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [orders, mechanics, currentMechanic]);

  const resolveMilestonePrompt = async (customText) => {
    if (!milestonePrompt) return;
    const { mechanic, count, orderId } = milestonePrompt;
    const message = (customText || '').trim() || `🎉 ${mechanic} just hit ${count} completed work orders! Incredible work.`;
    await addNote(orderId, message, 'shoutout');
    const already = milestonesCelebrated[mechanic] || [];
    const next = { ...milestonesCelebrated, [mechanic]: [...already, count] };
    setMilestonesCelebrated(next);
    await saveMilestonesCelebrated(next);
    setMilestonePrompt(null);
  };

  const [timeClockActionPending, setTimeClockActionPending] = useState(false);

  // These buttons react to live data from Firebase, and on a weak signal
  // there's a real window where the screen briefly reverts to the old state
  // before the write actually lands — a repeat tap in that window can hit
  // the wrong button entirely (e.g. lands on Clock Out instead of End
  // Break). Locking the button the instant it's tapped closes that window.
  const clockIn = async () => {
    if (timeClockActionPending) return;
    setTimeClockActionPending(true);
    const entry = {
      id: uid(),
      mechanic: currentMechanic,
      date: todayStr(),
      clockIn: new Date().toISOString(),
      lunchStart: null,
      lunchEnd: null,
      skippedLunch: false,
      clockOut: null,
      jobs: [],
    };
    try {
      await saveOneTimesheetEntry(entry);
    } finally {
      setTimeClockActionPending(false);
    }
  };

  const startLunch = async () => {
    if (!openEntry || timeClockActionPending) return;
    setTimeClockActionPending(true);
    try {
      await patchOneTimesheetEntry(openEntry.id, { lunchStart: new Date().toISOString() });
    } finally {
      setTimeClockActionPending(false);
    }
  };

  const endLunch = async () => {
    if (!openEntry || timeClockActionPending) return;
    setTimeClockActionPending(true);
    try {
      await patchOneTimesheetEntry(openEntry.id, { lunchEnd: new Date().toISOString() });
    } finally {
      setTimeClockActionPending(false);
    }
  };

  const [pendingClockOutSkippedLunch, setPendingClockOutSkippedLunch] = useState(null);

  const clockOut = async (skippedLunch, signatureDataUrl) => {
    if (!openEntry) return;
    await patchOneTimesheetEntry(openEntry.id, {
      clockOut: new Date().toISOString(),
      skippedLunch: !!skippedLunch,
      signature: signatureDataUrl || null,
      signedAt: signatureDataUrl ? new Date().toISOString() : null,
    });
    setLunchPrompt(false);
    setPendingClockOutSkippedLunch(null);
    setTodaysJobChoice(null);
  };

  const attemptClockOut = async () => {
    if (!openEntry) return;
    // Same stale-state risk seen elsewhere — if the app was just reopened
    // and hasn't finished syncing yet, local state could still show the
    // break as missing even though it was genuinely recorded. A fresh,
    // direct read avoids incorrectly prompting in that case. This now
    // reads just this one entry's own node instead of the whole
    // collection — a smaller, faster, and more precise check than before.
    let effectiveEntry = openEntry;
    try {
      const snap = await firebase.database().ref('timesheetEntries/' + openEntry.id).once('value');
      const fresh = snap.val();
      if (fresh) effectiveEntry = fresh;
    } catch (e) {
      // offline or similar — fall back to local state rather than blocking clock-out entirely
    }
    const hasLunch = effectiveEntry.lunchStart && effectiveEntry.lunchEnd;
    if (!hasLunch && !effectiveEntry.skippedLunch) {
      setLunchPrompt(true);
      return;
    }
    setPendingClockOutSkippedLunch(effectiveEntry.skippedLunch || false);
  };

  const addTimesheetJob = async (entryId, unit, hours) => {
    const trimmedUnit = unit.trim();
    const parsedHours = parseFloat(hours);
    if (!trimmedUnit || !parsedHours || parsedHours <= 0) return;
    const entry = timesheets.find((t) => t.id === entryId);
    const currentJobs = (entry && entry.jobs) || [];
    await patchOneTimesheetEntry(entryId, { jobs: [...currentJobs, { id: uid(), unit: trimmedUnit, hours: parsedHours }] });
  };

  const removeTimesheetJob = async (entryId, jobId) => {
    const entry = timesheets.find((t) => t.id === entryId);
    const currentJobs = (entry && entry.jobs) || [];
    await patchOneTimesheetEntry(entryId, { jobs: currentJobs.filter((j) => j.id !== jobId) });
  };

  const updateTimesheetEntry = async (entryId, patch) => {
    await patchOneTimesheetEntry(entryId, patch);
  };

  const deleteTimesheetEntry = async (entryId) => {
    await deleteOneTimesheetEntry(entryId);
  };

  // Adds a whole missed day — for when clock in/out was forgotten entirely,
  // so there's no existing entry to edit. mechanicName lets an admin add a
  // day on behalf of anyone; a mechanic adding their own just passes their
  // own name.
  const addManualEntry = async (mechanicName, date, clockInLocal, clockOutLocal, lunchStartLocal, lunchEndLocal) => {
    const entry = {
      id: uid(),
      mechanic: mechanicName,
      date,
      clockIn: clockInLocal ? new Date(clockInLocal).toISOString() : null,
      clockOut: clockOutLocal ? new Date(clockOutLocal).toISOString() : null,
      lunchStart: lunchStartLocal ? new Date(lunchStartLocal).toISOString() : null,
      lunchEnd: lunchEndLocal ? new Date(lunchEndLocal).toISOString() : null,
      skippedLunch: !lunchStartLocal && !lunchEndLocal,
      jobs: [],
    };
    await saveOneTimesheetEntry(entry);
  };

  const addManualProductionShift = async (employeeName, date, startLocal, endLocal, machine, block, numbers) => {
    const shift = {
      id: uid(),
      employee: employeeName,
      employeeRole: roleFor(employeeName),
      machine,
      block: block || null,
      start: startLocal ? new Date(startLocal).toISOString() : null,
      end: endLocal ? new Date(endLocal).toISOString() : null,
      extraTasks: [],
      downtimeLog: [],
      ...numbers,
    };
    await saveOneProductionShift(stripUndefined(shift));
  };

  const isWeekApproved = (weekStart) => !!timesheetApprovals[weekStart];

  const approveWeek = async (weekStart) => {
    const next = { ...timesheetApprovals, [weekStart]: { approvedBy: currentMechanic, approvedAt: new Date().toISOString() } };
    setTimesheetApprovals(next);
    await saveTimesheetApprovals(next);
  };

  const unapproveWeek = async (weekStart) => {
    const next = { ...timesheetApprovals };
    delete next[weekStart];
    setTimesheetApprovals(next);
    await saveTimesheetApprovals(next);
  };

  // Always shows 2 decimals, even for whole numbers (9 -> "9.00") — unlike
  // fmtHoursDecimal, which strips trailing zeros for the app's own
  // on-screen displays. The bookkeeper's format keeps them, so this export
  // needs its own formatter to match exactly.
  const fmtHoursFixed2 = (h) => (h || 0).toFixed(2);
  const roundToHalf = (n) => Math.round(n * 2) / 2;
  // Seconds-precision time, for this export only — the shared fmtTime used
  // for on-screen display deliberately omits seconds since that's just
  // clutter there, but the bookkeeper's payroll record format includes it.
  const fmtTimeWithSeconds = (iso) => (iso ? new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true }) : '');

  const exportTimesheets = async (entries, productionEntries, filenamePrefix, rangeStart, rangeEnd) => {
    const rows = [];

    if (entries.length > 0) {
      const sorted = [...entries].sort((a, b) => (a.mechanic || '').localeCompare(b.mechanic || '') || a.date.localeCompare(b.date));
      const byMechanic = {};
      sorted.forEach((e) => {
        const name = e.mechanic || 'Unknown';
        if (!byMechanic[name]) byMechanic[name] = [];
        byMechanic[name].push(e);
      });

      const mechanicNames = Object.keys(byMechanic).sort();
      mechanicNames.forEach((name, mechanicIndex) => {
        if (mechanicIndex > 0) { rows.push([]); rows.push([]); }
        rows.push(['Mechanic', 'Date', 'Clock In', 'Clock Out', 'Break Start', 'Break End', 'Worked Through Break', 'Paid Hours', 'Jobs']);

        const entriesByDate = {};
        byMechanic[name].forEach((e) => {
          if (!entriesByDate[e.date]) entriesByDate[e.date] = [];
          entriesByDate[e.date].push(e);
        });
        // A day with more than one clock-in/out (e.g. left and came back
        // later) sorts oldest-first so the pairs read in the order they
        // actually happened, not whatever order they were saved in.
        Object.values(entriesByDate).forEach((list) => list.sort((a, b) => new Date(a.clockIn || 0) - new Date(b.clockIn || 0)));

        // Only fill in every day when an explicit range was actually
        // requested (the weekly export, or Export & Share with From/To
        // both set) — an open-ended "all time" export has no natural
        // range to fill in against, so it stays as just the days with
        // real entries, same as before.
        const dates = (rangeStart && rangeEnd)
          ? (() => {
              const list = [];
              let d = new Date(rangeStart + 'T00:00:00');
              const end = new Date(rangeEnd + 'T00:00:00');
              while (d <= end) {
                list.push(d.toISOString().slice(0, 10));
                d.setDate(d.getDate() + 1);
              }
              return list;
            })()
          : Object.keys(entriesByDate).sort();

        let regularTotal = 0;
        let overtimeTotal = 0;
        dates.forEach((dateStr) => {
          const dayEntries = entriesByDate[dateStr];
          if (!dayEntries || dayEntries.length === 0) {
            rows.push([name, dateStr, '', '', '', '', '', '', '']);
            return;
          }
          // Combined total for the day across every clock-in/out pair —
          // this is what the 10-hour overtime threshold applies to, not
          // any single pair on its own, so someone who left and came
          // back later the same day is measured against their whole day.
          const hours = dayEntries.reduce((sum, e) => sum + entryHours(e), 0);
          // Overtime is anything worked beyond 10 hours in that one day —
          // the only rule used here, confirmed directly against real
          // payroll totals rather than assumed.
          const dailyOvertime = Math.max(0, hours - 10);
          const dailyRegular = hours - dailyOvertime;
          regularTotal += dailyRegular;
          overtimeTotal += dailyOvertime;
          const jobsStr = dayEntries.flatMap((e) => (e.jobs || []).map((j) => `${j.unit}: ${j.hours}h`)).join(' | ');
          const workedThroughBreak = dayEntries.some((e) => e.skippedLunch) ? 'Yes' : 'No';
          rows.push([
            name,
            dateStr,
            dayEntries.map((e) => fmtTimeWithSeconds(e.clockIn)).join(' / '),
            dayEntries.map((e) => fmtTimeWithSeconds(e.clockOut)).join(' / '),
            dayEntries.map((e) => fmtTimeWithSeconds(e.lunchStart)).filter(Boolean).join(' / '),
            dayEntries.map((e) => fmtTimeWithSeconds(e.lunchEnd)).filter(Boolean).join(' / '),
            workedThroughBreak,
            fmtHoursFixed2(hours),
            jobsStr,
          ]);
        });
        rows.push(['', '', '', '', '', '', 'Regular Hours (nearest 0.5):', fmtHoursFixed2(roundToHalf(regularTotal)), '']);
        rows.push(['', '', '', '', '', '', 'Overtime Hours (nearest 0.5):', fmtHoursFixed2(roundToHalf(overtimeTotal)), '']);
        rows.push(['', '', '', '', '', '', 'Total Hours (nearest 0.5):', fmtHoursFixed2(roundToHalf(regularTotal + overtimeTotal)), '']);
      });
    }

    if (productionEntries && productionEntries.length > 0) {
      if (entries.length > 0) { rows.push([]); rows.push([]); }
      rows.push(['═══ PRODUCTION ═══']);
      rows.push(['Employee', 'Date', 'Machine', 'Block', 'Start', 'End', 'Paid Hours', 'Extra Hours (billing only)', 'Production', 'Downtime Reports']);
      const sortedProd = [...productionEntries].sort((a, b) => (a.employee || '').localeCompare(b.employee || '') || (a.end || '').localeCompare(b.end || ''));
      let lastEmployee = null;
      sortedProd.forEach((s) => {
        if (s.employee !== lastEmployee) {
          if (lastEmployee !== null) rows.push([]);
          rows.push([`── ${s.employee} ──`]);
        }
        lastEmployee = s.employee;
        const hours = s.start && s.end ? (new Date(s.end) - new Date(s.start)) / 1000 / 60 / 60 : 0;
        const extraHours = (s.extraTasks || []).reduce((sum, t) => sum + (parseFloat(t.hours) || 0), 0);
        rows.push([
          s.employee,
          (s.end || s.start || '').slice(0, 10),
          s.machine,
          s.block || '',
          fmtTime(s.start),
          fmtTime(s.end),
          fmtHoursDecimal(hours),
          extraHours > 0 ? fmtHoursDecimal(extraHours) : '',
          productionSummary(s, unitTypes),
          (s.downtimeLog || []).length || '',
        ]);
      });
    }

    const csv = rows.map((r) => r.map((cell) => `"${String(cell || '').replace(/"/g, '""')}"`).join(',')).join('\n');
    const filename = `${filenamePrefix || 'timesheets'}-${todayStr()}.csv`;
    const file = new File([csv], filename, { type: 'text/csv' });

    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: 'Timesheets export',
          text: timesheetSettings.email ? `Timesheets for ${timesheetSettings.email}` : 'Timesheets export',
        });
        return;
      } catch (e) {
        // user cancelled the share sheet — fall through to download
      }
    }
    // Fallback: plain download if sharing isn't available on this device
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  };

  const addUnit = async (type) => {
    const name = newUnitName.trim();
    if (!name || units.includes(name)) return;
    await persistMeta(mechanics, [...units, name]);
    if (type) await firebase.database().ref('unitTypes/' + slugForUnit(name)).set(type).catch(() => alert("Couldn't save the type tag — check your signal and try again."));
    setNewUnitName('');
    setShowAddUnit(false);
  };
  const setUnitType = async (name, type) => {
    if (type) {
      await firebase.database().ref('unitTypes/' + slugForUnit(name)).set(type).catch(() => alert("Couldn't save — check your signal and try again."));
    } else {
      await firebase.database().ref('unitTypes/' + slugForUnit(name)).remove().catch(() => alert("Couldn't save — check your signal and try again."));
    }
  };
  const renameUnit = async (oldName, newName) => {
    const trimmed = newName.trim();
    if (!trimmed || trimmed === oldName) return;
    if (units.includes(trimmed)) {
      alert('A unit with that number already exists.');
      return;
    }
    await persistMeta(mechanics, units.map((u) => (u === oldName ? trimmed : u)));
    // Read the current type straight from Firebase rather than trusting
    // local state, which could be a moment stale right at rename time —
    // and fall back to a case-insensitive search in case the old unit's
    // exact-case slug doesn't match what's actually stored (this is
    // exactly what silently lost the type tag before: slugForUnit is
    // case-sensitive, so "Hb1" and "HB1" are different keys).
    let oldType = null;
    try {
      const snap = await firebase.database().ref('unitTypes').once('value');
      const allTypes = snap.val() || {};
      const exactSlug = slugForUnit(oldName);
      oldType = allTypes[exactSlug] || null;
      if (!oldType) {
        const matchKey = Object.keys(allTypes).find((k) => k.toLowerCase() === exactSlug.toLowerCase());
        if (matchKey) oldType = allTypes[matchKey];
      }
    } catch (e) {
      oldType = unitTypes[slugForUnit(oldName)]; // fall back to local state if Firebase read itself fails
    }
    if (oldType) {
      await firebase.database().ref('unitTypes/' + slugForUnit(trimmed)).set(oldType).catch(() => alert("Renamed the unit, but couldn't carry over its type tag — set it again from the dropdown."));
      await firebase.database().ref('unitTypes/' + slugForUnit(oldName)).remove().catch(() => {});
    }
    // Anyone currently assigned to this unit should follow the rename,
    // rather than being silently left pointing at a unit number that no
    // longer exists.
    const reassignments = {};
    Object.entries(unitAssignments).forEach(([slug, unit]) => {
      if (unit === oldName) reassignments[slug] = trimmed;
    });
    if (Object.keys(reassignments).length > 0) {
      await firebase.database().ref('unitAssignments').update(reassignments).catch(() => alert("Renamed the unit, but couldn't update everyone's assignment — check their assignment manually."));
    }
  };

  const createOrder = async (data, scanPhotoDataUrl) => {
    const unitName = (data.unit || activeUnit || '').trim();
    if (!unitName) return;
    if (!units.includes(unitName)) {
      await persistMeta(mechanics, [...units, unitName]);
    }
    const descriptionField = await buildLocalizedField(data.description, lang);
    const order = {
      id: uid(),
      unit: unitName,
      description: descriptionField,
      workedOnBy: [currentMechanic],
      hours: data.hours,
      dueDate: data.dueDate,
      dateCreated: localDateStr(),
      status: 'Open',
      notes: [],
      createdBy: currentMechanic,
      onBoard: true, // new orders show up right away; older/queued ones need to be pulled out deliberately
      media: scanPhotoDataUrl ? [{ id: uid(), dataUrl: scanPhotoDataUrl, author: currentMechanic, ts: new Date().toISOString() }] : [],
    };
    await saveOneOrder(order);
    setShowAddOrder(false);
    setScanReviewData(null);
  };

  // Older orders saved before this feature existed have no onBoard field at
  // all — treated as already on the board so nothing already-visible
  // suddenly vanishes the moment this ships.
  const isOnBoard = (order) => order.onBoard !== false;

  const pullOntoBoard = async (orderId) => {
    await updateOrder(orderId, { onBoard: true });
  };

  const pullOffBoard = async (orderId) => {
    await updateOrder(orderId, { onBoard: false });
  };

  // Sends a photo of a receipt/invoice to the backend, which asks Claude to
  // read it, then opens the normal new-work-order form pre-filled with
  // whatever it found — nothing is ever saved without the person reviewing
  // and confirming it first.
  const handleScanReceipt = async (file) => {
    setScanningReceipt(true);
    try {
      const compressed = await compressImage(file);
      const base64 = compressed.split(',')[1];
      const res = await fetch(CLOUD_FUNCTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: APP_SECRET, mode: 'scanReceipt', image: base64, mediaType: 'image/jpeg' }),
      });
      if (!res.ok) throw new Error('Scan failed');
      const data = await res.json();
      const ex = data.extracted || {};
      const descParts = [];
      if (ex.vendor) descParts.push(`Vendor: ${ex.vendor}`);
      if (ex.amount) descParts.push(`Amount: ${ex.amount}`);
      if (ex.date) descParts.push(`Date on receipt: ${ex.date}`);
      if (ex.description) descParts.push(ex.description);
      setScanReviewData({
        description: descParts.join('\n'),
        unit: ex.unit && units.includes(ex.unit) ? ex.unit : '',
        photoDataUrl: compressed,
      });
      setShowAddOrder(true);
    } catch (e) {
      alert("Couldn't read that photo — check your signal and try again, or just type in the work order normally.");
    } finally {
      setScanningReceipt(false);
    }
  };

  // Instead of pre-assigning who's "supposed" to work on something,
  // whoever actually opens and edits an order (including just checking
  // off a checklist item) gets automatically credited on it — every
  // checklist-related function already funnels through here, so this one
  // spot covers all of them.
  const withWorkedOnBy = (order) => {
    const existing = order.workedOnBy || [];
    if (existing.includes(currentMechanic)) return existing;
    return [...existing, currentMechanic];
  };

  const updateOrder = async (id, patch) => {
    const order = orders.find((o) => o.id === id);
    if (!order) return;
    await patchOneOrder(id, { ...patch, workedOnBy: withWorkedOnBy(order) });
  };

  const addNote = async (id, text, type) => {
    if (!text.trim()) return;
    const trimmed = text.trim();
    const note = { id: uid(), author: currentMechanic, text: trimmed, ts: new Date().toISOString(), type: type || 'note' };
    if (lang === 'es') {
      const translated = await translateText(trimmed);
      if (translated) {
        note.originalText = trimmed;
        note.originalLang = 'es';
        note.text = translated;
      }
    }
    const order = orders.find((o) => o.id === id);
    if (!order) return;
    await patchOneOrder(id, { notes: [...(order.notes || []), note], workedOnBy: withWorkedOnBy(order) });
  };

  const updateNote = async (orderId, noteId, text) => {
    if (!text.trim()) return;
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    await patchOneOrder(orderId, { notes: (order.notes || []).map((n) => (n.id === noteId ? { ...n, text: text.trim(), edited: true } : n)) });
    setEditingNoteId(null);
  };

  const deleteNote = async (orderId, noteId) => {
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    await patchOneOrder(orderId, { notes: (order.notes || []).filter((n) => n.id !== noteId) });
  };

  const saveNotePdt = async (orderId, noteId, pdtText) => {
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    await patchOneOrder(orderId, { notes: (order.notes || []).map((n) => (n.id === noteId ? { ...n, pdtText: pdtText.trim() || null } : n)) });
  };

  const addPhotos = async (id, dataUrls) => {
    const photos = dataUrls.map((dataUrl) => ({
      id: uid(),
      dataUrl,
      author: currentMechanic,
      ts: new Date().toISOString(),
    }));
    const order = orders.find((o) => o.id === id);
    if (!order) return;
    await patchOneOrder(id, { media: [...(order.media || []), ...photos], workedOnBy: withWorkedOnBy(order) });
  };

  const removePhoto = async (orderId, photoId) => {
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    await patchOneOrder(orderId, { media: (order.media || []).filter((m) => m.id !== photoId) });
  };

  const deleteOrder = async (id) => {
    await deleteOneOrder(id);
    setScreen('unit');
    setConfirmDelete(false);
  };

  if (loading) {
    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="flex items-center justify-center font-display">
        {FONT_STYLE}
        <OfflineBanner isOnline={isOnline} />
        <PinModalOverlay
          pinModal={pinModal}
          pinInput={pinInput}
          setPinInput={setPinInput}
          pinError={pinError}
          onSubmit={submitPin}
          onCancel={cancelPinModal}
          onForgot={forgotPin}
          t={t}
        />
        <EmailPromptOverlay
          show={showEmailPrompt}
          onSave={async (email) => {
            await saveMechanicEmail(currentMechanic, email);
            setShowEmailPrompt(false);
          }}
          onSkip={() => setShowEmailPrompt(false)}
        />
        <PushPromptOverlay
          show={showPushPrompt}
          mechanic={currentMechanic}
          onEnable={async () => {
            await registerPushNotifications(currentMechanic);
            setShowPushPrompt(false);
          }}
          onSkip={() => setShowPushPrompt(false)}
        />
        <BiometricOfferOverlay
          mechanic={offerBiometric}
          onEnable={async () => {
            const name = offerBiometric;
            setOfferBiometric(null);
            try {
              await registerBiometric(name);
            } catch (e) {
              // ignore — user can enable it later from the board
            }
          }}
          onSkip={() => setOfferBiometric(null)}
        />
        {loadingTooLong ? (
          <div className="text-center px-6">
            <p className="text-sm mb-1" style={{ color: COLORS.inkDim }}>This is taking longer than it should.</p>
            <p className="text-xs mb-4" style={{ color: COLORS.line }}>Check your signal, or try again below.</p>
            <button onClick={() => window.location.reload()} className="px-4 py-2 rounded-lg text-sm font-bold" style={{ background: COLORS.accent, color: COLORS.bg }}>Try again</button>
          </div>
        ) : (
          <span className="text-sm uppercase tracking-widest" style={{ color: COLORS.inkDim }}>Loading board…</span>
        )}
      </div>
    );
  }

  // ---------- LOGIN-RECOVERY LINK ----------
  // Takes priority over the normal login screen whenever a valid or
  // invalid token is present in the URL — someone arrived here from the
  // emailed link, not through the usual sign-in flow.
  if (loginTokenState) {
    return (
      <SetNewPinScreen
        state={loginTokenState}
        t={t}
        onDone={async (mechanic) => {
          localStorage.setItem('deviceMechanic', mechanic);
          addDeviceUser(mechanic);
          setCurrentMechanic(mechanic);
          // Same fresh-page-load risk as the PIN-setup flow — read their
          // real unit assignment directly rather than trusting local state
          // that may not have finished syncing yet. Retried once, since
          // falling back to that same local state on a single transient
          // failure would just reproduce the exact bug this is fixing.
          const readRealAssignment = async () => {
            const slug = slugForMechanic(mechanic);
            const [assignSnap, typesSnap] = await Promise.all([
              firebase.database().ref('unitAssignments/' + slug).once('value'),
              firebase.database().ref('unitTypes').once('value'),
            ]);
            return { realUnit: assignSnap.val() || '', realUnitTypes: typesSnap.val() || {} };
          };
          let landing;
          try {
            let result;
            try {
              result = await readRealAssignment();
            } catch (e) {
              await new Promise((r) => setTimeout(r, 1200));
              result = await readRealAssignment();
            }
            landing = MACHINE_TYPE_LABELS[machineType(result.realUnit, result.realUnitTypes)] ? 'shift' : 'dashboard';
          } catch (e) {
            landing = landingScreenFor(mechanic); // both attempts failed (genuinely offline) — fall back to local state
          }
          setScreen(landing);
          setLoginTokenState(null);
        }}
      />
    );
  }

  // ---------- LOGIN ----------
  if (screen === 'login' || !currentMechanic) {
    return (
      <div style={{ color: COLORS.ink, minHeight: '100vh', position: 'relative', overflow: 'hidden' }} className="font-body p-6 flex flex-col items-center justify-center">
        {FONT_STYLE}
        <svg
          viewBox="0 0 400 200"
          preserveAspectRatio="xMidYMax slice"
          style={{ position: 'absolute', bottom: 0, left: 0, width: '100%', height: '35vh', opacity: 0.12, pointerEvents: 'none' }}
        >
          <path d="M40 200 L40 140 L20 140 L45 90 L28 90 L55 40 L82 90 L65 90 L90 140 L70 140 L70 200 Z" fill={COLORS.accent} />
          <path d="M130 200 L130 120 L105 120 L135 60 L114 60 L148 0 L182 60 L161 60 L191 120 L166 120 L166 200 Z" fill={COLORS.accent} />
          <path d="M250 200 L250 130 L228 130 L255 75 L238 75 L265 25 L292 75 L275 75 L302 130 L280 130 L280 200 Z" fill={COLORS.accent} />
          <path d="M345 200 L345 145 L327 145 L350 100 L335 100 L358 55 L381 100 L366 100 L389 145 L371 145 L371 200 Z" fill={COLORS.accent} />
        </svg>
        <OfflineBanner isOnline={isOnline} />
        <PinModalOverlay
          pinModal={pinModal}
          pinInput={pinInput}
          setPinInput={setPinInput}
          pinError={pinError}
          onSubmit={submitPin}
          onCancel={cancelPinModal}
          onForgot={forgotPin}
          t={t}
        />
        <EmailPromptOverlay
          show={showEmailPrompt}
          onSave={async (email) => {
            await saveMechanicEmail(currentMechanic, email);
            setShowEmailPrompt(false);
          }}
          onSkip={() => setShowEmailPrompt(false)}
        />
        <PushPromptOverlay
          show={showPushPrompt}
          mechanic={currentMechanic}
          onEnable={async () => {
            await registerPushNotifications(currentMechanic);
            setShowPushPrompt(false);
          }}
          onSkip={() => setShowPushPrompt(false)}
        />
        <BiometricOfferOverlay
          mechanic={offerBiometric}
          onEnable={async () => {
            const name = offerBiometric;
            setOfferBiometric(null);
            try {
              await registerBiometric(name);
            } catch (e) {
              // ignore — user can enable it later from the board
            }
          }}
          onSkip={() => setOfferBiometric(null)}
        />
        <div className="max-w-md w-full" style={{ position: 'relative', zIndex: 1 }}>
          <div className="flex items-center justify-center gap-2 mb-4">
            {[
              { code: 'en', label: 'English' },
              { code: 'es', label: 'Español' },
              { code: 'pdt', label: 'Plautdietsch' },
            ].map((l) => (
              <button
                key={l.code}
                onClick={() => setLangPersist(l.code)}
                className="font-display text-xs uppercase tracking-wider font-semibold px-3 py-2 rounded-lg"
                style={{
                  color: lang === l.code ? '#1B1F19' : COLORS.ink,
                  background: lang === l.code ? COLORS.accent : COLORS.surface,
                  border: `2px solid ${COLORS.accent}`,
                }}
              >
                {l.label}
              </button>
            ))}
          </div>
          <div className="text-center mb-10">
            <h1 className="font-display text-4xl font-bold mb-2">Harder Contracting</h1>
            <p className="text-base" style={{ color: COLORS.inkDim }}>{t('pickYourName')}</p>
          </div>

          {mechanics.length > 0 && (() => {
            const rememberedName = localStorage.getItem('deviceMechanic');
            const rememberedStillExists = rememberedName && mechanics.includes(rememberedName);
            const revealAll = showAllMechanics || !rememberedStillExists;
            // Only people who've actually signed in on this exact device —
            // a shared shop tablet shouldn't show the entire company roster.
            // New people arrive via their own invite link, never through this
            // list. An existing employee on an unfamiliar device uses "Lost
            // access? Get a login link" below, not a way to browse everyone.
            const deviceUsers = getDeviceUsers().filter((m) => mechanics.includes(m));
            const namesToShow = deviceUsers.length > 0 ? deviceUsers : mechanics;
            return (
              <div className="mb-8">
                <p className="font-display text-xs uppercase tracking-wider mb-3 block" style={{ color: COLORS.inkDim }}>
                  {revealAll ? t('tapToSignIn') : t('welcomeBack')}
                </p>
                {revealAll ? (
                  <div className="grid grid-cols-2 gap-3">
                    {namesToShow.map((m) => (
                      <button
                        key={m}
                        onClick={() => handleMechanicTap(m)}
                        className="rounded-lg px-4 py-5 font-medium text-center focus:outline-none focus:ring-2 transition-all hover:scale-105 active:scale-95 relative"
                        style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}`, color: COLORS.ink }}
                      >
                        {m}
                        {!!localStorage.getItem('webauthn_cred_' + m) && (
                          <span className="absolute top-1.5 right-2 text-xs" title="Face ID / Touch ID available">🔓</span>
                        )}
                      </button>
                    ))}
                  </div>
                ) : (
                  <div>
                    <button
                      onClick={() => handleMechanicTap(rememberedName)}
                      className="w-full rounded-lg px-4 py-6 font-display font-bold text-xl text-center focus:outline-none focus:ring-2 transition-all hover:scale-105 active:scale-95 relative"
                      style={{ background: COLORS.surface, border: `2px solid ${COLORS.accent}`, color: COLORS.ink }}
                    >
                      {rememberedName}
                      {!!localStorage.getItem('webauthn_cred_' + rememberedName) && (
                        <span className="absolute top-2 right-3 text-sm" title="Face ID / Touch ID available">🔓</span>
                      )}
                    </button>
                    <button
                      onClick={() => setShowAllMechanics(true)}
                      className="w-full text-center text-xs underline mt-3"
                      style={{ color: COLORS.inkDim }}
                    >
                      {t('notYouSwitchUser')}
                    </button>
                  </div>
                )}
                <div className="h-px my-6" style={{ background: COLORS.line }} />
              </div>
            );
          })()}

          {inviteTokenState === 'invalid' && (
            <div className="rounded-lg p-5 shop-card" style={{ background: COLORS.surface, border: `2px dashed #E07A5F` }}>
              <p className="text-sm" style={{ color: '#E07A5F' }}>
                That invite link is invalid or has expired. Ask your admin to send you a fresh one.
              </p>
            </div>
          )}

          <div className="text-center mt-4">
            {!showLostAccess ? (
              <button
                onClick={() => setShowLostAccess(true)}
                className="text-xs underline"
                style={{ color: COLORS.inkDim }}
              >
                {t('lostAccess')} {t('getLoginLink')}
              </button>
            ) : lostAccessSubmitted ? (
              <p className="text-sm rounded-lg p-4" style={{ background: COLORS.surface, color: COLORS.inkDim, border: `1px solid ${COLORS.line}` }}>
                {t('lostAccessSubmitted')}
              </p>
            ) : (
              <div className="rounded-lg p-5 text-left" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
                <p className="font-display text-sm uppercase tracking-wide mb-2" style={{ color: COLORS.accent }}>{t('getLoginLink')}</p>
                <p className="text-xs mb-3" style={{ color: COLORS.inkDim }}>{t('lostAccessHelper')}</p>
                <input
                  type="email"
                  value={lostAccessEmail}
                  onChange={(e) => setLostAccessEmail(e.target.value)}
                  placeholder={t('lostAccessEmailPlaceholder')}
                  className="w-full rounded-lg px-4 py-2 text-base mb-3 focus:outline-none focus:ring-2"
                  style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                />
                <Btn onClick={requestLoginLink} disabled={lostAccessSubmitting || !lostAccessEmail.trim()}>
                  {lostAccessSubmitting ? '…' : t('sendLink')}
                </Btn>
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  // ---------- DASHBOARD ----------
  if (screen === 'dashboard') {
    const q = searchQuery.trim().toLowerCase();
    const searchResults = q
      ? orders.filter((o) => {
          const haystack = [
            getLocalizedText(o.description, lang),
            o.unit,
            ...getAssignedMechanics(o),
            o.status,
            ...(o.notes || []).map((n) => n.text),
          ]
            .filter(Boolean)
            .join(' ')
            .toLowerCase();
          return haystack.includes(q);
        })
      : [];
    const openOrders = orders
      .filter((o) => o.status !== 'Done')
      .slice()
      .sort((a, b) => {
        if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
        if (a.dueDate) return -1;
        if (b.dueDate) return 1;
        return 0;
      });

    // Only orders someone has actually pulled onto the board show here —
    // everything else stays tucked away in the dropdown until picked, so
    // the board doesn't get cluttered with every open job at once.
    const visibleOpenOrders = openOrders.filter(isOnBoard);
    const queuedOrders = openOrders.filter((o) => !isOnBoard(o));

    // Queued orders, grouped by unit for the "pull onto board" dropdown —
    // sorted numerically so "C10" comes after "C2", not before it.
    const queuedByUnit = {};
    queuedOrders.forEach((o) => {
      const key = o.unit || 'No unit';
      if (!queuedByUnit[key]) queuedByUnit[key] = [];
      queuedByUnit[key].push(o);
    });
    const queuedUnitGroups = Object.keys(queuedByUnit).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

    const renderOrderCard = (o) => {
      const isDone = o.status === 'Done';
      return (
        <div
          key={o.id}
          onClick={() => { setActiveUnit(o.unit); setActiveOrderId(o.id); setScreen('order'); setConfirmDelete(false); }}
          role="button"
          tabIndex={0}
          style={{ background: isDone ? COLORS.line : COLORS.manila, color: isDone ? COLORS.inkDim : COLORS.ink2 }}
          className="relative rounded-lg p-5 pl-8 text-left w-full focus:outline-none focus:ring-2 transition-all hover:scale-102 active:scale-98 cursor-pointer"
        >
          <PunchHole bg={isDone ? COLORS.line : COLORS.manila} />
          <div className="flex items-start justify-between gap-3">
            <div className="flex-1 min-w-0">
              <p className="font-mono text-xs mb-1 font-semibold" style={{ color: isDone ? COLORS.line : '#5B5342' }}>{o.unit}</p>
              <p className="font-body font-semibold text-base leading-snug mb-2">{getLocalizedText(o.description, lang) || t('noDescription')}</p>
              <div className="flex flex-wrap items-center gap-4 font-mono text-xs" style={{ color: isDone ? COLORS.line : '#5B5342', opacity: isDone ? 0.6 : 1 }}>
                {getAssignedMechanics(o).length > 0 && <span>👤 {getAssignedMechanics(o).join(', ')}</span>}
                {o.dueDate && <span>📅 {fmtDate(o.dueDate)}</span>}
              </div>
            </div>
            <div className="flex flex-col items-end gap-2">
              <StatusStamp status={o.status} small t={t} />
              {!isDone && (
                <button
                  type="button"
                  onClick={(e) => { e.stopPropagation(); pullOffBoard(o.id); }}
                  title="Take off the board — waiting on parts, etc."
                  className="text-xs px-2 py-1 rounded-full focus:outline-none"
                  style={{ color: '#8A7F5E', background: 'rgba(0,0,0,0.08)' }}
                >
                  ✕
                </button>
              )}
            </div>
          </div>
        </div>
      );
    };

    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <FireworksOverlay show={showFireworks} />
        <OfflineBanner isOnline={isOnline} />
        <PinModalOverlay
          pinModal={pinModal}
          pinInput={pinInput}
          setPinInput={setPinInput}
          pinError={pinError}
          onSubmit={submitPin}
          onCancel={cancelPinModal}
          onForgot={forgotPin}
          t={t}
        />
        <EmailPromptOverlay
          show={showEmailPrompt}
          onSave={async (email) => {
            await saveMechanicEmail(currentMechanic, email);
            setShowEmailPrompt(false);
          }}
          onSkip={() => setShowEmailPrompt(false)}
        />
        <PushPromptOverlay
          show={showPushPrompt}
          mechanic={currentMechanic}
          onEnable={async () => {
            await registerPushNotifications(currentMechanic);
            setShowPushPrompt(false);
          }}
          onSkip={() => setShowPushPrompt(false)}
        />
        <BiometricOfferOverlay
          mechanic={offerBiometric}
          onEnable={async () => {
            const name = offerBiometric;
            setOfferBiometric(null);
            try {
              await registerBiometric(name);
            } catch (e) {
              // ignore — user can enable it later from the board
            }
          }}
          onSkip={() => setOfferBiometric(null)}
        />
        <ClockInPromptOverlay
          show={showClockInPrompt}
          mechanic={currentMechanic}
          onClockIn={async () => {
            setShowClockInPrompt(false);
            await clockIn();
          }}
          onSkip={() => setShowClockInPrompt(false)}
          t={t}
        />
        <MilestonePromptOverlay
          prompt={milestonePrompt}
          onSubmit={(text) => resolveMilestonePrompt(text)}
          onSkip={() => resolveMilestonePrompt('')}
        />
        <div className="max-w-5xl mx-auto">
          <div className="flex items-start justify-between mb-10">
            <div>
              <p className="font-display text-xs uppercase mb-2" style={{ color: COLORS.accent, letterSpacing: '0.3em' }}>Harder Contracting</p>
              <h1 className="font-display text-3xl sm:text-4xl font-bold">{t('board')}</h1>
            </div>
            <button
              onClick={() => setShowSidebar(true)}
              className="text-3xl leading-none px-3 py-2 rounded-lg transition-all hover:scale-105"
              style={{ color: COLORS.accent, background: COLORS.surface, border: `1px solid ${COLORS.line}` }}
            >
              ☰
            </button>
          </div>

          <SidebarMenu
            show={showSidebar}
            onClose={() => setShowSidebar(false)}
            mechanic={currentMechanic}
            isAdmin={isAdmin}
            isForeman={isForeman}
            isProduction={jobTypeFor(currentMechanic) === 'production'}
            onNavigate={(s) => setScreen(s)}
            onCheckUpdates={async () => {
              try {
                const regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map((r) => r.unregister()));
                const keys = await caches.keys();
                await Promise.all(keys.map((k) => caches.delete(k)));
              } catch (e) {
                // ignore — reload will still fetch fresh from network
              }
              window.location.reload(true);
            }}
            onLogout={async () => {
              const keepSession = !!localStorage.getItem('webauthn_cred_' + currentMechanic);
              if (!keepSession && !navigator.onLine) {
                const proceed = confirm("You're offline right now. Logging out means you won't be able to sign back in until you have signal again. Log out anyway?");
                if (!proceed) return;
              }
              if (!keepSession) { await firebase.auth().signOut().catch(() => {}); }
              setCurrentMechanic(null);
              setScreen('login');
              setShowClockInPrompt(false);
            }}
            t={t}
          />

          {(() => {
            const bannerJobType = jobTypeFor(currentMechanic);
            const isOpen = bannerJobType === 'mechanic' ? !!openEntry : !!openProductionShift;
            return (
              <button
                onClick={() => setScreen('shift')}
                className="w-full flex items-center justify-between rounded-2xl px-6 py-6 mb-8 transition-all hover:scale-102 active:scale-98 focus:outline-none focus:ring-2 shop-card"
                style={{
                  background: isOpen ? COLORS.accent : COLORS.surface,
                  border: `3px solid ${isOpen ? COLORS.accent : COLORS.line}`,
                }}
              >
                {bannerJobType === 'mechanic' ? (
                  <React.Fragment>
                    <div className="flex items-center gap-4">
                      <span style={{ fontSize: '2.5rem' }}>⏱️</span>
                      <div className="text-left">
                        <p className="font-display text-xl font-bold" style={{ color: openEntry ? '#1B1F19' : COLORS.ink }}>
                          {openEntry ? t('clockedIn') : t('timeClock')}
                        </p>
                        <p className="text-sm" style={{ color: openEntry ? '#1B1F19' : COLORS.inkDim, opacity: openEntry ? 0.75 : 1 }}>
                          {openEntry ? `${t('clockedInSince')} ${fmtTime(openEntry.clockIn)} — ${t('sinceTapToLog')}` : t('tapToClockIn')}
                        </p>
                      </div>
                    </div>
                    <span style={{ fontSize: '2rem', color: openEntry ? '#1B1F19' : COLORS.inkDim }}>→</span>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <div className="flex items-center gap-4">
                      <span style={{ fontSize: '2.5rem' }}>⏱️</span>
                      <div className="text-left">
                        <p className="font-display text-xl font-bold" style={{ color: openProductionShift ? '#1B1F19' : COLORS.ink }}>
                          {openProductionShift ? 'On shift' : 'Shift'}
                        </p>
                        <p className="text-sm" style={{ color: openProductionShift ? '#1B1F19' : COLORS.inkDim, opacity: openProductionShift ? 0.75 : 1 }}>
                          {openProductionShift ? `${openProductionShift.machine} — since ${fmtTime(openProductionShift.start)}` : 'Tap to clock in for the day'}
                        </p>
                      </div>
                    </div>
                    <span style={{ fontSize: '2rem', color: openProductionShift ? '#1B1F19' : COLORS.inkDim }}>→</span>
                  </React.Fragment>
                )}
              </button>
            );
          })()}

          <div className="relative mb-8">
            <input
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              placeholder={t('searchPlaceholder')}
              className="w-full rounded-xl px-5 py-4 text-base focus:outline-none focus:ring-2"
              style={{ background: COLORS.surface, color: COLORS.ink, border: `2px solid ${COLORS.line}` }}
            />
            {searchQuery && (
              <button
                onClick={() => setSearchQuery('')}
                className="absolute right-4 top-1/2 -translate-y-1/2 text-lg"
                style={{ color: COLORS.inkDim }}
              >
                ✕
              </button>
            )}
          </div>

          {q ? (
            <div>
              <h2 className="font-display text-lg font-semibold uppercase tracking-wide mb-5">
                {searchResults.length} result{searchResults.length !== 1 ? 's' : ''} for "{searchQuery}"
              </h2>
