              <button onClick={() => setTsWeekOffset(tsWeekOffset - 1)} className="text-lg px-2" style={{ color: COLORS.inkDim }}>←</button>
              <div className="text-center">
                <p className="font-display font-bold">{fmtWeekRange(viewedWeekStart)}</p>
                {weekApproved && (
                  <p className="text-xs font-semibold mt-1" style={{ color: COLORS.done }}>
                    ✓ Approved by {timesheetApprovals[viewedWeekStart].approvedBy}
                  </p>
                )}
              </div>
              <button
                onClick={() => setTsWeekOffset(Math.min(0, tsWeekOffset + 1))}
                disabled={tsWeekOffset >= 0}
                className="text-lg px-2"
                style={{ color: COLORS.inkDim, opacity: tsWeekOffset >= 0 ? 0.3 : 1 }}
              >
                →
              </button>
            </div>

            {Object.keys(weekTotalsByMechanic).length === 0 ? (
              <p className="text-sm text-center mb-4" style={{ color: COLORS.line }}>No shifts this week.</p>
            ) : (
              <div className="space-y-2 mb-4">
                {Object.entries(weekTotalsByMechanic).map(([name, hours]) => (
                  <div key={name} className="flex items-center justify-between py-1">
                    <span className="font-display font-semibold">{name}</span>
                    <span className="font-mono flex items-center gap-2">
                      {hours > 40 && <span title="Over 40 hours">⚠️</span>}
                      <span style={{ color: hours > 40 ? '#E3A23C' : COLORS.ink }}>{fmtHours(hours)}</span>
                    </span>
                  </div>
                ))}
              </div>
            )}

            {weekApproved ? (
              <Btn variant="ghost" onClick={() => unapproveWeek(viewedWeekStart)}>Un-approve this week</Btn>
            ) : (
              <div className="flex gap-2 flex-wrap">
                <Btn onClick={() => approveWeek(viewedWeekStart)} disabled={Object.keys(weekTotalsByMechanic).length === 0}>
                  Approve this week
                </Btn>
                <Btn variant="ghost" onClick={() => setShowWeekTable((s) => !s)} disabled={weekEntries.length === 0}>
                  {showWeekTable ? '✕ Hide table' : '👁️ View here'}
                </Btn>
                <Btn variant="ghost" onClick={() => exportTimesheets(weekEntries, 'week-review')} disabled={weekEntries.length === 0}>
                  📊 Open as spreadsheet
                </Btn>
              </div>
            )}
            {showWeekTable && <WeekReviewTable entries={weekEntries} />}
            <p className="text-xs mt-3" style={{ color: COLORS.line }}>
              Approving a week locks it — mechanics can no longer edit shifts within it themselves.
            </p>
          </div>

          {/* Email settings */}
          <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
            <h2 className="font-display text-sm font-bold uppercase tracking-wide mb-4">Automatic reports</h2>

            <EmailListEditor
              label="Weekly timesheet — sends every Monday"
              helper="Anyone who should get the weekly timesheet CSV (comma-separated for more than one)"
              value={(timesheetSettings.weeklyEmails || []).join(', ')}
              onSave={(list) => saveTimesheetSettings({ ...timesheetSettings, weeklyEmails: list })}
            />

            <EmailListEditor
              label="Weekly backup — sends every Monday"
              helper="Anyone who should get the full app backup file (usually just you)"
              value={(timesheetSettings.backupEmails || []).join(', ')}
              onSave={(list) => saveTimesheetSettings({ ...timesheetSettings, backupEmails: list })}
            />

            <EmailListEditor
              label="Monthly hours summary — sends the 1st of each month"
              helper="One email for whoever handles payroll/books — a simple total-hours-per-person report for last month"
              value={(timesheetSettings.monthlyEmail || '')}
              single
              onSave={(list) => saveTimesheetSettings({ ...timesheetSettings, monthlyEmail: list[0] || '' })}
            />

            <label className="flex items-center justify-between gap-3 cursor-pointer mt-2">
              <div>
                <span className="text-sm font-semibold block" style={{ color: COLORS.ink }}>Weekly emails turned on</span>
                <span className="text-xs" style={{ color: COLORS.line }}>Turn off to pause the weekly timesheet and backup emails without deleting the addresses above. The monthly summary isn't affected by this.</span>
              </div>
              <input
                type="checkbox"
                checked={!!timesheetSettings.autoEmail}
                onChange={(e) => saveTimesheetSettings({ ...timesheetSettings, autoEmail: e.target.checked })}
                className="w-5 h-5 flex-shrink-0"
                style={{ accentColor: COLORS.accent }}
              />
            </label>
          </div>

          {/* Add a missed day (any employee) */}
          {showAddMissedDayAdmin ? (
            <AddMissedDayForm
              t={t}
              mechanics={mechanics}
              onSubmit={async (mechanicName, date, ci, co, ls, le, setError) => {
                await addManualEntry(mechanicName, date, ci, co, ls, le);
                setShowAddMissedDayAdmin(false);
              }}
              onCancel={() => setShowAddMissedDayAdmin(false)}
            />
          ) : (
            <button
              onClick={() => setShowAddMissedDayAdmin(true)}
              className="w-full text-center text-sm font-display uppercase tracking-wide mb-6 py-3 rounded-lg"
              style={{ color: COLORS.accent, background: COLORS.surface, border: `2px dashed ${COLORS.accent}` }}
            >
              + Add a missed day for someone
            </button>
          )}

          {/* Filters */}
          <div className="rounded-lg p-5 mb-6" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
            <select
              value={tsFilterMechanic}
              onChange={(e) => setTsFilterMechanic(e.target.value)}
              className="w-full rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2"
              style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
            >
              <option value="">Everyone</option>
              {mechanics.map((m) => <option key={m} value={m}>{m}</option>)}
            </select>
            {tsFilterMechanic && (
              <div className="grid grid-cols-2 gap-3 mt-3">
                <label className="block">
                  <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>From</span>
                  <input
                    type="date"
                    value={tsFilterStart}
                    onChange={(e) => setTsFilterStart(e.target.value)}
                    className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                    style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                  />
                </label>
                <label className="block">
                  <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>To</span>
                  <input
                    type="date"
                    value={tsFilterEnd}
                    onChange={(e) => setTsFilterEnd(e.target.value)}
                    className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                    style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                  />
                </label>
              </div>
            )}
          </div>

          <div className="flex items-center justify-between mb-4">
            <h2 className="font-display text-lg font-semibold uppercase tracking-wide">Totals</h2>
            <Btn variant="ghost" onClick={() => exportTimesheets(filtered)}>📤 Export & Share</Btn>
          </div>

          {Object.keys(totalsByMechanic).length === 0 ? (
            <p className="text-sm mb-8" style={{ color: COLORS.line }}>No shifts in this range.</p>
          ) : (
            <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
              {Object.entries(totalsByMechanic).map(([name, hours]) => (
                <div key={name} className="flex items-center justify-between py-2" style={{ borderBottom: `1px solid ${COLORS.line}` }}>
                  <span className="font-display font-semibold">{name}</span>
                  <span className="font-mono">{fmtHours(hours)}</span>
                </div>
              ))}
            </div>
          )}

          {tsFilterMechanic && (
          <React.Fragment>
          <h2 className="font-display text-lg font-semibold uppercase tracking-wide mb-4">All shifts</h2>
          <p className="text-xs mb-4" style={{ color: COLORS.line }}>As an admin, you can edit or delete anyone's shift here — including in approved weeks.</p>
          {filtered.length === 0 ? (
            <p className="text-sm" style={{ color: COLORS.line }}>Nothing to show yet.</p>
          ) : (
            <div className="space-y-6">
              {mechanicGroups.map((name) => (
                <div key={name}>
                  <p
                    className="font-display text-xs uppercase tracking-wide mb-2 pb-2 flex items-center justify-between"
                    style={{ color: COLORS.accent, borderBottom: `1px solid ${COLORS.line}` }}
                  >
                    <span>{name}</span>
                    <span>{fmtHours(totalsByMechanic[name] || 0)} total</span>
                  </p>
                  <div className="space-y-3">
                    {groupedByMechanic[name].map((entry) => (
                      <TimesheetEntryCard
                        key={entry.id}
                        entry={entry}
                        locked={false}
                        canEdit={true}
                        isEditing={editingEntryId === entry.id}
                        onEdit={() => setEditingEntryId(entry.id)}
                        onCancelEdit={() => setEditingEntryId(null)}
                        onSave={async (patch) => {
                          await updateTimesheetEntry(entry.id, patch);
                          setEditingEntryId(null);
                        }}
                        onDelete={() => deleteTimesheetEntry(entry.id)}
                        onAddJob={addTimesheetJob}
                        onRemoveJob={removeTimesheetJob}
                      />
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
          </React.Fragment>
          )}
        </div>
      </div>
    );
  }

  // ---------- TEAM (admin only) ----------
  if (screen === 'team') {
    if (!isAdmin) {
      return (
        <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8 flex items-center justify-center">
          {FONT_STYLE}
          <div className="text-center">
            <p className="font-display text-lg font-bold mb-4">Admins only</p>
            <Btn onClick={() => setScreen('dashboard')}>Back to board</Btn>
          </div>
        </div>
      );
    }
    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <OfflineBanner isOnline={isOnline} />
        <div className="max-w-2xl mx-auto">
          <button onClick={() => setScreen('dashboard')} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>
          <h1 className="font-display text-3xl font-bold mb-2">{t('team')}</h1>
          <p className="text-sm mb-4" style={{ color: COLORS.inkDim }}>
            Manage who can sign in, and who has admin access like you.
          </p>

          <button
            onClick={() => setScreen('pdtTranslations')}
            className="font-display text-xs uppercase tracking-wider font-semibold px-3 py-2 rounded-lg mb-6"
            style={{ color: COLORS.accent, background: COLORS.surface, border: `1px solid ${COLORS.line}` }}
          >
            🌐 Plautdietsch Translations
          </button>

          {mechanics.length > 1 && (
            <div className="mb-8">
              {showRemoveAllConfirm ? (
                <div className="rounded-lg p-4" style={{ background: COLORS.surface, border: `2px solid #E07A5F` }}>
                  <p className="text-sm mb-3" style={{ color: COLORS.inkDim }}>
                    Remove everyone except {currentMechanic}? Their past work orders and timesheets stay on
                    record — this just removes their sign-in access.
                  </p>
                  <div className="flex gap-2">
                    <Btn variant="danger" onClick={removeAllExceptSelf}>Yes, remove everyone else</Btn>
                    <Btn variant="ghost" onClick={() => setShowRemoveAllConfirm(false)}>Cancel</Btn>
                  </div>
                </div>
              ) : (
                <button
                  onClick={() => setShowRemoveAllConfirm(true)}
                  className="text-xs font-display uppercase tracking-wider underline"
                  style={{ color: '#E07A5F' }}
                >
                  Remove everyone except me
                </button>
              )}
            </div>
          )}

          <div className="space-y-3">
            {mechanics.map((m) => {
              const isSelf = m === currentMechanic;
              const mIsAdmin = admins.includes(m);
              return (
                <div key={m} className="rounded-lg p-4" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
                  <div className="flex items-center justify-between gap-3 mb-3">
                    <div className="flex items-center gap-2">
                      <p className="font-display font-bold text-lg">{m}</p>
                      {mIsAdmin && (
                        <span
                          className="text-xs font-display font-bold uppercase tracking-wide px-2 py-0.5 rounded-full"
                          style={{ background: COLORS.accent, color: '#1B1F19' }}
                        >
                          Admin
                        </span>
                      )}
                      {isSelf && <span className="text-xs" style={{ color: COLORS.inkDim }}>(you)</span>}
                    </div>
                  </div>

                  {showRemoveConfirm === m ? (
                    <div className="flex flex-wrap items-center gap-2">
                      <span className="text-sm" style={{ color: COLORS.inkDim }}>Remove {m}? Their past work orders stay on record.</span>
                      <Btn variant="danger" onClick={() => removeMechanic(m)}>Yes, remove</Btn>
                      <Btn variant="ghost" onClick={() => setShowRemoveConfirm(null)}>Cancel</Btn>
                    </div>
                  ) : (
                    <div className="flex gap-2">
                      {!isSelf && (
                        <button
                          onClick={() => toggleAdmin(m)}
                          className="text-xs font-display uppercase tracking-wider font-semibold px-3 py-2 rounded-lg"
                          style={{ color: COLORS.inkDim, background: COLORS.surfaceRaised, border: `1px solid ${COLORS.line}` }}
                        >
                          {mIsAdmin ? 'Remove admin' : 'Make admin'}
                        </button>
                      )}
                      {!isSelf && (
                        <button
                          onClick={() => setShowRemoveConfirm(m)}
                          className="text-xs font-display uppercase tracking-wider font-semibold px-3 py-2 rounded-lg"
                          style={{ color: '#E07A5F', background: COLORS.surfaceRaised, border: `1px solid ${COLORS.line}` }}
                        >
                          Remove from team
                        </button>
                      )}
                      {authMigrated[m] && (
                        <button
                          onClick={() => clearAuthMigration(m)}
                          className="text-xs font-display uppercase tracking-wider font-semibold px-3 py-2 rounded-lg"
                          style={{ color: COLORS.accent, background: COLORS.surfaceRaised, border: `1px solid ${COLORS.line}` }}
                          title="Only works after you've also deleted their account in Firebase Console → Authentication"
                        >
                          Reset login
                        </button>
                      )}
                      {isSelf && (
                        <span className="text-xs" style={{ color: COLORS.line }}>Ask another admin to change your access</span>
                      )}
                    </div>
                  )}
                  <div className="mt-3 pt-3" style={{ borderTop: `1px solid ${COLORS.line}` }}>
                    <button
                      onClick={() => setEditingScheduleFor(editingScheduleFor === m ? null : m)}
                      className="text-xs font-display uppercase tracking-wider underline"
                      style={{ color: COLORS.inkDim }}
                    >
                      ⏰ Shift hours: {(mechanicSchedules[slugForMechanic(m)] || { start: '07:50', end: '17:50' }).start} – {(mechanicSchedules[slugForMechanic(m)] || { start: '07:50', end: '17:50' }).end}
                      {!mechanicSchedules[slugForMechanic(m)] && ' (default)'}
                    </button>
                    {editingScheduleFor === m && (
                      <MechanicScheduleEditor
                        mechanic={m}
                        schedule={mechanicSchedules[slugForMechanic(m)]}
                        onSave={async (start, end) => {
                          await saveMechanicSchedule(m, start, end);
                          setEditingScheduleFor(null);
                        }}
                        onResetDefault={async () => {
                          await clearMechanicSchedule(m);
                          setEditingScheduleFor(null);
                        }}
                        onCancel={() => setEditingScheduleFor(null)}
                      />
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  // ---------- TEAM SHOUTOUTS ----------
  if (screen === 'shoutouts') {
    const allShoutouts = [];
    orders.forEach((o) => {
      (o.notes || []).forEach((n) => {
        if (n.type === 'shoutout') {
          allShoutouts.push({ ...n, orderId: o.id, orderUnit: o.unit, orderDescription: getLocalizedText(o.description, lang) });
        }
      });
    });
    allShoutouts.sort((a, b) => new Date(b.ts) - new Date(a.ts));

    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <OfflineBanner isOnline={isOnline} />
        <div className="max-w-2xl mx-auto">
          <button onClick={() => setScreen('dashboard')} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>
          <h1 className="font-display text-3xl font-bold mb-2">🎉 Team Shoutouts</h1>
          <p className="text-sm mb-8" style={{ color: COLORS.inkDim }}>
            Give credit where it's due — tap into any work order and check "Make this a shoutout" on a note.
          </p>

          {allShoutouts.length === 0 ? (
            <div className="rounded-lg p-10 text-center" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>
              <p className="text-base mb-2" style={{ color: COLORS.inkDim }}>No shoutouts yet</p>
              <p className="text-sm" style={{ color: COLORS.line }}>Be the first to give someone credit for a job well done.</p>
            </div>
          ) : (
            <div className="space-y-3">
              {allShoutouts.map((s) => (
                <button
                  key={s.id}
                  onClick={() => {
                    const order = orders.find((o) => o.id === s.orderId);
                    if (order) {
                      setActiveUnit(order.unit);
                      setActiveOrderId(order.id);
                      setScreen('order');
                    }
                  }}
                  className="w-full text-left rounded-lg p-4 transition-all hover:scale-102"
                  style={{ background: 'rgba(127,163,126,0.14)', border: `1px solid ${COLORS.accent}` }}
                >
                  <div className="flex items-center justify-between mb-2">
                    <span className="font-display font-semibold text-sm" style={{ color: COLORS.accent }}>🎉 {s.author}</span>
                    <span className="font-mono text-xs" style={{ color: COLORS.line }}>{new Date(s.ts).toLocaleDateString()}</span>
                  </div>
                  <p className="text-base mb-2">{s.text}</p>
                  <p className="text-xs font-mono" style={{ color: COLORS.inkDim }}>
                    {s.orderUnit} — {s.orderDescription || t('workOrder')}
                  </p>
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ---------- CHECKLIST TEMPLATES ----------
  if (screen === 'settings') {
    const slug = slugForMechanic(currentMechanic);
    const tokenInfo = pushTokens[slug];
    const pushEnabled = tokenInfo ? tokenInfo.enabled !== false : true;
    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <div className="max-w-lg mx-auto">
          <button onClick={() => setScreen('dashboard')} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>
          <h1 className="font-display text-3xl font-bold mb-8">Settings</h1>

          <div className="rounded-lg p-5" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
            <label className="flex items-center justify-between gap-3 cursor-pointer">
              <div>
                <span className="text-sm font-semibold block" style={{ color: COLORS.ink }}>🔔 Shift reminders</span>
                <span className="text-xs" style={{ color: COLORS.inkDim }}>
                  A push notification 5 minutes before your shift starts and ends.
                </span>
              </div>
              <input
                type="checkbox"
                checked={pushEnabled}
                onChange={async (e) => {
                  if (e.target.checked) {
                    localStorage.setItem('pushAsked_' + currentMechanic, '1');
                    const ok = await registerPushNotifications(currentMechanic);
                    if (!ok) alert("Couldn't enable notifications — check that this phone allows notifications for this app in its system settings, then try again.");
                  } else {
                    await setPushEnabled(currentMechanic, false);
                  }
                }}
                className="w-5 h-5 flex-shrink-0"
                style={{ accentColor: COLORS.accent }}
              />
            </label>
          </div>
        </div>
      </div>
    );
  }

  if (screen === 'pdtTranslations') {
    if (!isAdmin) {
      return (
        <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8 flex items-center justify-center">
          <div className="text-center">
            <p className="text-lg mb-4">Admins only.</p>
            <button onClick={() => setScreen('dashboard')} className="font-display text-sm underline" style={{ color: COLORS.accent }}>{t('backToBoard')}</button>
          </div>
        </div>
      );
    }
    return (
      <PdtTranslationsScreen
        customPdtStrings={customPdtStrings}
        customPdtJokes={customPdtJokes}
        onSaveStrings={persistCustomPdtStrings}
        onSaveJokes={persistCustomPdtJokes}
        onBack={() => setScreen('dashboard')}
        t={t}
      />
    );
  }

  if (screen === 'checklists') {
    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <FireworksOverlay show={showFireworks} />
        <OfflineBanner isOnline={isOnline} />
        <PinModalOverlay
          pinModal={pinModal}
          pinInput={pinInput}
          setPinInput={setPinInput}
          pinError={pinError}
          onSubmit={submitPin}
          onCancel={cancelPinModal}
          onForgot={forgotPin}
          t={t}
        />
        <EmailPromptOverlay
          show={showEmailPrompt}
          onSave={async (email) => {
            await saveMechanicEmail(currentMechanic, email);
            setShowEmailPrompt(false);
          }}
          onSkip={() => setShowEmailPrompt(false)}
        />
        <PushPromptOverlay
          show={showPushPrompt}
          mechanic={currentMechanic}
          onEnable={async () => {
            await registerPushNotifications(currentMechanic);
            setShowPushPrompt(false);
          }}
          onSkip={() => setShowPushPrompt(false)}
        />
        <BiometricOfferOverlay
          mechanic={offerBiometric}
          onEnable={async () => {
            const name = offerBiometric;
            setOfferBiometric(null);
            try {
              await registerBiometric(name);
            } catch (e) {
              // ignore — user can enable it later from the board
            }
          }}
          onSkip={() => setOfferBiometric(null)}
        />
        <div className="max-w-3xl mx-auto">
          <button onClick={() => setScreen('dashboard')} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>
          <div className="flex items-center justify-between mb-8">
            <h1 className="font-display text-3xl font-bold">{t('checklists')}</h1>
            <Btn onClick={() => setShowNewTemplate((s) => !s)}>{t('newChecklist')}</Btn>
          </div>

          {showNewTemplate && (
            <NewTemplateForm onCancel={() => setShowNewTemplate(false)} onSubmit={addTemplate} t={t} />
          )}

          {templates.length === 0 ? (
            <div className="rounded-lg p-10 text-center" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>
              <p className="text-base mb-2" style={{ color: COLORS.inkDim }}>{t('noCustomChecklistsYet')}</p>
              <p className="text-sm" style={{ color: COLORS.line }}>{t('tapNewChecklistHelper')}</p>
            </div>
          ) : (
            <div className="space-y-4">
              {templates.map((tpl) => {
                const isDefault = ['buncher-b4', 'excavator-ex1', 'crawler', 'processor', 'skidder'].includes(tpl.id);
                if (editingTemplateId === tpl.id) {
                  return (
                    <NewTemplateForm
                      key={tpl.id}
                      isEdit
                      initialName={tpl.name}
                      initialItemsText={tpl.items.join('\n')}
                      onCancel={() => setEditingTemplateId(null)}
                      onSubmit={(name, itemsText) => updateTemplate(tpl.id, name, itemsText)}
                      t={t}
                    />
                  );
                }
                return (
                  <div key={tpl.id} className="rounded-lg p-5" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
                    <div className="flex items-start justify-between gap-3 mb-3">
                      <div className="flex-1">
                        <p className="font-display font-bold text-lg">{getLocalizedName(tpl.name, tpl.nameOrigLang, tpl.nameTranslations, lang)}</p>
                        <p className="text-sm" style={{ color: COLORS.line }}>{tpl.items.length} {t('steps')}</p>
                      </div>
                      <div className="flex gap-3">
                        <button
                          onClick={() => setEditingTemplateId(tpl.id)}
                          className="text-xs font-display uppercase tracking-wider hover:opacity-70"
                          style={{ color: COLORS.accent }}
                        >
                          {t('edit')}
                        </button>
                        <button
                          onClick={() => setPdtEditingTemplateId(pdtEditingTemplateId === tpl.id ? null : tpl.id)}
                          className="text-xs font-display uppercase tracking-wider hover:opacity-70"
                          style={{ color: COLORS.inkDim }}
                        >
                          🌐
                        </button>
                        {!isDefault && (
                          <button 
                            onClick={() => setConfirmDeleteTemplate(confirmDeleteTemplate === tpl.id ? null : tpl.id)} 
                            className="text-xs font-display uppercase tracking-wider hover:opacity-70"
                            style={{ color: '#D6604A' }}
                          >
                            {confirmDeleteTemplate === tpl.id ? t('closeX') : t('delete')}
                          </button>
                        )}
                      </div>
                    </div>
                    {pdtEditingTemplateId === tpl.id && (
                      <PdtChecklistForm
                        name={tpl.name}
                        items={tpl.items}
                        nameTranslations={tpl.nameTranslations}
                        itemTranslations={tpl.itemTranslations}
                        onSave={async (namePdt, itemPdts) => {
                          await updateTemplatePdt(tpl.id, namePdt, itemPdts);
                          setPdtEditingTemplateId(null);
                        }}
                        onCancel={() => setPdtEditingTemplateId(null)}
                      />
                    )}
                    <p className="text-sm mb-3" style={{ color: COLORS.inkDim }}>
                      {tpl.items.slice(0, 3).map((it, idx) => getLocalizedChecklistText(it, tpl.nameOrigLang, tpl.itemTranslations, lang, idx)).join(' • ')}
                      {tpl.items.length > 3 ? ' • …' : ''}
                    </p>
                    {confirmDeleteTemplate === tpl.id && !isDefault && (
                      <div className="mt-3 pt-3 border-t" style={{ borderColor: COLORS.line }}>
                        <p className="text-sm mb-3" style={{ color: COLORS.inkDim }}>{t('areYouSureUndo')}</p>
                        <Btn variant="danger" onClick={() => deleteTemplate(tpl.id)}>{t('yesDeleteChecklist')}</Btn>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ---------- UNIT VIEW ----------
  if (screen === 'unit') {
    const unitOrders = orders.filter((o) => o.unit === activeUnit).sort((a, b) => (a.status === 'Done') - (b.status === 'Done'));
    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <FireworksOverlay show={showFireworks} />
        <OfflineBanner isOnline={isOnline} />
        <PinModalOverlay
          pinModal={pinModal}
          pinInput={pinInput}
          setPinInput={setPinInput}
          pinError={pinError}
          onSubmit={submitPin}
          onCancel={cancelPinModal}
          onForgot={forgotPin}
          t={t}
        />
        <EmailPromptOverlay
          show={showEmailPrompt}
          onSave={async (email) => {
            await saveMechanicEmail(currentMechanic, email);
            setShowEmailPrompt(false);
          }}
          onSkip={() => setShowEmailPrompt(false)}
        />
        <PushPromptOverlay
          show={showPushPrompt}
          mechanic={currentMechanic}
          onEnable={async () => {
            await registerPushNotifications(currentMechanic);
            setShowPushPrompt(false);
          }}
          onSkip={() => setShowPushPrompt(false)}
        />
        <BiometricOfferOverlay
          mechanic={offerBiometric}
          onEnable={async () => {
            const name = offerBiometric;
            setOfferBiometric(null);
            try {
              await registerBiometric(name);
            } catch (e) {
              // ignore — user can enable it later from the board
            }
          }}
          onSkip={() => setOfferBiometric(null)}
        />
        <div className="max-w-3xl mx-auto">
          <button onClick={() => setScreen('dashboard')} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>
          <div className="flex items-center justify-between mb-8">
            <h1 className="font-mono text-3xl font-bold">{activeUnit}</h1>
            <Btn onClick={() => setShowAddOrder((s) => !s)}>{t('newWorkOrder')}</Btn>
          </div>

          {showAddOrder && (
            <NewOrderForm
              mechanics={mechanics}
              units={units}
              lockUnit={activeUnit}
              onCancel={() => setShowAddOrder(false)}
              onSubmit={createOrder}
              t={t}
            />
          )}

          {unitOrders.length === 0 ? (
            <div className="rounded-lg p-10 text-center mt-6" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>
              <p className="text-base mb-2" style={{ color: COLORS.inkDim }}>{t('allCaughtUp')}</p>
              <p className="text-sm" style={{ color: COLORS.line }}>{t('noOrdersYetTapCreate')}</p>
            </div>
          ) : (
            <div className="mt-6 space-y-3">
              {unitOrders.map((o) => {
                const isDone = o.status === 'Done';
                return (
                  <button
                    key={o.id}
                    onClick={() => { setActiveOrderId(o.id); setScreen('order'); setConfirmDelete(false); }}
                    style={{ background: isDone ? COLORS.line : COLORS.manila, color: isDone ? COLORS.inkDim : COLORS.ink2 }}
                    className="relative rounded-lg p-5 pl-8 text-left w-full focus:outline-none focus:ring-2 transition-all hover:scale-102 active:scale-98"
                  >
                    <PunchHole bg={isDone ? COLORS.line : COLORS.manila} />
                    <div className="flex items-start justify-between gap-3">
                      <div className="flex-1 min-w-0">
                        <p className="font-body font-semibold text-base leading-snug mb-2">{getLocalizedText(o.description, lang) || t('noDescription')}</p>
                        <div className="flex flex-wrap items-center gap-4 font-mono text-xs" style={{ color: isDone ? COLORS.line : '#5B5342', opacity: isDone ? 0.6 : 1 }}>
                          {getAssignedMechanics(o).length > 0 && <span>👤 {getAssignedMechanics(o).join(', ')}</span>}
                          {o.hours && o.hours !== '' && <span>⏱️ {o.hours}h</span>}
                          {o.dueDate && <span>📅 {fmtDate(o.dueDate)}</span>}
                        </div>
                        {o.checklist && (
                          <div className="mt-2 text-xs font-semibold" style={{ color: isDone ? COLORS.line : COLORS.accent }}>
                            ✓ {o.checklist.items.filter((i) => i.checked).length}/{o.checklist.items.length} checklist items done
                          </div>
                        )}
                      </div>
                      <StatusStamp status={o.status} small t={t} />
                    </div>
                  </button>
                );
              })}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ---------- ORDER DETAIL ----------
  if (screen === 'order') {
    const order = orders.find((o) => o.id === activeOrderId);
    if (!order) {
      setScreen('unit');
      return null;
    }
    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <FireworksOverlay show={showFireworks} />
        <OfflineBanner isOnline={isOnline} />
        <PinModalOverlay
          pinModal={pinModal}
          pinInput={pinInput}
          setPinInput={setPinInput}
          pinError={pinError}
          onSubmit={submitPin}
          onCancel={cancelPinModal}
          onForgot={forgotPin}
          t={t}
        />
        <EmailPromptOverlay
          show={showEmailPrompt}
          onSave={async (email) => {
            await saveMechanicEmail(currentMechanic, email);
            setShowEmailPrompt(false);
          }}
          onSkip={() => setShowEmailPrompt(false)}
        />
        <PushPromptOverlay
          show={showPushPrompt}
          mechanic={currentMechanic}
          onEnable={async () => {
            await registerPushNotifications(currentMechanic);
            setShowPushPrompt(false);
          }}
          onSkip={() => setShowPushPrompt(false)}
        />
        <BiometricOfferOverlay
          mechanic={offerBiometric}
          onEnable={async () => {
            const name = offerBiometric;
            setOfferBiometric(null);
            try {
              await registerBiometric(name);
            } catch (e) {
              // ignore — user can enable it later from the board
            }
          }}
          onSkip={() => setOfferBiometric(null)}
        />
        <div className="max-w-2xl mx-auto">
          <div className="flex items-center justify-between mb-6 no-print">
            <button onClick={() => setScreen('unit')} className="font-display text-xs uppercase tracking-wider focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
              {t('backTo')} {activeUnit}
            </button>
            <button
              onClick={() => window.print()}
              className="font-display text-xs uppercase tracking-wider font-semibold px-3 py-2 rounded-lg transition-all hover:scale-105"
              style={{ color: COLORS.accent, background: COLORS.surface, border: `1px solid ${COLORS.line}` }}
            >
              {t('print')}
            </button>
          </div>

          <div id="printable-order" style={{ background: COLORS.manila, color: COLORS.ink2 }} className="relative rounded-lg p-7 pl-10 shadow-lg">
            <PunchHole />
            <div className="flex items-start justify-between mb-4 gap-3">
              <p className="font-mono text-xs" style={{ color: '#5B5342' }}>
                {activeUnit} · opened {fmtDate(order.dateCreated)} by {order.createdBy}
              </p>
              <StatusStamp status={order.status} t={t} />
            </div>

            <label className="block mb-4">
              <div className="flex items-center justify-between mb-1">
                <span className="font-display text-xs uppercase tracking-wider" style={{ color: '#6B6250' }}>{t('issueDescription')}</span>
                <button
                  type="button"
                  onClick={() => setPdtEditingDescription((s) => !s)}
                  className="text-xs"
                  style={{ color: COLORS.inkDim }}
                >
                  🌐
                </button>
              </div>
              <textarea
                value={getLocalizedText(order.description, lang)}
                onChange={(e) => {
                  const val = e.target.value;
                  const current = typeof order.description === 'string'
                    ? { text: order.description, origLang: 'en', translations: {} }
                    : order.description || { text: '', origLang: lang, translations: {} };
                  const nextDescription = current.origLang === lang
                    ? { ...current, text: val }
                    : { ...current, translations: { ...current.translations, [lang]: val } };
                  updateOrder(order.id, { description: nextDescription });
                }}
                rows={3}
                className="w-full rounded-sm px-3 py-2 text-sm font-body focus:outline-none focus:ring-2"
                style={{ background: '#EFE3C4', color: COLORS.ink2, border: `1px solid ${COLORS.manilaDark}` }}
              />
              {typeof order.description === 'object' && order.description.origLang !== lang && !order.description.translations[lang] && (
                <p className="text-xs mt-1" style={{ color: COLORS.accent }}>{t('noTranslationYet')}</p>
              )}
              {pdtEditingDescription && (
                <PdtChecklistForm
                  name={getLocalizedText(order.description, 'en')}
                  items={[]}
                  nameTranslations={typeof order.description === 'object' ? order.description.translations : {}}
                  itemTranslations={[]}
                  onSave={async (namePdt) => {
                    const current = typeof order.description === 'string'
                      ? { text: order.description, origLang: 'en', translations: {} }
                      : order.description || { text: '', origLang: 'en', translations: {} };
                    const translations = { ...current.translations };
                    if (namePdt.trim()) translations.pdt = namePdt.trim(); else delete translations.pdt;
                    await updateOrder(order.id, { description: { ...current, translations } });
                    setPdtEditingDescription(false);
                  }}
                  onCancel={() => setPdtEditingDescription(false)}
                />
              )}
            </label>

            <div className="mb-4">
              <span className="font-display text-xs uppercase tracking-wider block mb-2" style={{ color: '#6B6250' }}>{t('assignedMechanics')}</span>
              <div className="flex flex-wrap gap-2">
                {mechanics.map((m) => {
                  const current = getAssignedMechanics(order);
                  const isChecked = current.includes(m);
                  return (
                    <button
                      key={m}
                      onClick={() => {
                        const next = isChecked ? current.filter((x) => x !== m) : [...current, m];
                        updateOrder(order.id, { assignedMechanics: next, assignedMechanic: null });
                      }}
                      className="px-3 py-1.5 rounded-full text-sm font-body transition-all"
                      style={{
                        background: isChecked ? COLORS.ink2 : 'transparent',
                        color: isChecked ? COLORS.manila : COLORS.ink2,
                        border: `1.5px solid ${COLORS.manilaDark}`,
                      }}
                    >
                      {isChecked ? '✓ ' : ''}{m}
                    </button>
                  );
                })}
              </div>
              {mechanics.length === 0 && (
                <p className="text-sm" style={{ color: '#6B6250' }}>{t('noMechanicsOnTeam')}</p>
              )}
            </div>

            <div className="grid grid-cols-1 gap-3 mb-4">
              <label className="block">
                <span className="font-display text-xs uppercase tracking-wider block mb-1" style={{ color: '#6B6250' }}>{t('machineHours')}</span>
                <input
                  type="number"
                  value={order.hours || ''}
                  onChange={(e) => updateOrder(order.id, { hours: e.target.value })}
                  className="w-full rounded-sm px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                  style={{ background: '#EFE3C4', color: COLORS.ink2, border: `1px solid ${COLORS.manilaDark}` }}
                />
              </label>
            </div>

            <label className="block mb-5">
              <span className="font-display text-xs uppercase tracking-wider block mb-1" style={{ color: '#6B6250' }}>{t('dueDate')}</span>
              <input
                type="date"
                value={order.dueDate || ''}
                onChange={(e) => updateOrder(order.id, { dueDate: e.target.value })}
                className="w-full sm:w-1/2 rounded-sm px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                style={{ background: '#EFE3C4', color: COLORS.ink2, border: `1px solid ${COLORS.manilaDark}` }}
              />
            </label>

            <div className="mb-2">
              <span className="font-display text-xs uppercase tracking-wider block mb-2" style={{ color: '#6B6250' }}>{t('status')}</span>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => updateOrder(order.id, { status: 'Open' })}
                  className="font-display text-xs uppercase font-semibold tracking-wide px-3 py-1.5 rounded-sm focus:outline-none focus:ring-2"
                  style={{
                    border: `2px solid ${statusColor('Open')}`,
                    color: order.status === 'Open' ? COLORS.ink2 : statusColor('Open'),
                    background: order.status === 'Open' ? statusColor('Open') : 'transparent',
                  }}
                >
                  {t('statusOpen')}
                </button>
                <button
                  onClick={() => {
                    updateOrder(order.id, { status: 'Done' });
                    if (order.status !== 'Done') {
                      setShowFireworks(true);
                      setTimeout(() => setShowFireworks(false), 2600);
                    }
                  }}
                  className="font-display text-base uppercase font-bold tracking-wide px-6 py-3 rounded-lg focus:outline-none focus:ring-2 transition-all hover:scale-105"
                  style={{
                    border: `3px solid ${statusColor('Done')}`,
                    color: order.status === 'Done' ? '#1B1F19' : statusColor('Done'),
                    background: order.status === 'Done' ? statusColor('Done') : 'transparent',
                    boxShadow: order.status === 'Done' ? `0 2px 12px ${statusColor('Done')}66` : 'none',
                  }}
                >
                  ✓ {t('statusDone')}
                </button>
              </div>
            </div>
          </div>

          <div className="mt-8">
            <h3 className="font-display text-lg font-bold mb-4">Checklists</h3>

            {getChecklists(order).length > 0 && (
              <div className="space-y-4 mb-4">
                {getChecklists(order).map((c) => (
                  editingOrderChecklistId === c.id ? (
                    <OrderChecklistEditForm
                      key={c.id}
                      checklist={c}
                      onCancel={() => setEditingOrderChecklistId(null)}
                      onSave={(name, itemsText) => updateOrderChecklist(order.id, c.id, name, itemsText)}
                    />
                  ) : (
                  <div key={c.id} className="rounded-lg p-5" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
                    <div className="flex items-center justify-between mb-4 pb-4" style={{ borderBottomColor: COLORS.line, borderBottomWidth: '1px' }}>
                      <p className="font-display font-semibold" style={{ color: COLORS.accent }}>
                        {getLocalizedName(c.templateName, c.nameOrigLang, c.nameTranslations, lang)}
                      </p>
                      <div className="flex items-center gap-3">
                        <span className="font-mono text-sm font-bold" style={{ color: COLORS.accent }}>
                          {c.items.filter((i) => i.checked).length}/{c.items.length}
                        </span>
                        <button
                          onClick={() => setEditingOrderChecklistId(c.id)}
                          className="text-xs font-display uppercase tracking-wider hover:opacity-70"
                          style={{ color: COLORS.accent }}
                        >
                          {t('edit')}
                        </button>
                        <button
                          onClick={() => setPdtEditingChecklistId(pdtEditingChecklistId === c.id ? null : c.id)}
                          className="text-xs font-display uppercase tracking-wider hover:opacity-70"
                          style={{ color: COLORS.inkDim }}
                        >
                          🌐
                        </button>
                        <button
                          onClick={() => detachChecklist(order.id, c.id)}
                          className="text-xs font-display uppercase tracking-wider hover:opacity-70"
                          style={{ color: '#D6604A' }}
                        >
                          {t('remove')}
                        </button>
                      </div>
                    </div>
                    {pdtEditingChecklistId === c.id && (
                      <PdtChecklistForm
                        name={c.templateName}
                        items={c.items.map((it) => it.text)}
                        nameTranslations={c.nameTranslations}
                        itemTranslations={c.itemTranslations}
                        onSave={async (namePdt, itemPdts) => {
                          await updateChecklistPdt(order.id, c.id, namePdt, itemPdts);
                          setPdtEditingChecklistId(null);
                        }}
                        onCancel={() => setPdtEditingChecklistId(null)}
                      />
                    )}
                    <div className="space-y-3">
                      {c.items.map((it, idx) => (
                        <label key={it.id} className="flex items-start gap-3 cursor-pointer group">
                          <input
                            type="checkbox"
                            checked={it.checked}
                            onChange={() => toggleChecklistItem(order.id, c.id, it.id)}
                            className="mt-1 w-5 h-5 rounded focus:outline-none focus:ring-2 cursor-pointer"
                            style={{ accentColor: COLORS.accent }}
                          />
                          <div className="flex-1">
                            <span className="text-base" style={{ color: it.checked ? COLORS.line : COLORS.ink, textDecoration: it.checked ? 'line-through' : 'none' }}>
                              {getLocalizedChecklistText(it.text, c.nameOrigLang, c.itemTranslations, lang, idx)}
                            </span>
                            {it.checked && it.checkedBy && (
                              <span className="block font-mono text-xs mt-1" style={{ color: COLORS.line }}>
                                ✓ {it.checkedBy} on {new Date(it.checkedAt).toLocaleDateString()}
                              </span>
                            )}
                          </div>
                        </label>
                      ))}
                    </div>
                  </div>
                  )
                ))}
              </div>
            )}

            <div className="rounded-lg p-5" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>
              {templates.length > 0 && !showAdHocChecklist && (
                <div className="mb-4">
                  <p className="text-sm mb-3" style={{ color: COLORS.inkDim }}>
                    {getChecklists(order).length > 0 ? t('addAnotherChecklist') : t('pickChecklist')}
                  </p>
                  <div className="flex gap-2">
                    <select
                      value={attachTemplateId}
                      onChange={(e) => setAttachTemplateId(e.target.value)}
                      className="flex-1 rounded-lg px-4 py-2 text-base focus:outline-none focus:ring-2"
                      style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                    >
                      <option value="">{t('selectChecklistDots')}</option>
                      {templates.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
                    </select>
                    <Btn disabled={!attachTemplateId} onClick={() => attachChecklist(order.id, attachTemplateId)}>{t('add')}</Btn>
                  </div>
                </div>
              )}

              {!showAdHocChecklist ? (
                <button
                  onClick={() => setShowAdHocChecklist(true)}
                  className="text-sm underline"
                  style={{ color: COLORS.accent }}
                >
                  {t('createChecklistForJob')}
                </button>
              ) : (
                <AdHocChecklistForm
                  onCancel={() => setShowAdHocChecklist(false)}
                  onSubmit={async (name, itemsText, saveAsTemplate) => {
                    await createAdHocChecklist(order.id, name, itemsText, saveAsTemplate);
                    setShowAdHocChecklist(false);
                  }}
                />
              )}
            </div>
          </div>

          <PhotosSection
            order={order}
            onAdd={(dataUrls) => addPhotos(order.id, dataUrls)}
            onRemove={(photoId) => removePhoto(order.id, photoId)}
            t={t}
          />

          <div className="mt-8">
            <h3 className="font-display text-lg font-bold mb-4">{t('notesUpdates')}</h3>
            <div className="space-y-3 mb-5">
              {(order.notes || []).length === 0 && (
                <p className="text-sm text-center py-4" style={{ color: COLORS.line }}>{t('noNotesYet')}</p>
              )}
              {(order.notes || []).slice().reverse().map((n) => (
                <NoteCard
                  key={n.id}
                  note={n}
                  isEditing={editingNoteId === n.id}
                  canEdit={n.author === currentMechanic || isAdmin}
                  onEdit={() => setEditingNoteId(n.id)}
                  onCancel={() => setEditingNoteId(null)}
                  onSave={(text) => updateNote(order.id, n.id, text)}
                  onDelete={() => deleteNote(order.id, n.id)}
                  onSavePdt={(pdtText) => saveNotePdt(order.id, n.id, pdtText)}
                  lang={lang}
                />
              ))}
            </div>
            <NoteForm onSubmit={(text, type) => addNote(order.id, text, type)} t={t} />

}

function WeekReviewTable({ entries }) {
  const sorted = [...entries].sort((a, b) => (a.mechanic || '').localeCompare(b.mechanic || '') || a.date.localeCompare(b.date));
  const groups = [];
  sorted.forEach((e) => {
    const last = groups[groups.length - 1];
    if (last && last.mechanic === e.mechanic) {
      last.entries.push(e);
    } else {
      groups.push({ mechanic: e.mechanic, entries: [e] });
    }
  });

  const th = { padding: '8px 12px', textAlign: 'left', fontWeight: 600, whiteSpace: 'nowrap', borderBottom: `2px solid ${COLORS.line}` };
  const td = { padding: '8px 12px', whiteSpace: 'nowrap', borderBottom: `1px solid ${COLORS.line}` };

  return (
    <div className="mt-4 rounded-lg overflow-x-auto" style={{ background: COLORS.surfaceRaised, border: `1px solid ${COLORS.line}` }}>
      <table className="text-xs font-mono w-full" style={{ borderCollapse: 'collapse' }}>
        <thead>
          <tr style={{ color: COLORS.inkDim }}>
            <th style={th}>Date</th>
            <th style={th}>In</th>
            <th style={th}>Out</th>
            <th style={th}>Break</th>
            <th style={th}>Worked thru break</th>
            <th style={th}>Paid hrs</th>
            <th style={th}>Signed</th>
            <th style={th}>Jobs</th>
          </tr>
        </thead>
        <tbody>
          {groups.map((g) => (
            <React.Fragment key={g.mechanic}>
              <tr>
                <td colSpan={8} style={{ padding: '8px 12px', fontWeight: 700, color: COLORS.accent, background: COLORS.surface, borderBottom: `1px solid ${COLORS.line}` }}>
                  {g.mechanic}
                </td>
              </tr>
              {g.entries.map((e) => (
                <tr key={e.id} style={{ color: COLORS.ink }}>
                  <td style={td}>{fmtDate(e.date)}</td>
                  <td style={td}>{fmtTime(e.clockIn)}</td>
                  <td style={td}>{e.clockOut ? fmtTime(e.clockOut) : '—'}</td>
                  <td style={td}>{e.lunchStart && e.lunchEnd ? `${fmtTime(e.lunchStart)}–${fmtTime(e.lunchEnd)}` : '—'}</td>
                  <td style={td}>{e.skippedLunch ? 'Yes' : 'No'}</td>
                  <td style={{ ...td, color: COLORS.accent, fontWeight: 700 }}>{fmtHoursDecimal(entryHours(e))}</td>
                  <td style={{ ...td, color: e.signature ? COLORS.done : COLORS.line }}>{e.signature ? '✓' : '—'}</td>
                  <td style={td}>{(e.jobs || []).map((j) => `${j.unit}: ${j.hours}h`).join(' | ') || '—'}</td>
                </tr>
              ))}
            </React.Fragment>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function TimesheetEntryCard({ entry, locked, canEdit, isEditing, onEdit, onCancelEdit, onSave, onDelete, onAddJob, onRemoveJob }) {
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [showSignature, setShowSignature] = useState(false);
  const toLocalInput = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  // Break times are time-only inputs (no date picker) — a break is always
  // on the same calendar day as the shift itself, so there's no reason to
  // let someone accidentally pick the wrong date here. This is exactly
  // what caused a real mis-entry: a break end landed two days later than
  // intended, which zeroed out an entire day's hours.
  const toLocalTime = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const combineLunchDateTime = (clockInLocal, time) => {
    if (!time || !clockInLocal) return null;
    const datePart = clockInLocal.slice(0, 10);
    return new Date(`${datePart}T${time}`).toISOString();
  };
  const [clockIn, setClockIn] = useState(toLocalInput(entry.clockIn));
  const [clockOut, setClockOut] = useState(toLocalInput(entry.clockOut));
  const [lunchStartTime, setLunchStartTime] = useState(toLocalTime(entry.lunchStart));
  const [lunchEndTime, setLunchEndTime] = useState(toLocalTime(entry.lunchEnd));

  if (isEditing) {
    return (
      <div className="rounded-lg p-5" style={{ background: COLORS.surface, border: `2px solid ${COLORS.accent}` }}>
        <p className="font-display font-semibold mb-4">{fmtDate(entry.date)}</p>
        <div className="grid grid-cols-2 gap-3 mb-3">
          <label className="block">
            <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Clock in</span>
            <input type="datetime-local" value={clockIn} onChange={(e) => setClockIn(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2" style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }} />
          </label>
          <label className="block">
            <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Clock out</span>
            <input type="datetime-local" value={clockOut} onChange={(e) => setClockOut(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2" style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }} />
          </label>
          <label className="block">
            <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Break start</span>
            <input type="time" value={lunchStartTime} onChange={(e) => setLunchStartTime(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2" style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }} />
          </label>
          <label className="block">
            <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Break end</span>
            <input type="time" value={lunchEndTime} onChange={(e) => setLunchEndTime(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2" style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }} />
          </label>
        </div>
        <TimesheetJobsEditor entry={entry} onAdd={onAddJob} onRemove={onRemoveJob} />
        {confirmDelete ? (
          <div className="mt-4 rounded-lg p-3" style={{ background: COLORS.surfaceRaised }}>
            <p className="text-sm mb-3" style={{ color: COLORS.inkDim }}>Delete this whole shift? This can't be undone.</p>
            <div className="flex gap-2">
              <Btn variant="danger" onClick={onDelete}>Yes, delete it</Btn>
              <Btn variant="ghost" onClick={() => setConfirmDelete(false)}>Cancel</Btn>
            </div>
          </div>
        ) : (
          <div className="flex gap-2 mt-4">
            <Btn
              onClick={() =>
                onSave({
                  clockIn: clockIn ? new Date(clockIn).toISOString() : null,
                  clockOut: clockOut ? new Date(clockOut).toISOString() : null,
                  lunchStart: combineLunchDateTime(clockIn, lunchStartTime),
                  lunchEnd: combineLunchDateTime(clockIn, lunchEndTime),
                })
              }
            >
              Save changes
            </Btn>
            <Btn variant="ghost" onClick={onCancelEdit}>Cancel</Btn>
            <button onClick={() => setConfirmDelete(true)} className="text-xs underline ml-auto" style={{ color: '#E07A5F' }}>
              Delete shift
            </button>
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="rounded-lg p-4" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
      <div className="flex items-center justify-between mb-2">
        <span className="font-display font-semibold">{fmtDate(entry.date)}</span>
        {!canEdit ? (
          <span className="text-xs" style={{ color: COLORS.line }}>Ask admin to fix a mistake</span>
        ) : locked ? (
          <span className="text-xs font-semibold" style={{ color: COLORS.done }}>🔒 Approved</span>
        ) : (
          <button onClick={onEdit} className="text-xs underline" style={{ color: COLORS.accent }}>Edit</button>
        )}
      </div>
      <div className="flex flex-wrap gap-4 text-xs font-mono mb-1" style={{ color: COLORS.inkDim }}>
        <span>In {fmtTime(entry.clockIn)}</span>
        <span>Out {entry.clockOut ? fmtTime(entry.clockOut) : '—'}</span>
        {entry.lunchStart && entry.lunchEnd && <span>Break {fmtTime(entry.lunchStart)}–{fmtTime(entry.lunchEnd)}</span>}
        {entry.skippedLunch && <span>No break taken</span>}
      </div>
      {entry.clockOut && (
        <p className="text-xs font-mono mb-2" style={{ color: COLORS.accent }}>
          Total for the day: <span className="font-bold">{fmtHours(entryHours(entry))}</span>
        </p>
      )}
      {(entry.jobs || []).length > 0 && (
        <p className="text-xs" style={{ color: COLORS.line }}>
          {entry.jobs.map((j) => `${j.unit} (${j.hours}h)`).join(' • ')}
        </p>
      )}
      {entry.signature && (
        <div className="mt-2">
          <button
            onClick={() => setShowSignature((s) => !s)}
            className="text-xs underline"
            style={{ color: COLORS.done }}
          >
            ✓ Signed {showSignature ? '(hide)' : '(view)'}
          </button>
          {showSignature && (
            <div className="mt-2 rounded-lg p-2 inline-block" style={{ background: '#fff' }}>
              <img src={entry.signature} alt="Signature" style={{ height: 60, display: 'block' }} />
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function PdtTranslationsScreen({ customPdtStrings, customPdtJokes, onSaveStrings, onSaveJokes, onBack, t }) {
  const [search, setSearch] = useState('');
  const [drafts, setDrafts] = useState(customPdtStrings);
  const [jokeDrafts, setJokeDrafts] = useState(customPdtJokes.length ? customPdtJokes : ['']);
  const [saving, setSaving] = useState(false);

  const keys = Object.keys(translations.en).sort();
  const q = search.trim().toLowerCase();
  const filteredKeys = q
    ? keys.filter((k) => translations.en[k].toLowerCase().includes(q) || k.toLowerCase().includes(q))
    : keys;

  const handleSaveStrings = async () => {
    setSaving(true);
    try {
      const cleaned = {};
      Object.entries(drafts).forEach(([k, v]) => { if (v && v.trim()) cleaned[k] = v.trim(); });
      await onSaveStrings(cleaned);
    } finally {
      setSaving(false);
    }
  };

  const handleSaveJokes = async () => {
    setSaving(true);
    try {
      const cleaned = jokeDrafts.map((j) => j.trim()).filter(Boolean);
      await onSaveJokes(cleaned);
    } finally {
      setSaving(false);

  };

  return (
    <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
      <div className="max-w-3xl mx-auto">

          value={search}
          onChange={(e) => setSearch(e.target.value)}

          style={{ background: COLORS.surface, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}

        <div className="rounded-lg p-5 mb-6" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
          <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
            <h2 className="font-display text-sm font-bold uppercase tracking-wide">Buttons & Labels ({filteredKeys.length})</h2>
            <Btn onClick={handleSaveStrings} disabled={saving}>{saving ? 'Saving…' : 'Save all'}</Btn>

            {filteredKeys.map((k) => (
              <div key={k}>
                <span className="text-xs block mb-1" style={{ color: COLORS.line }}>{translations.en[k]}</span>
                <input
                  value={drafts[k] || ''}

                  placeholder={translations.pdt[k] || translations.en[k]}
                  className="w-full rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2"
                  style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                />
              </div>
            ))}
            {filteredKeys.length === 0 && (
              <p className="text-sm" style={{ color: COLORS.line }}>No matches for that search.</p>
            )}
          </div>
        </div>

        <div className="rounded-lg p-5" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
          <div className="flex items-center justify-between mb-4">
            <h2 className="font-display text-sm font-bold uppercase tracking-wide">Jokes</h2>
            <Btn onClick={handleSaveJokes} disabled={saving}>{saving ? 'Saving…' : 'Save jokes'}</Btn>
          </div>
          <div className="space-y-3">
            {jokeDrafts.map((j, i) => (
              <div key={i} className="flex gap-2">
                <input
                  value={j}
                  onChange={(e) => {
                    const next = [...jokeDrafts];
                    next[i] = e.target.value;
                    setJokeDrafts(next);
                  }}

                  className="flex-1 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2"
                  style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}

                  style={{ color: '#E07A5F' }}
                >
                  ✕
                </button>
              </div>
            ))}
            <button
              onClick={() => setJokeDrafts([...jokeDrafts, ''])}
              className="text-sm underline"
              style={{ color: COLORS.accent }}
            >
              + Add another joke
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function AddMissedDayForm({ onSubmit, onCancel, mechanics, defaultMechanic, t }) {
  const tr = t || ((k) => translations.en[k] || k);
  const [mechanic, setMechanic] = useState(defaultMechanic || (mechanics && mechanics[0]) || '');
  const [date, setDate] = useState(() => new Date().toISOString().slice(0, 10));
  const [clockInTime, setClockInTime] = useState('');
  const [clockOutTime, setClockOutTime] = useState('');
  const [lunchStartTime, setLunchStartTime] = useState('');
  const [lunchEndTime, setLunchEndTime] = useState('');
  const [error, setError] = useState('');

  const combine = (d, time) => (time ? `${d}T${time}` : null);

  const handleSave = () => {
    if (!date || !clockInTime) {
      setError('Pick a date and at least a clock-in time.');
      return;
    }
    onSubmit(
      mechanic,
      date,
      combine(date, clockInTime),
      combine(date, clockOutTime),
      combine(date, lunchStartTime),
      combine(date, lunchEndTime),
      setError
    );
  };

  const fieldStyle = { background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` };
  const fieldClass = 'w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2';

  return (
    <div className="rounded-lg p-5 mb-6" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.accent}` }}>
      <h3 className="font-display text-sm font-bold uppercase tracking-wide mb-3">+ Add a missed day</h3>
      {mechanics && (
        <label className="block mb-3">
          <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Mechanic</span>
          <select value={mechanic} onChange={(e) => setMechanic(e.target.value)} className={fieldClass} style={fieldStyle}>
            {mechanics.map((m) => <option key={m} value={m}>{m}</option>)}
          </select>
        </label>
      )}
      <div className="grid grid-cols-2 gap-3 mb-3">
        <label className="block col-span-2">
          <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Date</span>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className={fieldClass} style={fieldStyle} />
        </label>
        <label className="block">
          <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>{tr('clockIn')}</span>
          <input type="time" value={clockInTime} onChange={(e) => setClockInTime(e.target.value)} className={fieldClass} style={fieldStyle} />
        </label>
        <label className="block">
          <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>{tr('clockOut')}</span>
          <input type="time" value={clockOutTime} onChange={(e) => setClockOutTime(e.target.value)} className={fieldClass} style={fieldStyle} />
        </label>
        <label className="block">
          <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Break start (optional)</span>
          <input type="time" value={lunchStartTime} onChange={(e) => setLunchStartTime(e.target.value)} className={fieldClass} style={fieldStyle} />
        </label>
        <label className="block">
          <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Break end (optional)</span>
          <input type="time" value={lunchEndTime} onChange={(e) => setLunchEndTime(e.target.value)} className={fieldClass} style={fieldStyle} />
        </label>
      </div>
      {error && <p className="text-xs mb-3" style={{ color: '#E07A5F' }}>{error}</p>}
      <div className="flex gap-2">
        <Btn onClick={handleSave}>Save day</Btn>
        <Btn variant="ghost" onClick={onCancel}>{tr('cancel')}</Btn>
      </div>
    </div>
  );
}

function MechanicScheduleEditor({ mechanic, schedule, onSave, onResetDefault, onCancel }) {

  const [end, setEnd] = useState((schedule || { end: '17:50' }).end);
  return (
    <div className="mt-3 rounded-lg p-3" style={{ background: COLORS.surfaceRaised }}>
      <div className="grid grid-cols-2 gap-3 mb-3">
        <label className="block">
          <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Shift start</span>
          <input type="time" value={start} onChange={(e) => setStart(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2" style={{ background: COLORS.surface, color: COLORS.ink, border: `1px solid ${COLORS.line}` }} />
        </label>
        <label className="block">
          <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Shift end</span>
          <input type="time" value={end} onChange={(e) => setEnd(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2" style={{ background: COLORS.surface, color: COLORS.ink, border: `1px solid ${COLORS.line}` }} />

function EmailListEditor({ label, helper, value, onSave, single }) {
  const [draft, setDraft] = useState(value);
  const [saved, setSaved] = useState(false);

  const handleSave = () => {
    const list = draft
      .split(',')
      .map((s) => s.trim())
      .filter(Boolean);
    onSave(single ? list.slice(0, 1) : list);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div className="mb-5 pb-5" style={{ borderBottom: `1px solid ${COLORS.line}` }}>
      <span className="text-sm font-semibold block mb-1" style={{ color: COLORS.ink }}>{label}</span>
      <span className="text-xs block mb-2" style={{ color: COLORS.inkDim }}>{helper}</span>
      <div className="flex gap-2">
        <input
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          placeholder={single ? 'bookkeeper@yourcompany.com' : 'payroll@yourcompany.com, joe@yourcompany.com'}
          type="text"
          className="flex-1 rounded-lg px-4 py-2.5 text-base focus:outline-none focus:ring-2"
          style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
        />
        <Btn onClick={handleSave}>{saved ? 'Saved ✓' : 'Save'}</Btn>
      </div>
    </div>
  );
}

  const [itemsText, setItemsText] = useState('');
  const [saveAsTemplate, setSaveAsTemplate] = useState(false);
  const canSubmit = name.trim() && itemsText.trim();

      <label className="block mb-4">
        <span className="font-display text-sm font-semibold block mb-2" style={{ color: COLORS.ink }}>Steps to complete</span>
