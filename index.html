// Generic version of the same migration logic — copies any array-based
// collection into a per-record collection at a new path, verifying every
// entry afterward, without touching or deleting the original. Every
// collection-specific migrateXToPerRecord function below is just this,
// called with that collection's own path names and a label for the
// result message — so the actual copy-and-verify logic only has to be
// right in one place, not re-typed correctly for every collection.
async function migrateArrayCollectionToPerRecord(oldPath, newPath, itemLabel) {
  const db = firebase.database();
  const oldSnap = await db.ref(oldPath).once('value');
  const oldEntries = oldSnap.val() || [];
  if (!Array.isArray(oldEntries) || oldEntries.length === 0) {
    return { ok: true, migrated: 0, note: `No ${itemLabel} found to migrate.` };
  }
  const missingId = oldEntries.filter((e) => !e || !e.id);
  if (missingId.length > 0) {
    return { ok: false, migrated: 0, note: `${missingId.length} ${itemLabel} have no id and can't be safely migrated — stopped before writing anything.` };
  }
  const updates = {};
  oldEntries.forEach((entry) => { updates[entry.id] = stripUndefined(entry); });
  await db.ref(newPath).update(updates);
  const checkSnap = await db.ref(newPath).once('value');
  const checkVal = checkSnap.val() || {};
  const mismatches = oldEntries.filter((e) => JSON.stringify(checkVal[e.id]) !== JSON.stringify(stripUndefined(e)));
  const checkCount = Object.keys(checkVal).length;
  return {
    ok: mismatches.length === 0 && checkCount >= oldEntries.length,
    migrated: checkCount,
    expectedCount: oldEntries.length,
    mismatchCount: mismatches.length,
    note: mismatches.length === 0
      ? `Migrated and verified ${checkCount} ${itemLabel}. The original '${oldPath}' data is untouched.`
      : `${mismatches.length} of ${oldEntries.length} ${itemLabel} didn't verify correctly — nothing was deleted, safe to investigate before proceeding.`,
  };
}
// Self-healing check used right before each per-record listener attaches
// — guarantees the new collection is populated before the app ever
// treats it as the live source, whether or not anyone ran the migration
// button manually first. Safe to run redundantly on multiple devices at
// once, since the underlying migration is itself idempotent.
async function selfHealMigration(oldPath, newPath, itemLabel) {
  try {
    const db = firebase.database();
    const newSnap = await db.ref(newPath).once('value');
    if (!newSnap.exists()) {
      const oldSnap = await db.ref(oldPath).once('value');
      const oldVal = oldSnap.val();
      if (Array.isArray(oldVal) && oldVal.length > 0) {
        await migrateArrayCollectionToPerRecord(oldPath, newPath, itemLabel);
      }
    }
  } catch (e) {
    // Offline or similar — the caller's listener still attaches right
    // after this either way, so the app isn't blocked from loading.
  }
}

// --- Offline-safe write queue, covering every collection in the app ---
// This crew works from sites with genuinely bad signal, so a save can't
// be allowed to just quietly vanish if the connection drops before it
// reaches Firebase — and that's true for a work order or a map pin just
// as much as it's true for a clock-out. Every write, everywhere in the
// app, goes into this one shared queue — backed by localStorage, not
// React state — BEFORE it's attempted. If the attempt fails (or the app
// gets closed mid-attempt), the write stays queued and gets retried
// automatically the next time the app opens, the moment connectivity
// comes back, or on the periodic safety-net check, until it actually
// confirms. The underlying Firebase operations (set/update/remove) are
// already safe to repeat if a retry happens to succeed on the server
// after all, so there's no special de-duplication needed beyond that.
//
// Filled in directly here — every function referenced below uses a
// hoisted `function` declaration, so each one is already available at
// this point regardless of where it's actually defined further down in
// the file.
const OFFLINE_QUEUE_HANDLERS = {
  timesheets: { save: saveTimesheetEntryRecord, patch: patchTimesheetEntryRecord, delete: deleteTimesheetEntryRecord },
  orders: { save: saveOrderRecord, patch: patchOrderRecord, delete: deleteOrderRecord, bulkSave: bulkSaveOrderRecords },
  productionShifts: { save: saveProductionShiftRecord, patch: patchProductionShiftRecord, delete: deleteProductionShiftRecord },
  driverLogs: { save: saveDriverLogRecord, patch: patchDriverLogRecord, delete: deleteDriverLogRecord, bulkSave: bulkSaveDriverLogRecords },
  preTripInspections: { save: saveInspectionRecord, delete: deleteInspectionRecord },
  maps: { save: saveMapRecord, patch: patchMapRecord, delete: deleteMapRecord, bulkPatch: bulkPatchMapRecords },
  safetyDocs: { save: saveSafetyDocRecord, delete: deleteSafetyDocRecord },
  mapPins: { save: saveMapPinRecord, patch: patchMapPinRecord, delete: deleteMapPinRecord },
  mapLines: { save: saveMapLineRecord, patch: patchMapLineRecord, delete: deleteMapLineRecord },
  machineTracks: { save: saveMachineTrackRecord, patch: patchMachineTrackRecord },
  highwayLocations: { save: saveHighwayLocationRecord, delete: deleteHighwayLocationRecord },
  highwayLines: { save: saveHighwayLineRecord, patch: patchHighwayLineRecord, delete: deleteHighwayLineRecord },
  meta: { setWhole: saveMeta },
  templates: { setWhole: saveTemplates },
  pins: { setWhole: savePins },
  blocks: { setWhole: saveBlocksList },
  productionSettings: { setWhole: saveProductionSettingsRecord },
};

function loadPendingWrites() {
  return cacheGet('pendingWrites', []);
}
function savePendingWrites(queue) {
  cacheSet('pendingWrites', queue);
}
async function queueWrite(collection, op) {
  const queue = loadPendingWrites();
  queue.push({ ...op, collection });
  savePendingWrites(queue);
  await flushPendingWrites();
}
// Safe to call anytime, as often as needed — does nothing if the queue is
// already empty, and only removes an item once its write has genuinely
// been confirmed. An item whose collection isn't recognized (shouldn't
// normally happen) is left in place rather than silently dropped, so
// nothing real ever quietly vanishes even in an unexpected case.
async function flushPendingWrites() {
  const queue = loadPendingWrites();
  if (queue.length === 0) return;
  const stillPending = [];
  for (const op of queue) {
    const handlers = OFFLINE_QUEUE_HANDLERS[op.collection];
    if (!handlers) { stillPending.push(op); continue; }
    try {
      if (op.kind === 'save') await handlers.save(op.entry);
      else if (op.kind === 'patch') await handlers.patch(op.entryId, op.patch);
      else if (op.kind === 'delete') await handlers.delete(op.entryId);
      else if (op.kind === 'bulkSave') await handlers.bulkSave(op.entries);
      else if (op.kind === 'bulkPatch') await handlers.bulkPatch(op.patchesById);
      else if (op.kind === 'setWhole') await handlers.setWhole(op.value);
    } catch (e) {
      stillPending.push(op);
    }
  }
  savePendingWrites(stillPending);
}

function slugForPush(name) {

// Asks the browser for notification permission (must be called from inside
// a real tap — Safari on iOS silently ignores permission requests fired
// automatically on page load), then registers this device for push and
// saves the token so the backend knows where to send shift reminders.
async function registerPushNotifications(mechanicName) {
  try {
    if (!('Notification' in window) || !navigator.serviceWorker) return false;
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return false;
    const reg = await navigator.serviceWorker.ready;
    const token = await firebase.messaging().getToken({ vapidKey: VAPID_PUBLIC_KEY, serviceWorkerRegistration: reg });
    if (!token) return false;
    await firebase.database().ref('pushTokens/' + slugForPush(mechanicName)).set({ token, enabled: true });
    return true;
  } catch (e) {
    console.error('push registration failed', e);
    return false;
  }
}

async function translateText(text, targetLang) {
  try {
    const res = await fetch(CLOUD_FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, key: APP_SECRET, targetLang: targetLang || 'en' }),
    });
    if (!res.ok) return null;
    const data = await res.json();
    return data.translated || null;
  } catch (e) {
    return null; // offline or the call failed — fall back to showing the original text untranslated

function getLocalizedChecklistText(text, origLang, translations, lang, index) {
  if (origLang === lang) return text;
  const entry = Array.isArray(translations) ? translations[index] : (translations && translations[text]);
  return (entry && entry[lang]) || text;
}

function getLocalizedName(name, origLang, nameTranslations, lang) {
  if (origLang === lang) return name;
  return (nameTranslations && nameTranslations[lang]) || name;
}

// Resolves a piece of user-typed content (title, description, checklist
// item) to whatever language is currently active. `field` can be a plain
// string (older data, before this existed) or an object built by this
// feature: { text, origLang, translations: { en, es, pdt } }.
function getLocalizedText(field, lang) {
  if (!field) return '';
  if (typeof field === 'string') return field;
  if (field.origLang === lang) return field.text;
  if (field.translations && field.translations[lang]) return field.translations[lang];
  return field.text;
}

// Builds a multi-language content object at save time. Auto-translates
// between English and Spanish immediately (Google's translation service
// supports both); Plautdietsch has no automatic translation available, so
// that slot is left for a human to fill in later via the app.
async function buildLocalizedField(text, currentLang) {
  const field = { text, origLang: currentLang, translations: {} };
  if (currentLang === 'en' || currentLang === 'es') {
    const other = currentLang === 'en' ? 'es' : 'en';
    const translated = await translateText(text, other);
    if (translated) field.translations[other] = translated;
  }
  return field;
}

// One-way hash so raw PINs are never stored or sent anywhere in plain text.
async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

function webauthnKey(name) {
  return 'webauthn_cred_' + name;
}

async function webauthnAvailable() {
  return !!(
    window.PublicKeyCredential &&
    window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable &&
    (await window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())
  );
}

// Registers Face ID / Touch ID (or Windows Hello, etc.) as a shortcut on THIS device only.
// The credential never leaves the device — it's just a local unlock, not shared identity proof.
async function registerBiometric(name) {
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge,
      rp: { name: 'Harder Contracting Work Orders' },
      user: {
        id: new TextEncoder().encode(name),
        name,
        displayName: name,
      },
      pubKeyCredParams: [
        { type: 'public-key', alg: -7 },
        { type: 'public-key', alg: -257 },
      ],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
      timeout: 60000,
    },
  });
  const credIdB64 = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
  localStorage.setItem(webauthnKey(name), credIdB64);
}

async function verifyBiometric(name) {
  const credIdB64 = localStorage.getItem(webauthnKey(name));
  if (!credIdB64) return false;
  try {
    const credId = Uint8Array.from(atob(credIdB64), (c) => c.charCodeAt(0));
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    await navigator.credentials.get({
      publicKey: {
        challenge,
        allowCredentials: [{ id: credId, type: 'public-key' }],
        userVerification: 'required',
        timeout: 60000,
      },
    });
    return true;
  } catch (e) {
    return false;
  }
}

// Every unit is now a real Work Order Board unit, tagged with a type via
// /unitTypes — there's no separate hardcoded machine list anymore. Mechanics
// still use the plain clock in/out; production-tagged units get the fields
// below based on their tag.
function machineType(name, unitTypesMap) {
  return (unitTypesMap || {})[slugForUnit(name || '')];
}
function productionSummary(s, unitTypesMap) {
  const type = machineType(s.machine, unitTypesMap);
  if (type === 'buncher') return s.trees ? `${s.trees} trees` : '—';
  if (type === 'skidder' || type === 'processor') {
    const parts = [];
    if (s.spruce) parts.push(`${s.spruce} spruce`);
    if (s.aspen) parts.push(`${s.aspen} aspen`);
    return parts.length ? parts.join(', ') : '—';
  }
  if (type === 'loader') {
    const parts = [];
    if (s.loadCount) parts.push(`${s.loadCount} loads`);
    if (s.topPileCount) parts.push(`${s.topPileCount} top piles`);
    return parts.length ? parts.join(', ') : '—';
  }
  if (type === 'fuel') {
    const total = Object.values(s.fuelLog || {}).flat().reduce((sum, v) => sum + (parseFloat(v) || 0), 0);
    return total > 0 ? `${total} L delivered` : '—';
  }
  return '—';
}

const TRACK_ELIGIBLE_TYPES = ['buncher', 'skidder', 'processor', 'loader', 'crawler'];

// Deterministic color per operator name, for machine track trails on the
// Highway Map — same person always gets the same color, no admin setup
// needed. Just a name → hue hash, not tied to any stored preference.
function colorForOperator(name) {
  let hash = 0;
  const str = name || '';
  for (let i = 0; i < str.length; i++) {
    hash = (str.charCodeAt(i) + ((hash << 5) - hash)) | 0;
  }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 75%, 55%)`;
}

// A day with just one status the whole time reads much more clearly as
// "Off Duty" than as "1 status change" — the count only actually helps
// once there's more than one thing to summarize.
function driverDaySummaryLabel(statusChanges) {
  const list = statusChanges || [];
  if (list.length === 1) return DUTY_STATUS_LABELS[list[0].status];
  return `${list.length} status changes`;
}

// Turns a list of discrete status-change timestamps into total hours spent
// in each status — each segment runs from one change to the next, with the
// final (or only, if still open) segment running until endTime/now.
function computeDutyDurations(statusChanges, endTime) {
  const totals = { off: 0, sleeper: 0, driving: 0, onDuty: 0 };
  const sorted = [...(statusChanges || [])].sort((a, b) => new Date(a.time) - new Date(b.time));
  for (let i = 0; i < sorted.length; i++) {
    const segStart = new Date(sorted[i].time);
    const segEnd = i + 1 < sorted.length ? new Date(sorted[i + 1].time) : new Date(endTime || Date.now());
    const hrs = Math.max(0, (segEnd - segStart) / 1000 / 60 / 60);
    totals[sorted[i].status] = (totals[sorted[i].status] || 0) + hrs;
  }
  return totals;
}

// Locked-down, read-only view meant for handing the phone directly to an
// inspecting officer. Alberta's regulation is specific about what a driver
// needs to produce on request: the record of duty status for "the current
// 24-hour period and the previous 14 consecutive days" — nothing about the
// rest of the app, no editing, no navigation elsewhere. This shows exactly
// that and nothing more, with one clear way back out.
function InspectionModeScreen({ driver, allLogs, onExit }) {
  const [confirmingExit, setConfirmingExit] = useState(false);
  const [exitPin, setExitPin] = useState('');
  const [exitError, setExitError] = useState('');
  const [verifying, setVerifying] = useState(false);

  const myLogs = allLogs.filter((l) => l.driver === driver);
  const today = new Date();
  const last14Dates = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    last14Dates.push(localDateStr(d));
  }
  const recentLogs = myLogs
    .filter((l) => last14Dates.includes(l.start.slice(0, 10)))
    .sort((a, b) => b.start.localeCompare(a.start));
  const currentLog = myLogs.find((l) => !l.end) || recentLogs[0] || null;

  const attemptExit = async () => {
    if (exitPin.length < 4) return;
    setVerifying(true);
    setExitError('');
    try {
      // Re-checks the PIN against the driver's real account, the same way
      // login itself does — this doesn't touch or disrupt the session
      // that's already active, it's purely a verify step. Wrong PIN simply
      // rejects here without signing anyone out.
      await firebase.auth().signInWithEmailAndPassword(emailForMechanic(driver), exitPin);
      onExit();
    } catch (e) {
      setExitError('Wrong PIN — try again');
      setExitPin('');
    } finally {
      setVerifying(false);
    }
  };

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 500, background: COLORS.bg, color: COLORS.ink, overflowY: 'auto' }} className="font-body p-5">
      <div className="flex items-center justify-between mb-6" style={{ paddingTop: 'env(safe-area-inset-top, 0px)' }}>
        <div>
          <p className="font-display text-xs uppercase tracking-wide" style={{ color: COLORS.accent }}>Inspection Mode</p>
          <h1 className="font-display text-xl font-bold">{driver}</h1>
        </div>
        <Btn variant="ghost" onClick={() => setConfirmingExit(true)}>Exit</Btn>
      </div>

      {confirmingExit && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 600, background: 'rgba(0,0,0,0.85)', display: 'flex', alignItems: 'center', justifyContent: 'center' }} className="p-6">
          <div className="w-full max-w-xs rounded-2xl p-6" style={{ background: COLORS.surface, border: `2px solid ${COLORS.accent}` }}>
            <p className="font-display text-lg font-bold text-center mb-1">Enter your PIN to exit</p>
            <p className="text-xs text-center mb-4" style={{ color: COLORS.inkDim }}>Only {driver} can leave Inspection Mode</p>
            <input
              type="password"
              inputMode="numeric"
              maxLength={6}
              autoFocus
              value={exitPin}
              onChange={(e) => { setExitPin(e.target.value.replace(/\D/g, '')); setExitError(''); }}
              onKeyDown={(e) => { if (e.key === 'Enter') attemptExit(); }}
              className="w-full rounded-lg px-4 py-3 text-2xl text-center font-mono mb-2 focus:outline-none focus:ring-2"
              style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}`, letterSpacing: '0.5em' }}
            />
            {exitError && <p className="text-xs text-center mb-2" style={{ color: '#E07A5F' }}>{exitError}</p>}
            <div className="flex gap-2 mt-3">
              <Btn onClick={attemptExit} disabled={exitPin.length < 4 || verifying}>{verifying ? '…' : 'Exit'}</Btn>
              <Btn variant="ghost" onClick={() => { setConfirmingExit(false); setExitPin(''); setExitError(''); }}>Cancel</Btn>
            </div>
          </div>
        </div>
      )}

      {currentLog ? (
        <div className="mb-6">
          <p className="text-xs uppercase tracking-wide mb-2" style={{ color: COLORS.inkDim }}>
            {currentLog.end ? 'Most recent log' : 'Current log'} — {fmtDate(currentLog.start)}
          </p>
          <div className="rounded-lg overflow-hidden" style={{ border: `2px solid ${COLORS.line}` }}>
            <DriverLogGrid log={currentLog} />
          </div>
        </div>
      ) : (
        <p className="text-sm mb-6" style={{ color: COLORS.inkDim }}>No logs on record.</p>
      )}

      <p className="text-xs uppercase tracking-wide mb-2" style={{ color: COLORS.inkDim }}>Last 14 days</p>
      {recentLogs.length === 0 ? (
        <p className="text-sm" style={{ color: COLORS.inkDim }}>No logs in the last 14 days.</p>
      ) : (
        <div className="space-y-2">
          {recentLogs.map((l) => (
            <div key={l.id} className="rounded-lg p-3" style={{ background: COLORS.surfaceRaised }}>
              <div className="flex items-center justify-between">
                <span className="font-semibold text-sm">{fmtDate(l.start)}</span>
                <span className="text-xs" style={{ color: l.signature ? COLORS.done : '#E07A5F' }}>{l.signature ? '✓ Signed' : 'Not signed'}</span>
              </div>
              <p className="text-xs mt-1" style={{ color: COLORS.inkDim }}>
                {driverDaySummaryLabel(l.statusChanges)}{!l.end ? ' · Still open' : ''}
              </p>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}


// Alberta requires the driver to have the last 14 days of logs on hand —

function DriverRecentLogsSection({ driver, allLogs, onBackfillOffDuty }) {

  const myLogs = allLogs.filter((l) => l.driver === driver);
  const datesWithLogs = new Set(myLogs.map((l) => l.start.slice(0, 10)));

  const recentLogs = myLogs

    .sort((a, b) => b.start.localeCompare(a.start));

function DriverLogSection({ driver, openLog, allLogs, onStart, onAddStatus, onEnd, onUpdateStatusChange, hasValidInspection, inspectionHoursRemaining, onOpenPreTrip, onOpenInspectionMode, isAdmin }) {
  const [startingLog, setStartingLog] = useState(false);
  const [odometerStartDraft, setOdometerStartDraft] = useState('');
  const [pendingStatus, setPendingStatus] = useState(null);
  const [noteDraft, setNoteDraft] = useState('');
  const [endingLog, setEndingLog] = useState(false);
  const [odometerEndDraft, setOdometerEndDraft] = useState('');
  const [signature, setSignature] = useState(null);

  const todayTotals = openLog ? computeDutyDurations(openLog.statusChanges, null) : null;

  const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const relevantLogs = (allLogs || []).filter((l) => l.driver === driver && new Date(l.start).getTime() >= sevenDaysAgo);
  const cycleOnDutyHours = relevantLogs.reduce((sum, l) => {
    const t = computeDutyDurations(l.statusChanges, l.end);
    return sum + t.driving + t.onDuty;
  }, 0);

  const currentStatus = openLog && openLog.statusChanges && openLog.statusChanges.length > 0
    ? openLog.statusChanges[openLog.statusChanges.length - 1].status
    : null;

// One-at-a-time accordion for the Admin screen — tapping a section opens it
// and closes whatever was open before, so the screen stays scannable
// instead of one long wall of every setting at once.
// Simple monthly bar chart, plain divs — no charting library needed for
// something this small. Expects { 'YYYY-MM': liters } and shows the last
// six months, oldest to newest.
function MonthlyFuelChart({ monthTotals }) {
  const now = new Date();
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
  }
  const max = Math.max(1, ...months.map((m) => monthTotals[m] || 0));
  return (
    <div className="flex items-end gap-2" style={{ height: 80 }}>
      {months.map((m) => {
        const val = monthTotals[m] || 0;
        const label = new Date(m + '-01').toLocaleDateString('en-US', { month: 'short' });
        return (
          <div key={m} className="flex-1 flex flex-col items-center justify-end h-full">
            <span className="text-xs font-mono mb-1" style={{ color: COLORS.inkDim }}>{val > 0 ? val : ''}</span>
            <div
              className="w-full rounded-t"
              style={{ height: `${Math.max(4, (val / max) * 100)}%`, background: val > 0 ? COLORS.accent : COLORS.line, minHeight: 4 }}
            />
            <span className="text-xs mt-1" style={{ color: COLORS.inkDim }}>{label}</span>
          </div>
        );
      })}
    </div>
  );
}

// Full admin editing for one driver's logged day — always available, even
// after the week is approved, since this data may need real correction
// (a missed break added back in, a wrong time fixed) more often than
// regular timesheets do.
// Top-to-bottom row order, matching the traditional paper log book layout.
const DUTY_STATUS_ROWS = ['off', 'sleeper', 'driving', 'onDuty'];

// Splits a log into one set of duty-status points per calendar day it
// touches — a real paper log book has one grid per day, and a shift
// crossing midnight carries its active status onto the next day's grid,
// picking up exactly where it left off. Also tracks the running driving/
// on-duty totals carried INTO each day, since the 13hr/15hr limits are
// per work shift, not per calendar day — a shift that goes over on day 2
// needs to show red starting from wherever it was actually crossed, not
// reset at midnight.
function computeDayGrids(log) {
  const shiftStart = new Date(log.start);
  const shiftEnd = new Date(log.end || Date.now());
  const sorted = [...(log.statusChanges || [])].sort((a, b) => new Date(a.time) - new Date(b.time));
  if (sorted.length === 0) return [];

  const days = [];
  let dayCursor = new Date(shiftStart);
  dayCursor.setHours(0, 0, 0, 0);
  let cumDriving = 0;
  let cumOnDuty = 0;

  while (dayCursor < shiftEnd) {
    const dayStart = new Date(dayCursor);
    const dayEndFull = new Date(dayCursor);
    dayEndFull.setDate(dayEndFull.getDate() + 1);
    const dayEnd = new Date(Math.min(dayEndFull.getTime(), shiftEnd.getTime()));

    let carriedStatus = sorted[0].status;
    for (const c of sorted) {
      if (new Date(c.time) <= dayStart) carriedStatus = c.status; else break;
    }
    const pointsInDay = sorted.filter((c) => new Date(c.time) > dayStart && new Date(c.time) < dayEnd);
    const points = [{ id: 'carried-' + dayStart.getTime(), status: carriedStatus, time: dayStart.toISOString(), fixed: true }, ...pointsInDay];

    days.push({ dayStart, dayEnd, points, startCumDriving: cumDriving, startCumOnDuty: cumOnDuty });

    // Advance the running totals across this day's real segments before moving on.
    const drawEnd = new Date(Math.min(dayEnd.getTime(), log.end ? Infinity : Date.now()));
    for (let i = 0; i < points.length; i++) {
      const segStart = new Date(points[i].time);
      const segEnd = i + 1 < points.length ? new Date(points[i + 1].time) : drawEnd;
      const hrs = Math.max(0, (segEnd - segStart) / 1000 / 60 / 60);
      if (points[i].status === 'driving') cumDriving += hrs;
      if (points[i].status === 'driving' || points[i].status === 'onDuty') cumOnDuty += hrs;
    }
    dayCursor = dayEndFull;
  }
  return days;
}

// One full 24-hour (midnight-to-midnight) day's grid. Drag support is only
// active when onUpdateChangeTime is provided — the compact preview passes
// none, since it's just a glance, not meant to be edited directly.
function DriverLogDayGrid({ dayStart, dayEnd, points, startCumDriving, startCumOnDuty, onUpdateChangeTime, compact, logEnded }) {
  const svgRef = useRef(null);
  const [dragging, setDragging] = useState(null);
  const [draftTime, setDraftTime] = useState(null);
  const [debugBounds, setDebugBounds] = useState(null);
  const viewWidth = 1200;
  const rowsHeight = compact ? 90 : 160;
  const axisHeight = compact ? 16 : 26;
  const height = rowsHeight + axisHeight;
  const rowHeight = rowsHeight / DUTY_STATUS_ROWS.length;

  const rangeMs = 24 * 60 * 60 * 1000;
  const rowY = (status) => DUTY_STATUS_ROWS.indexOf(status) * rowHeight + rowHeight / 2;
  const timeToX = (t) => ((new Date(t) - dayStart) / rangeMs) * viewWidth;
  const xToTime = (x) => new Date(dayStart.getTime() + (x / viewWidth) * rangeMs);

  const ticks = [];
  for (let h = 0; h < 24; h++) {
    for (let q = 0; q < 4; q++) {
      const t = new Date(dayStart.getTime() + (h * 60 + q * 15) * 60000);
      const isHour = q === 0;
      const h12 = h % 12 === 0 ? 12 : h % 12;
      ticks.push({ x: timeToX(t), isHour, label: isHour ? `${h12} ${h < 12 ? 'AM' : 'PM'}` : null });
    }
  }

  const sorted = [...points].sort((a, b) => new Date(a.time) - new Date(b.time));
  const effective = sorted.map((c) => (dragging === c.id && draftTime ? { ...c, time: draftTime } : c))
    .sort((a, b) => new Date(a.time) - new Date(b.time));

  const drawEnd = logEnded ? dayEnd : new Date(Math.min(dayEnd.getTime(), Date.now()));
  const segments = [];
  let cumDriving = startCumDriving;
  let cumOnDuty = startCumOnDuty;
  for (let i = 0; i < effective.length; i++) {
    const segStart = new Date(effective[i].time);
    const segEnd = i + 1 < effective.length ? new Date(effective[i + 1].time) : drawEnd;
    if (segEnd <= segStart) continue;
    const hrs = (segEnd - segStart) / 1000 / 60 / 60;
    if (effective[i].status === 'driving') cumDriving += hrs;
    if (effective[i].status === 'driving' || effective[i].status === 'onDuty') cumOnDuty += hrs;
    segments.push({
      id: effective[i].id,
      status: effective[i].status,
      startX: timeToX(segStart),
      endX: timeToX(segEnd),
      y: rowY(effective[i].status),
      draggable: !effective[i].fixed && !!onUpdateChangeTime,
      overLimit: cumDriving > HOS_LIMITS.driving || cumOnDuty > HOS_LIMITS.onDuty,
    });
  }

  const pointerX = (e) => {
    const svg = svgRef.current;
    const screenCTM = svg.getScreenCTM();
    if (!screenCTM) return 0;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    // Correctly accounts for any CSS transform on the SVG or its ancestors
    // (including the 90° rotation for the landscape view) — plain
    // clientX-minus-rect-left math breaks once rotation is involved, since
    // clientX/Y stay in the device's natural, un-rotated coordinate space
    // while the bounding rect reflects the rotated, on-screen appearance.
    return pt.matrixTransform(screenCTM.inverse()).x;
  };

  const draftTimeRef = useRef(null);

  const handlePointerDown = (e, changeId) => {
    e.preventDefault();
    setDragging(changeId);
  };

  // Window-level listeners, attached only while actively dragging — more
  // reliable than element-level pointer capture turned out to be here,
  // since it doesn't depend on any specific DOM node keeping hold of the
  // pointer inside the rotated container. A ref tracks the live position
  // alongside the state, since the "pointer up" handler is created once
  // when the drag starts and would otherwise only ever see that starting
  // value, not whatever the position ends up being.
  useEffect(() => {
    if (!dragging || !svgRef.current) return;
    const onMove = (e) => {
      e.preventDefault();
      const idx = sorted.findIndex((c) => c.id === dragging);
      if (idx <= 0) {
        setDebugBounds(`idx=${idx} (blocked, no earlier point found) sortedLen=${sorted.length}`);
        return;
      }
      const prevTime = new Date(sorted[idx - 1].time).getTime();
      const nextTime = idx + 1 < sorted.length ? new Date(sorted[idx + 1].time).getTime() : drawEnd.getTime();
      const minX = Math.max(0, timeToX(new Date(prevTime + 60000)));
      const maxX = Math.min(viewWidth, timeToX(new Date(nextTime - 60000)));
      const rawX = pointerX(e);
      const x = Math.max(minX, Math.min(maxX, rawX));
      const newTime = xToTime(x).toISOString();
      setDebugBounds(`idx=${idx} prev=${new Date(prevTime).toLocaleTimeString()} minX=${minX.toFixed(0)} maxX=${maxX.toFixed(0)} rawX=${rawX.toFixed(0)} clampedX=${x.toFixed(0)}`);
      draftTimeRef.current = newTime;
      setDraftTime(newTime);

      // The grid is wider than the screen now, so dragging toward an edge
      // needs to actually scroll the view — otherwise a finger simply runs
      // out of physical screen before it reaches an earlier/later point
      // that's still logically draggable, off to the side and out of view.
      const scrollContainer = svgRef.current && svgRef.current.parentElement;
      if (scrollContainer) {
        const rect = scrollContainer.getBoundingClientRect();
        const edgeZone = 50;
        const maxScrollSpeed = 18;
        if (e.clientX < rect.left + edgeZone) {
          const strength = (edgeZone - (e.clientX - rect.left)) / edgeZone;
          scrollContainer.scrollLeft -= maxScrollSpeed * Math.max(0.2, strength);
        } else if (e.clientX > rect.right - edgeZone) {
          const strength = (edgeZone - (rect.right - e.clientX)) / edgeZone;
          scrollContainer.scrollLeft += maxScrollSpeed * Math.max(0.2, strength);
        }
      }
    };
    const onUp = () => {
      if (draftTimeRef.current) onUpdateChangeTime(dragging, draftTimeRef.current);
      draftTimeRef.current = null;
      setDragging(null);
      setDraftTime(null);
    };
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
    };
  }, [dragging]);

  return (
    <React.Fragment>
      {!compact && dragging && (
        <div style={{ position: 'fixed', top: 60, left: 8, right: 8, zIndex: 300, background: 'rgba(0,0,0,0.85)', color: '#fff', fontSize: 11, padding: 8, borderRadius: 6, fontFamily: 'monospace' }}>
          {debugBounds || 'DEBUG: waiting for first move event...'}
        </div>
      )}
      <svg
        ref={svgRef}
        viewBox={`0 0 ${viewWidth} ${height}`}
        className={compact ? 'w-full h-full rounded-lg' : 'rounded-lg'}
        style={compact
          ? { background: '#fff', touchAction: 'none', display: 'block' }
          : { background: '#fff', touchAction: 'none', display: 'block', width: 1500, height: (1500 / viewWidth) * height }}
      >
        {DUTY_STATUS_ROWS.map((status, i) => (
        <g key={status}>
          <line x1={0} y1={i * rowHeight} x2={viewWidth} y2={i * rowHeight} stroke="#ddd" strokeWidth={1} />
          <text x={4} y={i * rowHeight + (compact ? 9 : 14)} fontSize={compact ? 8 : 13} fill="#666">{DUTY_STATUS_LABELS[status]}</text>
        </g>
      ))}
      <line x1={0} y1={rowsHeight} x2={viewWidth} y2={rowsHeight} stroke="#ddd" strokeWidth={1} />

      {ticks.map((tick, i) => (
        <g key={i}>
          <line x1={tick.x} y1={rowsHeight} x2={tick.x} y2={rowsHeight + (tick.isHour ? (compact ? 6 : 10) : (compact ? 3 : 5))} stroke={tick.isHour ? '#999' : '#ccc'} strokeWidth={1} />
          {tick.isHour && !compact && <text x={tick.x} y={rowsHeight + 26} fontSize={11} fill="#666" textAnchor="middle">{tick.label}</text>}
        </g>
      ))}

      {segments.map((seg) => (
        <line key={seg.id + '-seg'} x1={seg.startX} y1={seg.y} x2={seg.endX} y2={seg.y} stroke={seg.overLimit ? '#E07A5F' : '#1B1F19'} strokeWidth={compact ? 2 : 4} />
      ))}

      {segments.slice(1).map((seg, i) => (
        <g key={seg.id + '-connector'}>
          <line
            x1={seg.startX} y1={segments[i].y} x2={seg.startX} y2={seg.y}
            stroke={dragging === seg.id ? '#7FA37E' : (seg.overLimit ? '#E07A5F' : '#1B1F19')}
            strokeWidth={dragging === seg.id ? (compact ? 3 : 6) : (compact ? 1.5 : 3)}
          />
          {seg.draggable && segments[i].y === seg.y && (
            // Same status on both sides means the line above draws with
            // zero visual height — nothing to actually see. This small
            // marker is what makes an otherwise-invisible draggable point
            // discoverable at all.
            <circle
              cx={seg.startX} cy={seg.y} r={compact ? 3 : 5}
              fill={dragging === seg.id ? '#7FA37E' : '#999'}
            />
          )}
          {seg.draggable && (() => {
            const hitWidth = compact ? 14 : 28;
            const minHitHeight = compact ? 20 : 36; // a same-status transition draws with zero visual height — still needs a real, grabbable area
            const top = Math.min(segments[i].y, seg.y) - minHitHeight / 2;
            const actualHeight = Math.max(minHitHeight, Math.abs(seg.y - segments[i].y) + minHitHeight);
            return (
              <rect
                x={seg.startX - hitWidth / 2} y={top} width={hitWidth} height={actualHeight}
                fill="transparent"
                style={{ cursor: 'grab', touchAction: 'none' }}
                onPointerDown={(e) => handlePointerDown(e, seg.id)}
              />
            );
          })()}
        </g>
      ))}
      </svg>
    </React.Fragment>
  );
}

// The compact preview shown inline; tapping it opens a full-screen,
// landscape-rotated view with day-to-day navigation for shifts spanning
// more than one calendar day, and full drag-to-correct on every real point.
function DriverLogGrid({ log, onUpdateChangeTime }) {
  const [expanded, setExpanded] = useState(false);
  const [dayIndex, setDayIndex] = useState(0);
  const dayGrids = computeDayGrids(log);

  if (dayGrids.length === 0) {
    return <p className="text-xs" style={{ color: COLORS.inkDim }}>No status changes yet — the grid will fill in as they're logged.</p>;
  }
  const previewDay = dayGrids[dayGrids.length - 1];

  return (
    <div>
      <button onClick={() => { setDayIndex(dayGrids.length - 1); setExpanded(true); }} className="w-full text-left" style={{ height: 100 }}>
        <DriverLogDayGrid
          dayStart={previewDay.dayStart} dayEnd={previewDay.dayEnd} points={previewDay.points}
          startCumDriving={previewDay.startCumDriving} startCumOnDuty={previewDay.startCumOnDuty}
          compact
          logEnded={!!log.end}
        />
        <p className="text-xs mt-1 text-center" style={{ color: COLORS.accent }}>Tap to expand{dayGrids.length > 1 ? ' — spans multiple days' : ''}</p>
      </button>

      {expanded && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 200, background: '#fff', display: 'flex', flexDirection: 'column' }}>
          <div className="flex items-center justify-between p-3" style={{ flexShrink: 0, borderBottom: '1px solid #ddd', paddingTop: 'calc(env(safe-area-inset-top, 0px) + 12px)' }}>
            <button
              onClick={() => setDayIndex(Math.max(0, dayIndex - 1))}
              disabled={dayIndex === 0}
              style={{ fontSize: 20, padding: '4px 12px', opacity: dayIndex === 0 ? 0.3 : 1 }}
            >
              ←
            </button>
            <span style={{ fontWeight: 700, fontSize: 14, color: '#1B1F19' }}>
              {fmtDate(dayGrids[dayIndex].dayStart.toISOString())}
              {dayGrids.length > 1 ? ` (day ${dayIndex + 1} of ${dayGrids.length})` : ''}
            </span>
            <button
              onClick={() => setDayIndex(Math.min(dayGrids.length - 1, dayIndex + 1))}
              disabled={dayIndex === dayGrids.length - 1}
              style={{ fontSize: 20, padding: '4px 12px', opacity: dayIndex === dayGrids.length - 1 ? 0.3 : 1 }}
            >
              →
            </button>
            <button onClick={() => setExpanded(false)} style={{ fontSize: 20, padding: '4px 12px', marginLeft: 12, fontWeight: 700, color: '#1B1F19' }}>✕</button>
          </div>
          <div style={{ flex: 1, overflowX: 'auto', overflowY: 'hidden', WebkitOverflowScrolling: 'touch' }}>
            <DriverLogDayGrid
              dayStart={dayGrids[dayIndex].dayStart} dayEnd={dayGrids[dayIndex].dayEnd} points={dayGrids[dayIndex].points}
              startCumDriving={dayGrids[dayIndex].startCumDriving} startCumOnDuty={dayGrids[dayIndex].startCumOnDuty}
              onUpdateChangeTime={onUpdateChangeTime}
              logEnded={!!log.end}
            />
          </div>
          <p className="text-xs text-center p-2" style={{ color: '#666', flexShrink: 0 }}>Scroll sideways to see the full day. Drag a duty change line left or right to correct when it happened.</p>
        </div>
      )}
    </div>
  );
}

// Paper-friendly rendering of a full HOS log — used by both the driver's
// own current-day view and the admin review folder. Deliberately separate
// from DriverLogGrid/DriverLogEditCard, which are built for on-screen
// editing (compact preview, tap-to-expand, drag handles): none of that
// works on paper, so this renders every day's grid at full size, un-draggable,
// stacked in order, alongside a plain-text duty summary.
function PrintableDriverLog({ log, driverName }) {
  const dayGrids = computeDayGrids(log);
  const sorted = [...(log.statusChanges || [])].sort((a, b) => new Date(a.time) - new Date(b.time));
  const totals = computeDutyDurations(log.statusChanges, log.end);

  return (
    <div style={{ background: '#fff', color: '#1B1F19', padding: 16 }}>
      <div className="flex items-start justify-between mb-3">
        <div>
          <p style={{ fontWeight: 700, fontSize: 16 }}>{driverName || log.driver}</p>
          <p style={{ fontSize: 12, color: '#555' }}>{fmtDate(log.start)}{!log.end ? ' · Still open' : ''}</p>
        </div>
        {(log.odometerStart || log.odometerEnd) && (
          <div style={{ fontSize: 12, textAlign: 'right', color: '#555' }}>
            {log.odometerStart && <p>Odometer start: {log.odometerStart}</p>}
            {log.odometerEnd && <p>Odometer end: {log.odometerEnd}</p>}
          </div>
        )}
      </div>

      {dayGrids.length === 0 ? (
        <p style={{ fontSize: 12, color: '#555' }}>No status changes logged.</p>
      ) : (
        dayGrids.map((d, i) => (
          <div key={i} style={{ marginBottom: 12 }}>
            {dayGrids.length > 1 && <p style={{ fontSize: 11, fontWeight: 600, marginBottom: 4 }}>{fmtDate(d.dayStart.toISOString())} (day {i + 1} of {dayGrids.length})</p>}
            <DriverLogDayGrid
              dayStart={d.dayStart} dayEnd={d.dayEnd} points={d.points}
              startCumDriving={d.startCumDriving} startCumOnDuty={d.startCumOnDuty}
              logEnded={!!log.end}
            />
          </div>
        ))
      )}

      <div className="grid grid-cols-4 gap-2 my-3" style={{ fontSize: 11 }}>
        <div><span style={{ color: '#555' }}>Off duty</span><br /><strong>{fmtHours(totals.off)}</strong></div>
        <div><span style={{ color: '#555' }}>Sleeper</span><br /><strong>{fmtHours(totals.sleeper)}</strong></div>
        <div><span style={{ color: '#555' }}>Driving</span><br /><strong>{fmtHours(totals.driving)}</strong></div>
        <div><span style={{ color: '#555' }}>On duty (not driving)</span><br /><strong>{fmtHours(totals.onDuty)}</strong></div>
      </div>

      <table style={{ width: '100%', fontSize: 11, borderCollapse: 'collapse' }}>
        <thead>
          <tr style={{ color: '#555', textAlign: 'left' }}>
            <th style={{ padding: '4px 6px', borderBottom: '1px solid #ccc' }}>Time</th>
            <th style={{ padding: '4px 6px', borderBottom: '1px solid #ccc' }}>Status</th>
            <th style={{ padding: '4px 6px', borderBottom: '1px solid #ccc' }}>Note</th>
          </tr>
        </thead>
        <tbody>
          {sorted.map((c) => (
            <tr key={c.id}>
              <td style={{ padding: '4px 6px', borderBottom: '1px solid #eee', whiteSpace: 'nowrap' }}>{fmtDate(c.time)} {fmtTime(c.time)}</td>
              <td style={{ padding: '4px 6px', borderBottom: '1px solid #eee' }}>{DUTY_STATUS_LABELS[c.status]}</td>
              <td style={{ padding: '4px 6px', borderBottom: '1px solid #eee' }}>{c.note || ''}</td>
            </tr>
          ))}
        </tbody>
      </table>

      <div style={{ marginTop: 16 }}>
        {log.signature ? (
          <div>
            <p style={{ fontSize: 11, color: '#555', marginBottom: 4 }}>Driver signature:</p>
            <img src={log.signature} alt="Signature" style={{ height: 50, background: '#fff' }} />
          </div>
        ) : (
          <p style={{ fontSize: 11, color: '#555' }}>Not yet signed.</p>
        )}
      </div>
    </div>
  );
}

function DriverLogEditCard({ log, onSave, onDelete, onAddMissed, onUpdateChange, onRemoveChange, onCancel, isAdmin }) {
  const [odometerStart, setOdometerStart] = useState(log.odometerStart || '');
  const [odometerEnd, setOdometerEnd] = useState(log.odometerEnd || '');
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [addingMissed, setAddingMissed] = useState(false);
  const [missedStatus, setMissedStatus] = useState('off');
  const [missedTime, setMissedTime] = useState('');
  const [missedNote, setMissedNote] = useState('');
  const [editingChangeId, setEditingChangeId] = useState(null);

  const sorted = [...(log.statusChanges || [])].sort((a, b) => new Date(a.time) - new Date(b.time));

  return (
    <div className="rounded-lg p-4" style={{ background: COLORS.surface, border: `2px solid ${COLORS.accent}` }}>
      <div className="flex items-center justify-between mb-3 no-print">
        <p className="font-display font-semibold">{fmtDate(log.start)} — {log.driver}</p>
        {isAdmin && (
          <button
            onClick={() => window.print()}
            className="font-display text-xs uppercase tracking-wider font-semibold px-3 py-1.5 rounded-lg transition-all hover:scale-105"
            style={{ color: COLORS.accent, background: COLORS.surfaceRaised, border: `1px solid ${COLORS.line}` }}
          >
            🖨️ Print
          </button>
        )}
      </div>
      {isAdmin && (
        <PrintPortal>
          <PrintableDriverLog log={log} driverName={log.driver} />
        </PrintPortal>
      )}

      <div className="grid grid-cols-2 gap-3 mb-4">
        <label className="block">
          <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Odometer start</span>
          <TextInput type="number" inputMode="numeric" value={odometerStart} onChange={(e) => setOdometerStart(e.target.value)} />
        </label>
        <label className="block">
          <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Odometer end</span>
          <TextInput type="number" inputMode="numeric" value={odometerEnd} onChange={(e) => setOdometerEnd(e.target.value)} />
        </label>
      </div>

      <p className="text-xs uppercase tracking-wide mb-2" style={{ color: COLORS.accent }}>Grid</p>
      <div className="mb-4">
        <DriverLogGrid log={log} onUpdateChangeTime={(changeId, newTime) => onUpdateChange(changeId, { time: newTime })} />
      </div>

      <p className="text-xs uppercase tracking-wide mb-2" style={{ color: COLORS.accent }}>Status changes</p>
      <div className="space-y-2 mb-3">
        {sorted.map((c) =>
          editingChangeId === c.id ? (
            <DriverStatusChangeEditRow
              key={c.id}
              change={c}
              onSave={(patch) => { onUpdateChange(c.id, patch); setEditingChangeId(null); }}
              onCancel={() => setEditingChangeId(null)}
            />
          ) : (
            <div key={c.id} className="rounded-lg p-2 flex items-center justify-between gap-2" style={{ background: COLORS.surfaceRaised }}>
              <div className="text-xs">
                <span className="font-mono">{fmtTime(c.time)}</span> — {DUTY_STATUS_LABELS[c.status]}
                {c.note && <span style={{ color: COLORS.inkDim }}> · {c.note}</span>}
              </div>
              <div className="flex gap-2 shrink-0">
                <button onClick={() => setEditingChangeId(c.id)} className="text-xs underline" style={{ color: COLORS.accent }}>Edit</button>
                <button onClick={() => onRemoveChange(c.id)} className="text-xs underline" style={{ color: '#E07A5F' }}>Remove</button>
              </div>
            </div>
          )
        )}
      </div>

      {addingMissed ? (
        <div className="rounded-lg p-3 mb-4" style={{ background: COLORS.surfaceRaised }}>
          <p className="text-xs mb-2" style={{ color: COLORS.inkDim }}>Add a status he missed logging at the time:</p>
          <select
            value={missedStatus}
            onChange={(e) => setMissedStatus(e.target.value)}
            className="w-full rounded-lg px-3 py-2 text-sm mb-2 focus:outline-none focus:ring-2"
            style={{ background: COLORS.surface, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
          >
            {Object.entries(DUTY_STATUS_LABELS).map(([status, label]) => <option key={status} value={status}>{label}</option>)}
          </select>
          <input
            type="datetime-local"
            value={missedTime}
            onChange={(e) => setMissedTime(e.target.value)}
            className="w-full rounded-lg px-3 py-2 text-sm mb-2 font-mono focus:outline-none focus:ring-2"
            style={{ background: COLORS.surface, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
          />
          <TextInput value={missedNote} onChange={(e) => setMissedNote(e.target.value)} placeholder="Note (optional)" className="w-full mb-2" />
          <div className="flex gap-2">
            <Btn
              onClick={() => {
                if (!missedTime) return;
                onAddMissed(missedStatus, missedTime, missedNote);
                setAddingMissed(false); setMissedTime(''); setMissedNote('');
              }}
              disabled={!missedTime}
            >
              Add it
            </Btn>
            <Btn variant="ghost" onClick={() => setAddingMissed(false)}>Cancel</Btn>
          </div>
        </div>
      ) : (
        <button onClick={() => setAddingMissed(true)} className="text-xs underline mb-4" style={{ color: COLORS.accent }}>+ Add a missed status</button>
      )}

      {confirmDelete ? (
        <div className="rounded-lg p-3 mb-3" style={{ background: COLORS.surfaceRaised }}>
          <p className="text-sm mb-2" style={{ color: COLORS.inkDim }}>Delete this whole log? This can't be undone.</p>
          <div className="flex gap-2">
            <Btn variant="danger" onClick={onDelete}>Yes, delete it</Btn>
            <Btn variant="ghost" onClick={() => setConfirmDelete(false)}>Cancel</Btn>
          </div>
        </div>
      ) : (
        <div className="flex gap-2 flex-wrap">
          <Btn onClick={() => onSave({ odometerStart, odometerEnd })}>Save changes</Btn>
          <Btn variant="ghost" onClick={onCancel}>Cancel</Btn>
          <button onClick={() => setConfirmDelete(true)} className="text-xs underline ml-auto" style={{ color: '#E07A5F' }}>Delete log</button>
        </div>
      )}
    </div>
  );
}

function DriverStatusChangeEditRow({ change, onSave, onCancel }) {
  const [status, setStatus] = useState(change.status);
  const [time, setTime] = useState(() => new Date(change.time).toISOString().slice(0, 16));
  const [note, setNote] = useState(change.note || '');
  return (

        {hours !== null && (

// --- PNG metadata embedding — lets a map's georeferencing data travel
// inside the image file itself (a standard tEXt chunk, invisible to any
// image viewer), instead of needing a separate JSON file alongside it.
// Verified against a real PNG round-trip before relying on it here.
const PNG_CRC_TABLE = (() => {
  const table = [];
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c;
  }
  return table;
})();
function png_crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = PNG_CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function embedJsonInPng(arrayBuffer, jsonString) {
  const bytes = new Uint8Array(arrayBuffer);
  const ihdrEnd = 8 + 4 + 4 + 13 + 4; // signature + IHDR's own length+type+data+crc — IHDR is always first
  const textData = new TextEncoder().encode('georef\0' + jsonString);
  const typeBytes = new TextEncoder().encode('tEXt');
  const chunkBody = new Uint8Array(typeBytes.length + textData.length);
  chunkBody.set(typeBytes, 0);
  chunkBody.set(textData, typeBytes.length);
  const crc = png_crc32(chunkBody);
  const newChunk = new Uint8Array(4 + 4 + textData.length + 4);
  new DataView(newChunk.buffer).setUint32(0, textData.length, false);
  newChunk.set(typeBytes, 4);
  newChunk.set(textData, 8);
  new DataView(newChunk.buffer).setUint32(8 + textData.length, crc, false);
  const result = new Uint8Array(bytes.length + newChunk.length);
  result.set(bytes.slice(0, ihdrEnd), 0);
  result.set(newChunk, ihdrEnd);
  result.set(bytes.slice(ihdrEnd), ihdrEnd + newChunk.length);
  return result;
}

        let next = o;
        // Always reprocess, whether description is still a plain string
        // (never touched) or already an object with empty/broken
        // translations (created while the backend was still broken) —
        // pull out the original text either way and retranslate.
        const origText = typeof o.description === 'string' ? o.description : (o.description ? o.description.text : '');
        if (origText && origText.trim()) {
          const field = await buildLocalizedField(origText, 'en');
          if (field.translations && Object.keys(field.translations).length > 0) successCount++;
          else failCount++;
          next = { ...next, description: field };
        }
        const existingChecklists = getChecklists(o);
        if (existingChecklists.length > 0) {
          const updatedChecklists = await Promise.all(existingChecklists.map(async (c) => {
            const result = await translateChecklistContent(c.templateName, c.items.map((i) => i.text), c.nameOrigLang || 'en');
            if (result.nameTranslations && Object.keys(result.nameTranslations).length > 0) successCount++;
            else failCount++;
            return { ...c, ...result };
          }));
          next = { ...next, checklists: updatedChecklists, checklist: null };
        }
        return next;
      }));
      await bulkSaveOrders(updatedOrders);
      alert(`Done — ${successCount} translated successfully${failCount > 0 ? `, ${failCount} failed (check your connection and try again for those)` : ''}.`);
    } catch (err) {
      alert('Something went wrong: ' + err.message);
    } finally {
      setMigratingTranslations(false);
    }
  };

  // Translates a checklist's name and every item into the other of
  // {en, es} at save time (Plautdietsch has no automatic translation
  // available — see buildLocalizedField for the same note). Item
  // translations are stored by POSITION (an array matching `items`), not
  // by the item's own text — some items contain a "/" (like "Check/top up
  // a/c"), which Firebase flatly refuses as an object key.
  const translateChecklistContent = async (name, items, currentLang) => {
    if (currentLang !== 'en' && currentLang !== 'es') {
      return { nameOrigLang: currentLang, nameTranslations: {}, itemTranslations: [] };
    }
    const other = currentLang === 'en' ? 'es' : 'en';
    const [nameTranslated, itemTranslatedList] = await Promise.all([
      translateText(name, other),
      Promise.all(items.map((it) => translateText(it, other))),
    ]);
    const itemTranslations = items.map((it, i) => (itemTranslatedList[i] ? { [other]: itemTranslatedList[i] } : null));
    return {
      nameOrigLang: currentLang,
      nameTranslations: nameTranslated ? { [other]: nameTranslated } : {},
      itemTranslations,
    };
  };

  const addTemplate = async (name, itemsText) => {
    const trimmedName = name.trim();
    const items = itemsText.split('\n').map((l) => l.trim()).filter(Boolean);
    if (!trimmedName || items.length === 0) return;
    const { nameOrigLang, nameTranslations, itemTranslations } = await translateChecklistContent(trimmedName, items, lang);
    const newTpl = { id: uid(), name: trimmedName, items, nameOrigLang, nameTranslations, itemTranslations };
    await persistTemplates([...templates, newTpl]);
    setShowNewTemplate(false);
  };

  const deleteTemplate = async (id) => {
    await persistTemplates(templates.filter((t) => t.id !== id));
    setConfirmDeleteTemplate(null);
  };

  const updateTemplate = async (id, name, itemsText) => {
    const trimmedName = name.trim();
    const items = itemsText.split('\n').map((l) => l.trim()).filter(Boolean);
    if (!trimmedName || items.length === 0) return;
    const { nameOrigLang, nameTranslations, itemTranslations } = await translateChecklistContent(trimmedName, items, lang);
    const next = templates.map((t) => (t.id === id ? { ...t, name: trimmedName, items, nameOrigLang, nameTranslations, itemTranslations } : t));
    await persistTemplates(next);
    setEditingTemplateId(null);
  };

  // Adds (or fixes) just the Plautdietsch wording for a template's name and
  // items, without touching the original text or the English/Spanish
  // translations already there — since Plautdietsch can't be auto-translated,
  // this is the manual path for filling it in.
  const updateTemplatePdt = async (templateId, namePdt, itemPdtList) => {
    const next = templates.map((tpl) => {
      if (tpl.id !== templateId) return tpl;
      const nameTranslations = { ...(tpl.nameTranslations || {}) };
      if (namePdt.trim()) nameTranslations.pdt = namePdt.trim(); else delete nameTranslations.pdt;
      const itemTranslations = (tpl.items || []).map((_, i) => {
        const existing = { ...((tpl.itemTranslations && tpl.itemTranslations[i]) || {}) };
        const val = itemPdtList[i];
        if (val && val.trim()) existing.pdt = val.trim(); else delete existing.pdt;
        return Object.keys(existing).length > 0 ? existing : null;
      });
      return { ...tpl, nameTranslations, itemTranslations };
    });
    await persistTemplates(next);
  };

  const updateChecklistPdt = async (orderId, checklistId, namePdt, itemPdtList) => {
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const nextChecklists = getChecklists(order).map((c) => {
      if (c.id !== checklistId) return c;
      const nameTranslations = { ...(c.nameTranslations || {}) };
      if (namePdt.trim()) nameTranslations.pdt = namePdt.trim(); else delete nameTranslations.pdt;
      const itemTranslations = (c.items || []).map((_, i) => {
        const existing = { ...((c.itemTranslations && c.itemTranslations[i]) || {}) };
        const val = itemPdtList[i];
        if (val && val.trim()) existing.pdt = val.trim(); else delete existing.pdt;
        return Object.keys(existing).length > 0 ? existing : null;
      });
      return { ...c, nameTranslations, itemTranslations };
    });
    await updateOrder(orderId, { checklists: nextChecklists, checklist: null });
  };

  // A work order can hold several checklists at once (e.g. the standard
  // summer checklist plus an off-season repair checklist). Older orders
  // saved before this existed have a single `checklist` field instead of
  // a `checklists` array — this helper reads either shape transparently.
  const getChecklists = (order) => {
    if (order.checklists) return order.checklists;
    if (order.checklist) return [{ id: 'legacy', ...order.checklist }];
    return [];
  };

  // Who's "worked on" a job is now tracked automatically (see
  // withWorkedOnBy above) rather than manually assigned. Older orders from
  // before that existed still have the old assignedMechanics/assignedMechanic
  // fields — this reads whichever shape an order happens to have.
  const getAssignedMechanics = (order) => {
    if (order.workedOnBy) return order.workedOnBy;
    if (order.assignedMechanics) return order.assignedMechanics;
    if (order.assignedMechanic) return [order.assignedMechanic];
    return [];
  };

  const attachChecklist = async (orderId, templateId) => {
    const template = templates.find((t) => t.id === templateId);
    if (!template) return;
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const checklist = {
      id: uid(),
      templateId: template.id,
      templateName: template.name,
      nameOrigLang: template.nameOrigLang,
      nameTranslations: template.nameTranslations,
      itemTranslations: template.itemTranslations,
      items: template.items.map((text) => ({ id: uid(), text, checked: false, checkedBy: null, checkedAt: null })),
    };
    const nextChecklists = [...getChecklists(order), checklist];
    await updateOrder(orderId, { checklists: nextChecklists, checklist: null });
    setAttachTemplateId('');
  };

  const detachChecklist = async (orderId, checklistId) => {
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const nextChecklists = getChecklists(order).filter((c) => c.id !== checklistId);
    await updateOrder(orderId, { checklists: nextChecklists, checklist: null });
  };

  const createAdHocChecklist = async (orderId, name, itemsText, saveAsTemplate) => {
    const trimmedName = name.trim();
    const items = itemsText.split('\n').map((l) => l.trim()).filter(Boolean);
    if (!trimmedName || items.length === 0) return;
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const { nameOrigLang, nameTranslations, itemTranslations } = await translateChecklistContent(trimmedName, items, lang);
    const checklist = {
      id: uid(),

    if (saveAsTemplate) {

  const toggleChecklistItem = async (orderId, checklistId, itemId) => {

    const nextChecklists = getChecklists(order).map((c) => {
      if (c.id !== checklistId) return c;
      const items = c.items.map((it) => {
        if (it.id !== itemId) return it;
        const nowChecked = !it.checked;
        return {

  const updateOrderChecklist = async (orderId, checklistId, name, itemsText) => {

    const lines = itemsText.split('\n').map((l) => l.trim()).filter(Boolean);
    if (!trimmedName || lines.length === 0) return;
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const existing = getChecklists(order).find((c) => c.id === checklistId);
    const existingByText = {};
    (existing ? existing.items : []).forEach((it) => { existingByText[it.text] = it; });
    // Keep the checked state for any item whose text didn't change; new/edited
    // lines start fresh so a corrected item doesn't stay marked done by mistake.
    const items = lines.map((text) => existingByText[text] || { id: uid(), text, checked: false, checkedBy: null, checkedAt: null });
    const { nameOrigLang, nameTranslations, itemTranslations } = await translateChecklistContent(trimmedName, lines, lang);
    const nextChecklists = getChecklists(order).map((c) =>
      c.id === checklistId ? { ...c, templateName: trimmedName, items, nameOrigLang, nameTranslations, itemTranslations } : c
    );
    await updateOrder(orderId, { checklists: nextChecklists, checklist: null });
    setEditingOrderChecklistId(null);
  };

  const addMechanic = () => {
    const name = newMechanicName.trim();
    if (!name || mechanics.includes(name)) return;
    setNewMechanicName('');
    setPinError('');
    setPinInput('');
    // New mechanics set up a PIN before their name is added to the board —
    // persistMeta happens once PIN setup completes, in submitPin().
    setPinModal({ mode: 'setup', mechanic: name, stage: 'first', firstEntry: '' });
  };

  const isAdmin = admins.includes(currentMechanic);

  // ---- Unified Shift screen helpers ----
  // Role (employee/foreman/admin) — falls back to the existing /admins array
  // for anyone who predates this system, so nobody's access silently changes.
  const roleFor = (name) => {
    const slug = slugForMechanic(name);
    if (roles[slug]) return roles[slug];
    if (admins.includes(name)) return 'admin';
    return 'employee';
  };
  const isForeman = !!currentMechanic && roleFor(currentMechanic) === 'foreman';
  const isSafety = !!currentMechanic && roleFor(currentMechanic) === 'safety';
  const setRoleFor = async (name, role) => {
    await firebase.database().ref('roles/' + slugForMechanic(name)).set(role);
    // /admins is the actual access-control source of truth everywhere else
    // in the app (isAdmin, "Admins only" screens) — it must stay in sync in
    // BOTH directions, or demoting someone here would silently fail to
    // actually revoke their access.
    if (role === 'admin' && !admins.includes(name)) {
      await saveAdmins([...admins, name]);
    } else if (role !== 'admin' && admins.includes(name)) {
      await saveAdmins(admins.filter((a) => a !== name));
    }
  };
  // Job type decides which Shift layout someone gets. Defaults to 'mechanic'
  // for anyone unassigned — that covers your whole existing crew automatically.
  // Whichever unit someone's assigned to — a service truck or a production
  // machine. Defaults to empty (no unit), NOT the first truck on the list —
  // a mechanic with nothing assigned should show as unassigned, not get
  // silently tagged with someone else's truck.
  const assignedUnitFor = (name) => unitAssignments[slugForMechanic(name)] || '';
  const setAssignedUnit = async (name, unit) => {
    await firebase.database().ref('unitAssignments/' + slugForMechanic(name)).set(unit).catch(() => alert("Couldn't save that assignment — check your signal and try again."));
  };
  // Toggles one unit in or out of someone's list of alternate jobs — admin
  // can check as many as apply. An empty resulting list removes the field
  // entirely (rather than storing an empty array) so this person cleanly
  // goes back to having no alternates at all.
  const toggleAltAssignedUnit = async (name, unit) => {
    const slug = slugForMechanic(name);
    const current = altListFor(name);
    const next = current.includes(unit) ? current.filter((u) => u !== unit) : [...current, unit];
    const ref = firebase.database().ref('altUnitAssignments/' + slug);
    await (next.length > 0 ? ref.set(next) : ref.remove()).catch(() => alert("Couldn't save that assignment — check your signal and try again."));
  };
  // Production types — a unit tagged with one of these gets the full
  // production Shift screen (tree counts, spruce/aspen, etc.) and counts as
  // 'production' for job type.
  const MACHINE_TYPE_LABELS = {
    buncher: 'Buncher', processor: 'Processor', skidder: 'Skidder', loader: 'Log Loader',
    crawler: 'Crawler', grader: 'Grader', winch: 'Winch Truck', fuel: 'Fuel Truck',
  };
  // Support equipment — tagging a unit with one of these is purely for
  // organizing the unit list. Anyone assigned to one of these still gets the
  // plain mechanic clock in/out, same as having no unit at all.
  const SUPPORT_TYPE_LABELS = {
    truck: 'Service Truck', pickup: 'Pickup', trailer: 'Trailer', lightTower: 'Light Tower',
  };
  // Job type is now fully derived from the unit itself — no separate stored
  // choice. Only an actual production-type unit makes someone 'production';
  // a truck/pickup/trailer/light tower (or nothing at all) is 'mechanic' —
  // this is also why "mechanic" is the safe default for anyone unassigned,
  // matching the whole existing crew automatically.
  const jobTypeFor = (name) => (MACHINE_TYPE_LABELS[machineType(assignedUnitFor(name), unitTypes)] ? 'production' : 'mechanic');
  // Alternate-job helpers — for the few people who regularly switch between
  // more than one job (e.g. a mechanic who also drives the winch truck, or
  // covers a second machine sometimes). hasAltRole gates whether that
  // person ever sees a choice at all; everyone without any alternates set
  // never sees any of this.
  // Safe read for alternate jobs — anyone whose alternate was set up before
  // this became a list is still storing a plain string in Firebase, not an
  // array, since the format changed but existing data didn't get migrated.
  // Normalizing here means both the old and new shapes work correctly,
  // rather than crashing the moment old data gets touched.
  const altListFor = (name) => {
    const v = altUnitAssignments[slugForMechanic(name)];
    if (Array.isArray(v)) return v;
    if (v) return [v];
    return [];
  };
  const hasAltRole = (name) => altListFor(name).length > 0;
  const jobTypeForValue = (value) => (value === '__mechanic__' ? 'mechanic' : (MACHINE_TYPE_LABELS[machineType(value, unitTypes)] ? 'production' : 'mechanic'));
  // The full list of options someone with alternates can choose from today
  // — their primary first, then each configured alternate — each resolved
  // to a real label and job type, ready to drive a dropdown directly.
  const altOptionsFor = (name) => {
    const primaryUnit = assignedUnitFor(name);
    const primaryValue = primaryUnit || '__mechanic__';
    const primaryLabel = primaryUnit ? `🚜 ${primaryUnit}` : '🔧 Mechanic';
    const alternates = altListFor(name);
    const altOpts = alternates
      .filter((v) => v !== primaryValue) // don't double-list their primary if it was also checked as an alternate
      .map((v) => ({ value: v, label: v === '__mechanic__' ? '🔧 Mechanic' : `🚜 ${v}`, jobType: jobTypeForValue(v) }));
    return [{ value: primaryValue, label: primaryLabel, jobType: jobTypeForValue(primaryValue) }, ...altOpts];
  };

  // Where someone lands immediately after signing in. Production employees
  // go straight to their Shift screen; admins land on the Admin screen
  // itself, since that's effectively their home base now; everyone else
  // (mechanics) lands on the work order dashboard, their daily tool.
  const landingScreenFor = (name) => {
    if (admins.includes(name)) return 'admin';
    return jobTypeFor(name) === 'production' ? 'shift' : 'dashboard';
  };

  // Groups the crew by job/machine type for any dropdown that needs to show
  // everyone together but organized — Mechanics first, then one group per
  // machine type, only including types that actually have someone on them.
  const groupedEmployees = () => {
    const sorted = mechanics.slice().sort((a, b) => a.localeCompare(b));
    const groups = [{ label: 'Mechanics', names: sorted.filter((m) => jobTypeFor(m) === 'mechanic') }];
    Object.entries(MACHINE_TYPE_LABELS).forEach(([type, label]) => {
      const names = sorted.filter((m) => jobTypeFor(m) === 'production' && machineType(assignedUnitFor(m), unitTypes) === type);
      if (names.length > 0) groups.push({ label, names });
    });
    return groups;
  };
  // Every assignable unit, grouped the same way — Service Trucks (and other
  // support equipment) first, then one group per machine type. Used anywhere
  // someone picks a unit (invite form, Employees reassignment) so the choice
  // itself is what determines mechanic vs. production, instead of a separate
  // toggle.
  const groupedUnitOptions = () => {
    const groups = [];
    Object.entries(SUPPORT_TYPE_LABELS).forEach(([type, label]) => {
      const typeUnits = units.filter((u) => u && unitTypes[slugForUnit(u)] === type);
      if (typeUnits.length > 0) groups.push({ label, units: typeUnits });
    });
    Object.entries(MACHINE_TYPE_LABELS).forEach(([type, label]) => {
      const typeUnits = units.filter((u) => u && unitTypes[slugForUnit(u)] === type);
      if (typeUnits.length > 0) groups.push({ label, units: typeUnits });
    });
    return groups;
  };

  // ---- Production shift lifecycle (ported from the standalone Timesheets app) ----
  const persistProductionShifts = async (next) => {
    const check = await safeToOverwrite('productionShifts', next);
    if (!check.ok) {
      alert(`Save blocked to protect existing data — this device only has ${check.nextCount} entries loaded, but the server has ${check.serverCount}. Close and fully reopen the app to sync everything, then try again.`);
      return;
    }
    setProductionShifts(next);
    try {
      await firebase.database().ref('productionShifts').set(stripUndefined(next));
    } catch (e) {
      try {
        await new Promise((r) => setTimeout(r, 1500));
        await firebase.database().ref('productionShifts').set(stripUndefined(next));
      } catch (e2) {
        alert("Couldn't save — check your signal and try again. This action was NOT recorded.");
      }
    }
  };
  const saveOneProductionShift = async (shift) => {
    const next = productionShifts.some((s) => s.id === shift.id) ? productionShifts.map((s) => (s.id === shift.id ? shift : s)) : [...productionShifts, shift];
    setProductionShifts(next);
    cacheSet('productionShifts', next);
    await queueWrite('productionShifts', { kind: 'save', entry: shift });
  };
  const patchOneProductionShift = async (shiftId, patch) => {
    const next = productionShifts.map((s) => (s.id === shiftId ? { ...s, ...patch } : s));
    setProductionShifts(next);
    cacheSet('productionShifts', next);
    await queueWrite('productionShifts', { kind: 'patch', entryId: shiftId, patch });
  };
  const deleteOneProductionShift = async (shiftId) => {
    const next = productionShifts.filter((s) => s.id !== shiftId);
    setProductionShifts(next);
    cacheSet('productionShifts', next);
    await queueWrite('productionShifts', { kind: 'delete', entryId: shiftId });
  };
  const persistDriverLogs = async (next) => {
    const check = await safeToOverwrite('driverLogs', next);
    if (!check.ok) {
      alert(`Save blocked to protect existing data — this device only has ${check.nextCount} entries loaded, but the server has ${check.serverCount}. Close and fully reopen the app to sync everything, then try again.`);
      return;
    }
    setDriverLogs(next);
    try {
      await firebase.database().ref('driverLogs').set(stripUndefined(next));
    } catch (e) {
      try {
        await new Promise((r) => setTimeout(r, 1500));
        await firebase.database().ref('driverLogs').set(stripUndefined(next));
      } catch (e2) {
        alert("Couldn't save — check your signal and try again. This action was NOT recorded.");
      }
    }
  };
  const saveOneDriverLog = async (log) => {
    const next = driverLogs.some((l) => l.id === log.id) ? driverLogs.map((l) => (l.id === log.id ? log : l)) : [...driverLogs, log];
    setDriverLogs(next);
    cacheSet('driverLogs', next);
    await queueWrite('driverLogs', { kind: 'save', entry: log });
  };
  const patchOneDriverLog = async (logId, patch) => {
    const next = driverLogs.map((l) => (l.id === logId ? { ...l, ...patch } : l));
    setDriverLogs(next);
    cacheSet('driverLogs', next);
    await queueWrite('driverLogs', { kind: 'patch', entryId: logId, patch });
  };
  const deleteOneDriverLog = async (logId) => {
    const next = driverLogs.filter((l) => l.id !== logId);
    setDriverLogs(next);
    cacheSet('driverLogs', next);
    await queueWrite('driverLogs', { kind: 'delete', entryId: logId });
  };
  const bulkSaveDriverLogs = async (logsArray) => {
    const next = [...driverLogs, ...logsArray];
    setDriverLogs(next);
    cacheSet('driverLogs', next);
    await queueWrite('driverLogs', { kind: 'bulkSave', entries: logsArray });
  };

  const persistPreTripInspections = async (next) => {
    const check = await safeToOverwrite('preTripInspections', next);
    if (!check.ok) {
      alert(`Save blocked to protect existing data — this device only has ${check.nextCount} entries loaded, but the server has ${check.serverCount}. Close and fully reopen the app to sync everything, then try again.`);
      return;
    }
    setPreTripInspections(next);
    try {
      await firebase.database().ref('preTripInspections').set(stripUndefined(next));
    } catch (e) {
      try {
        await new Promise((r) => setTimeout(r, 1500));
        await firebase.database().ref('preTripInspections').set(stripUndefined(next));
      } catch (e2) {
        alert("Couldn't save — check your signal and try again. This action was NOT recorded.");
      }
    }
  };
  const saveOneInspection = async (inspection) => {
    const next = [...preTripInspections, inspection];
    setPreTripInspections(next);
    cacheSet('preTripInspections', next);
    await queueWrite('preTripInspections', { kind: 'save', entry: inspection });
  };
  const deleteOneInspection = async (inspectionId) => {
    const next = preTripInspections.filter((insp) => insp.id !== inspectionId);
    setPreTripInspections(next);
    cacheSet('preTripInspections', next);
    await queueWrite('preTripInspections', { kind: 'delete', entryId: inspectionId });
  };

  const deletePreTripInspection = async (inspectionId) => {
    await deleteOneInspection(inspectionId);
    setExpandedPreTripId(null);
  };

  const persistMaps = async (next) => {
    const check = await safeToOverwrite('maps', next);
    if (!check.ok) {
      alert(`Save blocked to protect existing data — this device only has ${check.nextCount} entries loaded, but the server has ${check.serverCount}. Close and fully reopen the app to sync everything, then try again.`);
      return;
    }
    setMaps(next);
    try {
      await firebase.database().ref('maps').set(stripUndefined(next));
    } catch (e) {
      try {
        await new Promise((r) => setTimeout(r, 1500));
        await firebase.database().ref('maps').set(stripUndefined(next));
      } catch (e2) {
        alert("Couldn't save — check your signal and try again. This action was NOT recorded.");
      }
    }
  };
  const saveOneMap = async (map) => {
    const next = maps.some((m) => m.id === map.id) ? maps.map((m) => (m.id === map.id ? map : m)) : [...maps, map];
    setMaps(next);
    cacheSet('maps', next);
    await queueWrite('maps', { kind: 'save', entry: map });
  };
  const patchOneMap = async (mapId, patch) => {
    // A local-only map (loaded from Files, this device only) has no
    // Firebase record to patch — e.g. calibrating it just updates its
    // entry in localMaps/localStorage instead.
    if (localMaps.some((m) => m.id === mapId)) {
