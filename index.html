      onerrorAttr: function () { window.__loadStatus[name] = 'FAILED'; }

</script>

<!-- On-screen error reporting: if anything fails, show it instead of a blank screen -->
<script>
  window.addEventListener('error', function (e) {
    showFatalError((e.message || 'Script failed to load') + (e.filename ? '\n\nFile: ' + e.filename + (e.lineno ? ':' + e.lineno : '') : ''));
  }, true); // capture:true so we also catch <script src> load failures, not just JS errors
  window.addEventListener('unhandledrejection', function (e) {
    showFatalError('Unhandled error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  function showFatalError(msg) {
    const root = document.getElementById('root');
    if (root.dataset.errorShown) return;
    root.dataset.errorShown = '1';
    root.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;font-family:sans-serif;color:#ECE8DF;background:#1B1E20;text-align:center;">' +
      '<div style="max-width:520px;"><h1 style="color:#E8622C;font-size:1.4rem;">Something went wrong loading the app</h1>' +
      '<p style="margin-top:1rem;">Please screenshot this and send it back:</p>' +
      '<pre style="text-align:left;background:#242829;padding:1rem;border-radius:8px;overflow:auto;font-size:0.75rem;white-space:pre-wrap;">' +
      String(msg).replace(/</g, '&lt;') + '</pre></div></div>';
  }

  // Fallback diagnostic: if nothing has rendered into #root after 6 seconds,
  // report exactly which external libraries loaded and which didn't.
  setTimeout(function () {
    const root = document.getElementById('root');
    if (root.dataset.errorShown) return;
    if (root.children.length > 0) return; // app rendered fine
    const status = window.__loadStatus || {};
    const lines = ['tailwind', 'react', 'react-dom', 'babel', 'firebase-app', 'firebase-db', 'firebase-auth', 'firebase-messaging'].map(function (k) {
      return k + ': ' + (status[k] || 'never finished loading');
    });
    showFatalError('The app never finished starting up. Here is what loaded:\n\n' + lines.join('\n'));
  }, 6000);
</script>

<!-- Register the service worker so the app itself (not just its data) works
     with no signal at all. sw.js uses a versioned cache name — whenever this
     app is updated, sw.js's CACHE_NAME is bumped too, which is what makes
     phones pick up the new version instead of getting stuck on an old one. -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

function PinModalOverlay({ pinModal, pinInput, setPinInput, pinError, onSubmit, onCancel, onForgot, t }) {
  const tr = t || ((k) => translations.en[k] || k);
  if (!pinModal) return null;
  const isVerify = pinModal.mode === 'verify';
  const isConfirm = pinModal.mode === 'setup' && pinModal.stage === 'confirm';
  const title = isVerify
    ? tr('enterPin')
    : isConfirm
      ? tr('confirmPin')
      : tr('createPin');

  const handleDigit = (d) => {
    if (pinInput.length >= 6) return;
    setPinInput(pinInput + d);
  };
  const handleBackspace = () => setPinInput(pinInput.slice(0, -1));

  return (
    <div className="absolute inset-0 z-50 p-6" style={{ background: 'rgba(0,0,0,0.75)', minHeight: '100vh' }}>
      <div className="w-full max-w-xs mx-auto my-8 rounded-2xl p-6 overflow-y-auto" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}`, maxHeight: '85vh' }}>

        <p className="text-sm text-center mb-5" style={{ color: COLORS.inkDim }}>{pinModal.mechanic}</p>

        <div className="flex justify-center gap-3 mb-5">
          {[0, 1, 2, 3, 4, 5].map((i) => (
            <div
              key={i}
              className="w-4 h-4 rounded-full"
              style={{
                background: i < pinInput.length ? COLORS.accent : 'transparent',
                border: `2px solid ${i < pinInput.length ? COLORS.accent : COLORS.line}`,
              }}
            />
          ))}
        </div>

        {pinError && (
          <p className="text-sm text-center mb-4 font-semibold" style={{ color: '#E07A5F' }}>{pinError}</p>
        )}

        <div className="grid grid-cols-3 gap-3 mb-4">
          {['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((d) => (
            <button

function SetNewPinScreen({ state, t, onDone }) {
  const [stage, setStage] = useState('first'); // 'first' | 'confirm'
  const [firstEntry, setFirstEntry] = useState('');
  const [pin, setPin] = useState('');
  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);

  if (state === 'invalid') {
    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-6 flex items-center justify-center">
        <div className="max-w-sm text-center">
          <p className="text-4xl mb-4">⚠️</p>
          <p className="text-base">{t('linkExpiredOrInvalid')}</p>
        </div>
      </div>
    );
  }

  const handleDigit = (d) => {
    const next = pin + d;
    if (next.length > 6) return;
    setPin(next);
    if (next.length === 6) {
      if (stage === 'first') {
        setFirstEntry(next);
        setPin('');
        setStage('confirm');
      } else {
        if (next !== firstEntry) {
          setError(t('pinMismatch'));
          setStage('first');
          setFirstEntry('');
          setPin('');
          return;
        }
        submitNewPin(next);
      }
    }
  };

  const submitNewPin = async (newPin) => {
    setSubmitting(true);
    setError('');
    try {
      const res = await fetch(CLOUD_FUNCTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: APP_SECRET, mode: 'resetPinWithToken', token: state.token, newPin }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'Failed');
      await firebase.auth().signInWithEmailAndPassword(emailForMechanic(state.mechanic), newPin);
      onDone(state.mechanic);
    } catch (e) {
      setError(t('linkExpiredOrInvalid'));
      setSubmitting(false);
      setStage('first');
      setFirstEntry('');
      setPin('');
    }
  };

  return (
    <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-6 flex flex-col items-center justify-center">
      <div className="max-w-xs w-full text-center">
        <p className="font-display text-2xl font-bold mb-2">{t('setNewPin')}</p>
        <p className="text-sm mb-2" style={{ color: COLORS.inkDim }}>{state.mechanic}</p>
        <p className="text-sm mb-6" style={{ color: COLORS.inkDim }}>
          {stage === 'first' ? t('setNewPinHelper') : 'Enter it again to confirm.'}
        </p>
        <div className="flex justify-center gap-2 mb-6">
          {Array.from({ length: 6 }).map((_, i) => (
            <div
              key={i}
              className="w-8 h-10 rounded-lg flex items-center justify-center text-lg font-mono"
              style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}
            >
              {pin[i] ? '•' : ''}
            </div>
          ))}
        </div>
        {error && <p className="text-sm mb-4" style={{ color: '#E07A5F' }}>{error}</p>}
        {submitting ? (
          <p className="text-sm" style={{ color: COLORS.inkDim }}>…</p>
        ) : (
          <div className="grid grid-cols-3 gap-3">
            {['1','2','3','4','5','6','7','8','9','','0','⌫'].map((d, i) =>
              d === '' ? <div key={i} /> : (
                <button
                  key={i}
                  onClick={() => (d === '⌫' ? setPin(pin.slice(0, -1)) : handleDigit(d))}
                  className="rounded-lg py-4 text-xl font-display font-bold"
                  style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                >
                  {d}
                </button>
              )
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function FireworksOverlay({ show }) {
  if (!show) return null;
  const colors = [COLORS.accent, COLORS.done, COLORS.progress, '#F0EFE6', '#E07A5F'];
  const bursts = [
    { x: '25%', y: '35%' },
    { x: '70%', y: '25%' },
    { x: '50%', y: '55%' },
    { x: '15%', y: '65%' },
    { x: '85%', y: '60%' },
  ];
  const particles = [];
  bursts.forEach((burst, bi) => {
    for (let i = 0; i < 14; i++) {
      const angle = (Math.PI * 2 * i) / 14;
      const dist = 60 + Math.random() * 60;
      particles.push({
        key: `${bi}-${i}`,
        left: burst.x,
        top: burst.y,
        dx: Math.cos(angle) * dist + 'px',
        dy: Math.sin(angle) * dist + 'px',
        color: colors[(bi + i) % colors.length],
        size: 6 + Math.random() * 6,
        delay: bi * 0.15,
      });
    }
  });

  return (
    <div className="fixed inset-0 z-50 pointer-events-none overflow-hidden">
      {particles.map((p) => (
        <span
          key={p.key}
          className="firework-particle"
          style={{
            left: p.left,
            top: p.top,
            width: p.size,
            height: p.size,
            background: p.color,
            animationDelay: `${p.delay}s`,
            '--dx': p.dx,
            '--dy': p.dy,
          }}
        />
      ))}
    </div>
  );
}

function SignaturePad({ onChange, savedSignature }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);

  useEffect(() => {
    if (savedSignature && canvasRef.current) {
      const canvas = canvasRef.current;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      };
      img.src = savedSignature;
      onChange(savedSignature);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const getPos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
  };

  const start = (e) => {
    e.preventDefault();
    drawing.current = true;
    const ctx = canvasRef.current.getContext('2d');
    const { x, y } = getPos(e);
    ctx.beginPath();
    ctx.moveTo(x, y);
  };
  const move = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext('2d');
    const { x, y } = getPos(e);
    ctx.lineTo(x, y);
    ctx.strokeStyle = '#1B1F19';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.stroke();
    onChange(canvasRef.current.toDataURL('image/png'));
  };
  const end = () => { drawing.current = false; };
  const clear = () => {
    const canvas = canvasRef.current;
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    onChange(null);
  };

  return (
    <div>
      {savedSignature && (
        <p className="text-xs mb-2" style={{ color: COLORS.accent }}>Using your saved signature — clear it below if you'd like to redraw.</p>
      )}
      <canvas
        ref={canvasRef}
        width={320}
        height={140}
        onMouseDown={start}
        onMouseMove={move}
        onMouseUp={end}
        onMouseLeave={end}
        onTouchStart={start}
        onTouchMove={move}
        onTouchEnd={end}
        className="w-full rounded-lg"
        style={{ background: '#fff', border: `2px solid ${COLORS.line}`, touchAction: 'none', display: 'block' }}
      />
      <button type="button" onClick={clear} className="text-xs underline mt-2" style={{ color: COLORS.inkDim }}>Clear signature</button>
    </div>
  );
}

// Mirrors the last-known data into localStorage so mechanics can still SEE
// their board (read-only) even opening the app fresh with zero signal.
// New changes made offline still rely on Firebase's own queue-and-sync,
// which only survives as long as the app isn't fully closed before
// reconnecting — this cache is purely for offline viewing, not writes.
function cacheGet(key, fallback) {
  try {
    const raw = localStorage.getItem('cache_' + key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
function cacheSet(key, value) {
  try {
    localStorage.setItem('cache_' + key, JSON.stringify(value));
  } catch (e) {
    // storage full or unavailable — offline viewing just won't have this data
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtTime(iso) {
  if (!iso) return '';
  // hour12 forced explicitly so this always shows AM/PM regardless of the
  // phone's system time format setting (some Android phones default to 24-hour).
  return new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', hour12: true });
}

// Total paid hours for a shift: clock-in to clock-out, minus any unpaid break.
function entryHours(entry) {
  if (!entry.clockIn || !entry.clockOut) return 0;
  let ms = new Date(entry.clockOut) - new Date(entry.clockIn);
  if (entry.lunchStart && entry.lunchEnd) {
    ms -= new Date(entry.lunchEnd) - new Date(entry.lunchStart);
  }
  return Math.max(0, ms / 1000 / 60 / 60);
}

function fmtHours(h) {
  const totalMinutes = Math.round((h || 0) * 60);
  const hrs = Math.floor(totalMinutes / 60);
  const mins = totalMinutes % 60;
  if (hrs === 0) return `${mins}m`;
  if (mins === 0) return `${hrs}h`;
  return `${hrs}h ${mins}m`;
}

// Decimal hours — used only for the CSV export, since a bookkeeper opening
// it in Excel can sum a column of decimals but not "3h 30m" text.
function fmtHoursDecimal(h) {
  return (h || 0).toFixed(2).replace(/\.00$/, '');
}

// Pay week runs Sunday–Saturday. Given any date string ('YYYY-MM-DD'),
// return that week's Sunday as the week's identifying key.
function weekStartOf(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - d.getDay());
  return d.toISOString().slice(0, 10);
}
function weekEndOf(weekStart) {
  const d = new Date(weekStart + 'T00:00:00');
  d.setDate(d.getDate() + 6);
  return d.toISOString().slice(0, 10);
}
function fmtWeekRange(weekStart) {
  const end = weekEndOf(weekStart);
  return `${fmtDate(weekStart)} – ${fmtDate(end)}`;
}

// Resize + compress a photo before storing it, so the shared database stays fast
// to sync over a mechanic's cell signal out in the field.
function compressImage(file, maxDim = 1280, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Resolves a piece of user-typed content (title, description, checklist
// item) to whatever language is currently active. `field` can be a plain
// string (older data, before this existed) or an object built by this
// feature: { text, origLang, translations: { en, es, pdt } }.
function getLocalizedText(field, lang) {
  if (!field) return '';
  if (typeof field === 'string') return field;
  if (field.origLang === lang) return field.text;
  if (field.translations && field.translations[lang]) return field.translations[lang];
  return field.text;
}

// Builds a multi-language content object at save time. Auto-translates
// between English and Spanish immediately (Google's translation service
// supports both); Plautdietsch has no automatic translation available, so
// that slot is left for a human to fill in later via the app.
async function buildLocalizedField(text, currentLang) {
  const field = { text, origLang: currentLang, translations: {} };
  if (currentLang === 'en' || currentLang === 'es') {
    const other = currentLang === 'en' ? 'es' : 'en';
    const translated = await translateText(text, other);
    if (translated) field.translations[other] = translated;
  }
  return field;
}

// One-way hash so raw PINs are never stored or sent anywhere in plain text.
async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

function webauthnKey(name) {
  return 'webauthn_cred_' + name;
}

async function webauthnAvailable() {
  return !!(
    window.PublicKeyCredential &&
    window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable &&
    (await window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())
  );
}

// Registers Face ID / Touch ID (or Windows Hello, etc.) as a shortcut on THIS device only.
// The credential never leaves the device — it's just a local unlock, not shared identity proof.
async function registerBiometric(name) {
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge,
      rp: { name: 'Harder Contracting Work Orders' },
      user: {
        id: new TextEncoder().encode(name),
        name,
        displayName: name,
      },
      pubKeyCredParams: [
        { type: 'public-key', alg: -7 },
        { type: 'public-key', alg: -257 },
      ],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
      timeout: 60000,
    },
  });
  const credIdB64 = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
  localStorage.setItem(webauthnKey(name), credIdB64);
}

async function verifyBiometric(name) {
  const credIdB64 = localStorage.getItem(webauthnKey(name));
  if (!credIdB64) return false;
  try {
    const credId = Uint8Array.from(atob(credIdB64), (c) => c.charCodeAt(0));
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    await navigator.credentials.get({
      publicKey: {
        challenge,
        allowCredentials: [{ id: credId, type: 'public-key' }],
        userVerification: 'required',
        timeout: 60000,
      },
    });
    return true;
  } catch (e) {
    return false;
  }
}

function jokeOfTheDay(lang, customPdtJokes) {
  const list = lang === 'es' ? JOKES_ES : lang === 'pdt' ? [...JOKES_PDT, ...(customPdtJokes || [])] : JOKES;
  const start = new Date(new Date().getFullYear(), 0, 0);
  const diff = new Date() - start;
  const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
  return list[dayOfYear % list.length];
}

  return (
    <button
      type={type}
      onClick={onClick}

  useEffect(() => {

  const requestLoginLink = async () => {

    setLostAccessSubmitting(true);
    try {
      await fetch(CLOUD_FUNCTION_URL, {
        method: 'POST',

  const checkAndPromptEmail = (name) => {
    if (!mechanicEmails[slugForMechanic(name)]) {
      setShowEmailPrompt(true);
    }
  };

  // Default is on — the person is asked once per device, and the prompt
  // itself needs a real tap to satisfy Safari's requirement that
  // Notification.requestPermission() only works inside a genuine gesture.
  const checkAndPromptPush = (name) => {
    if (!localStorage.getItem('pushAsked_' + name)) {
      setShowPushPrompt(true);
    }
  };

  const handleMechanicTap = async (name) => {
    setPinError('');
    const hasCred = !!localStorage.getItem('webauthn_cred_' + name);
    if (hasCred) {
      const ok = await verifyBiometric(name);
      // Biometric only unlocks a session that's already real and signed-in on
      // this device — it never bypasses actually having a valid Firebase login.
      // Firebase can take a moment to restore that session on a fresh app
      // load, so wait briefly for it rather than checking too early.
      let sessionUser = firebaseUser;
      if (sessionUser === undefined) {
        sessionUser = await new Promise((resolve) => {
          const unsub = firebase.auth().onAuthStateChanged((u) => {
            unsub();
            resolve(u);
          });
        });
      }
      if (ok && sessionUser && sessionUser.email === emailForMechanic(name)) {
        localStorage.setItem('deviceMechanic', name);
        setCurrentMechanic(name);
        setScreen('dashboard');
        checkAndPromptEmail(name);
        checkAndPromptPush(name);
        return;
      }
      // if biometric fails, is cancelled, or the session isn't valid, fall through to PIN entry
    }
    setPinInput('');
    if (authMigrated[name]) {
      setPinModal({ mode: 'verify', mechanic: name });
    } else {
      setPinModal({ mode: 'setup', mechanic: name, stage: 'first', firstEntry: '' });
    }
  };

  const submitPin = async () => {
    if (!pinModal || pinInput.length !== 6) return;
    if (pinModal.mode === 'verify') {
      try {
        await firebase.auth().signInWithEmailAndPassword(emailForMechanic(pinModal.mechanic), pinInput);
        const mechanic = pinModal.mechanic;
        localStorage.setItem('deviceMechanic', mechanic);
        setPinModal(null);
        setPinInput('');
        setPinError('');
        setCurrentMechanic(mechanic);
        setScreen('dashboard');
        maybeOfferBiometric(mechanic);
        checkAndPromptEmail(mechanic);
        checkAndPromptPush(mechanic);
      } catch (e) {
        setPinError(t('wrongPin'));
        setPinInput('');
      }
    } else if (pinModal.mode === 'setup') {
      if (pinModal.stage === 'first') {
        setPinModal({ ...pinModal, stage: 'confirm', firstEntry: pinInput });
        setPinInput('');
      } else {
        if (pinInput === pinModal.firstEntry) {
          const mechanic = pinModal.mechanic;
          const email = emailForMechanic(mechanic);
          const alreadyMigrated = authMigrated[mechanic];
          try {
            if (alreadyMigrated) {
              // Changing an existing PIN — must be signed in as this person already.
              if (firebase.auth().currentUser && firebase.auth().currentUser.email === email) {
                await firebase.auth().currentUser.updatePassword(pinInput);
              } else {
                // Not currently signed in as them (e.g. resuming after a while) — sign in with old
                // session isn't available, so re-authenticate isn't possible without their old PIN.
                // Safest fallback: treat this like a fresh account so they can still get in.
                await firebase.auth().signOut().catch(() => {});
                throw { code: 'needs-reauth' };
              }
            } else {
              const cred = await firebase.auth().createUserWithEmailAndPassword(email, pinInput);
              await firebase.database().ref('users/' + cred.user.uid).set({ name: mechanic, isAdmin: admins.includes(mechanic) });
              const nextMigrated = { ...authMigrated, [mechanic]: true };
              setAuthMigrated(nextMigrated);
              await saveAuthMigrated(nextMigrated);
            }
          } catch (e) {
            setPinError(
              e.code === 'auth/email-already-in-use'
                ? 'A login already exists for this name — try entering your PIN instead, or ask an admin for help.'
                : e.code === 'needs-reauth'
                ? "Please sign out and enter your current PIN first, then use Change PIN from there."
                : 'Could not save your PIN. Check your connection and try again.'
            );
            setPinModal({ ...pinModal, stage: 'first', firstEntry: '' });
            setPinInput('');
            return;
          }
          const isNewMechanic = !mechanics.includes(mechanic);
          setPinModal(null);
          setPinInput('');
          setPinError('');
          if (isNewMechanic) {
            await persistMeta([...mechanics, mechanic], units);
          }
          localStorage.setItem('deviceMechanic', mechanic);
          setCurrentMechanic(mechanic);
          setScreen('dashboard');
          maybeOfferBiometric(mechanic);
          checkAndPromptEmail(mechanic);
        checkAndPromptPush(mechanic);
        } else {
          setPinError(t('pinMismatch'));
          setPinModal({ ...pinModal, stage: 'first', firstEntry: '' });
          setPinInput('');
        }
      }
    }
  };

  const cancelPinModal = () => {
    setPinModal(null);
    setPinInput('');
    setPinError('');
  };

  const forgotPin = () => {
    // Real accounts can't be self-service reset from here anymore — that needs
    // an admin to clear it from the Firebase console and the Team screen.
    setPinError('Forgotten your PIN? Ask an admin to reset your login for you — they can do this from the Team screen.');
  };

  const clearAuthMigration = async (name) => {
    const next = { ...authMigrated };
    delete next[name];
    setAuthMigrated(next);
    await saveAuthMigrated(next);
    localStorage.removeItem('webauthn_cred_' + name);
  };

  const startChangePin = () => {
    setPinError('');
    setPinInput('');
    setPinModal({ mode: 'setup', mechanic: currentMechanic, stage: 'first', firstEntry: '' });
  };

  const maybeOfferBiometric = async (name) => {
    if (localStorage.getItem('webauthn_cred_' + name)) return;
    const avail = await webauthnAvailable().catch(() => false);
    if (avail) setOfferBiometric(name);
  };

  const toggleBiometric = async () => {
    const key = 'webauthn_cred_' + currentMechanic;
    if (localStorage.getItem(key)) {
      localStorage.removeItem(key);
      setBioMsg('Face ID / Touch ID turned off on this device.');
    } else {
      try {
        await registerBiometric(currentMechanic);
        setBioMsg('Face ID / Touch ID enabled on this device.');
      } catch (e) {
        setBioMsg('Could not set that up on this device.');
      }
    }
    setTimeout(() => setBioMsg(''), 4000);
  };

  // Translates a checklist's name and every item into the other of
  // {en, es} at save time (Plautdietsch has no automatic translation
  // available — see buildLocalizedField for the same note).
  const [migratingTranslations, setMigratingTranslations] = useState(false);

  // One-time catch-up for anything created before auto-translation existed —
  // checklist templates, attached checklists, and work order descriptions
  // that are still plain strings with no translation data at all. Assumes
  // that older content was written in English, since that's all the app
  // supported at the time. Always re-processes everything rather than
  // trying to detect what's "already done" — safe and cheap to repeat,
  // and avoids leaving partially-failed items stuck unfixable.
  const translateAllExistingContent = async () => {
    setMigratingTranslations(true);
    let successCount = 0;
    let failCount = 0;
    try {
      const updatedTemplates = await Promise.all(templates.map(async (tpl) => {
        const result = await translateChecklistContent(tpl.name, tpl.items, tpl.nameOrigLang || 'en');
        if (result.nameTranslations && Object.keys(result.nameTranslations).length > 0) successCount++;
        else failCount++;
        return { ...tpl, ...result };
      }));
      await persistTemplates(updatedTemplates);

      const updatedOrders = await Promise.all(orders.map(async (o) => {
        let next = o;
        // Always reprocess, whether description is still a plain string
        // (never touched) or already an object with empty/broken
        // translations (created while the backend was still broken) —
        // pull out the original text either way and retranslate.
        const origText = typeof o.description === 'string' ? o.description : (o.description ? o.description.text : '');
        if (origText && origText.trim()) {
          const field = await buildLocalizedField(origText, 'en');
          if (field.translations && Object.keys(field.translations).length > 0) successCount++;
          else failCount++;
          next = { ...next, description: field };
        }
        const existingChecklists = getChecklists(o);
        if (existingChecklists.length > 0) {
          const updatedChecklists = await Promise.all(existingChecklists.map(async (c) => {
            const result = await translateChecklistContent(c.templateName, c.items.map((i) => i.text), c.nameOrigLang || 'en');
            if (result.nameTranslations && Object.keys(result.nameTranslations).length > 0) successCount++;
            else failCount++;
            return { ...c, ...result };
          }));
          next = { ...next, checklists: updatedChecklists, checklist: null };
        }
        return next;
      }));
      await persistOrders(updatedOrders);
      alert(`Done — ${successCount} translated successfully${failCount > 0 ? `, ${failCount} failed (check your connection and try again for those)` : ''}.`);
    } catch (err) {
      alert('Something went wrong: ' + err.message);
    } finally {
      setMigratingTranslations(false);
    }
  };

  // Translates a checklist's name and every item into the other of
  // {en, es} at save time (Plautdietsch has no automatic translation
  // available — see buildLocalizedField for the same note). Item
  // translations are stored by POSITION (an array matching `items`), not
  // by the item's own text — some items contain a "/" (like "Check/top up
  // a/c"), which Firebase flatly refuses as an object key.
  const translateChecklistContent = async (name, items, currentLang) => {
    if (currentLang !== 'en' && currentLang !== 'es') {
      return { nameOrigLang: currentLang, nameTranslations: {}, itemTranslations: [] };
    }
    const other = currentLang === 'en' ? 'es' : 'en';
    const [nameTranslated, itemTranslatedList] = await Promise.all([
      translateText(name, other),
      Promise.all(items.map((it) => translateText(it, other))),
    ]);
    const itemTranslations = items.map((it, i) => (itemTranslatedList[i] ? { [other]: itemTranslatedList[i] } : null));
    return {
      nameOrigLang: currentLang,
      nameTranslations: nameTranslated ? { [other]: nameTranslated } : {},
      itemTranslations,
    };
  };

  const addTemplate = async (name, itemsText) => {
    const trimmedName = name.trim();
    const items = itemsText.split('\n').map((l) => l.trim()).filter(Boolean);
    if (!trimmedName || items.length === 0) return;
    const { nameOrigLang, nameTranslations, itemTranslations } = await translateChecklistContent(trimmedName, items, lang);
    const newTpl = { id: uid(), name: trimmedName, items, nameOrigLang, nameTranslations, itemTranslations };
    await persistTemplates([...templates, newTpl]);
    setShowNewTemplate(false);
  };

  const deleteTemplate = async (id) => {
    await persistTemplates(templates.filter((t) => t.id !== id));
    setConfirmDeleteTemplate(null);
  };

  const updateTemplate = async (id, name, itemsText) => {
    const trimmedName = name.trim();
    const items = itemsText.split('\n').map((l) => l.trim()).filter(Boolean);
    if (!trimmedName || items.length === 0) return;
    const { nameOrigLang, nameTranslations, itemTranslations } = await translateChecklistContent(trimmedName, items, lang);
    const next = templates.map((t) => (t.id === id ? { ...t, name: trimmedName, items, nameOrigLang, nameTranslations, itemTranslations } : t));
    await persistTemplates(next);
    setEditingTemplateId(null);
  };

  // Adds (or fixes) just the Plautdietsch wording for a template's name and
  // items, without touching the original text or the English/Spanish
  // translations already there — since Plautdietsch can't be auto-translated,
  // this is the manual path for filling it in.
  const updateTemplatePdt = async (templateId, namePdt, itemPdtList) => {
    const next = templates.map((tpl) => {
      if (tpl.id !== templateId) return tpl;
      const nameTranslations = { ...(tpl.nameTranslations || {}) };
      if (namePdt.trim()) nameTranslations.pdt = namePdt.trim(); else delete nameTranslations.pdt;
      const itemTranslations = (tpl.items || []).map((_, i) => {
        const existing = { ...((tpl.itemTranslations && tpl.itemTranslations[i]) || {}) };
        const val = itemPdtList[i];
        if (val && val.trim()) existing.pdt = val.trim(); else delete existing.pdt;
        return Object.keys(existing).length > 0 ? existing : null;
      });
      return { ...tpl, nameTranslations, itemTranslations };
    });
    await persistTemplates(next);
  };

  const updateChecklistPdt = async (orderId, checklistId, namePdt, itemPdtList) => {
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const nextChecklists = getChecklists(order).map((c) => {
      if (c.id !== checklistId) return c;
      const nameTranslations = { ...(c.nameTranslations || {}) };
      if (namePdt.trim()) nameTranslations.pdt = namePdt.trim(); else delete nameTranslations.pdt;
      const itemTranslations = (c.items || []).map((_, i) => {
        const existing = { ...((c.itemTranslations && c.itemTranslations[i]) || {}) };
        const val = itemPdtList[i];
        if (val && val.trim()) existing.pdt = val.trim(); else delete existing.pdt;
        return Object.keys(existing).length > 0 ? existing : null;
      });
      return { ...c, nameTranslations, itemTranslations };
    });
    await updateOrder(orderId, { checklists: nextChecklists, checklist: null });
  };

  // A work order can hold several checklists at once (e.g. the standard
  // summer checklist plus an off-season repair checklist). Older orders
  // saved before this existed have a single `checklist` field instead of
  // a `checklists` array — this helper reads either shape transparently.
  const getChecklists = (order) => {
    if (order.checklists) return order.checklists;
    if (order.checklist) return [{ id: 'legacy', ...order.checklist }];
    return [];
  };

  // Older orders saved before multi-mechanic assignment have a single
  // `assignedMechanic` string instead of an `assignedMechanics` array.
  const getAssignedMechanics = (order) => {
    if (order.assignedMechanics) return order.assignedMechanics;
    if (order.assignedMechanic) return [order.assignedMechanic];
    return [];
  };

  const attachChecklist = async (orderId, templateId) => {
    const template = templates.find((t) => t.id === templateId);
    if (!template) return;
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const checklist = {
      id: uid(),
      templateId: template.id,
      templateName: template.name,
      nameOrigLang: template.nameOrigLang,
      nameTranslations: template.nameTranslations,
      itemTranslations: template.itemTranslations,
      items: template.items.map((text) => ({ id: uid(), text, checked: false, checkedBy: null, checkedAt: null })),
    };
    const nextChecklists = [...getChecklists(order), checklist];
    await updateOrder(orderId, { checklists: nextChecklists, checklist: null });
    setAttachTemplateId('');
  };

  const detachChecklist = async (orderId, checklistId) => {
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const nextChecklists = getChecklists(order).filter((c) => c.id !== checklistId);
    await updateOrder(orderId, { checklists: nextChecklists, checklist: null });
  };

  const createAdHocChecklist = async (orderId, name, itemsText, saveAsTemplate) => {
    const trimmedName = name.trim();
    const items = itemsText.split('\n').map((l) => l.trim()).filter(Boolean);
    if (!trimmedName || items.length === 0) return;
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const { nameOrigLang, nameTranslations, itemTranslations } = await translateChecklistContent(trimmedName, items, lang);
    const checklist = {
      id: uid(),
      templateId: null,
      templateName: trimmedName,
      nameOrigLang,
      nameTranslations,
      itemTranslations,
      items: items.map((text) => ({ id: uid(), text, checked: false, checkedBy: null, checkedAt: null })),
    };
    const nextChecklists = [...getChecklists(order), checklist];
    await updateOrder(orderId, { checklists: nextChecklists, checklist: null });
    if (saveAsTemplate) {
      await persistTemplates([...templates, { id: uid(), name: trimmedName, items, nameOrigLang, nameTranslations, itemTranslations }]);
    }
  };

  const toggleChecklistItem = async (orderId, checklistId, itemId) => {
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const nextChecklists = getChecklists(order).map((c) => {
      if (c.id !== checklistId) return c;
      const items = c.items.map((it) => {
        if (it.id !== itemId) return it;
        const nowChecked = !it.checked;
        return {
          ...it,
          checked: nowChecked,
          checkedBy: nowChecked ? currentMechanic : null,
          checkedAt: nowChecked ? new Date().toISOString() : null,
        };
      });
      return { ...c, items };
    });
    await updateOrder(orderId, { checklists: nextChecklists, checklist: null });
  };

  const updateOrderChecklist = async (orderId, checklistId, name, itemsText) => {
    const trimmedName = name.trim();
    const lines = itemsText.split('\n').map((l) => l.trim()).filter(Boolean);
    if (!trimmedName || lines.length === 0) return;
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const existing = getChecklists(order).find((c) => c.id === checklistId);
    const existingByText = {};
    (existing ? existing.items : []).forEach((it) => { existingByText[it.text] = it; });
    // Keep the checked state for any item whose text didn't change; new/edited
    // lines start fresh so a corrected item doesn't stay marked done by mistake.
    const items = lines.map((text) => existingByText[text] || { id: uid(), text, checked: false, checkedBy: null, checkedAt: null });
    const { nameOrigLang, nameTranslations, itemTranslations } = await translateChecklistContent(trimmedName, lines, lang);
    const nextChecklists = getChecklists(order).map((c) =>
      c.id === checklistId ? { ...c, templateName: trimmedName, items, nameOrigLang, nameTranslations, itemTranslations } : c
    );
    await updateOrder(orderId, { checklists: nextChecklists, checklist: null });
    setEditingOrderChecklistId(null);
  };

  const addMechanic = () => {
    const name = newMechanicName.trim();
    if (!name || mechanics.includes(name)) return;
    setNewMechanicName('');
    setPinError('');
    setPinInput('');
    // New mechanics set up a PIN before their name is added to the board —
    // persistMeta happens once PIN setup completes, in submitPin().
    setPinModal({ mode: 'setup', mechanic: name, stage: 'first', firstEntry: '' });
  };

  const isAdmin = admins.includes(currentMechanic);

  const removeMechanic = async (name) => {
    const nextMechanics = mechanics.filter((m) => m !== name);
    await persistMeta(nextMechanics, units);
    const nextPins = { ...pins };
    delete nextPins[name];
    await persistPins(nextPins);
    if (admins.includes(name)) {
      const nextAdmins = admins.filter((a) => a !== name);
      setAdmins(nextAdmins);
      await saveAdmins(nextAdmins);
    }
    setShowRemoveConfirm(null);
  };

  const removeAllExceptSelf = async () => {
    const keep = [currentMechanic];
    await persistMeta(keep, units);
    await persistPins({ [currentMechanic]: pins[currentMechanic] });
    await saveAdmins(admins.filter((a) => a === currentMechanic));
    setAdmins(admins.filter((a) => a === currentMechanic));
    setShowRemoveAllConfirm(false);
  };

  const toggleAdmin = async (name) => {
    const nextAdmins = admins.includes(name) ? admins.filter((a) => a !== name) : [...admins, name];
    setAdmins(nextAdmins);
    await saveAdmins(nextAdmins);
  };

  // Saves are retried once automatically (a weak signal in the shop can make
  // a single attempt fail), and if it still fails, the person is told
  // directly rather than the app silently pretending it worked.
  const persistTimesheets = async (next) => {
    setTimesheets(next);
    try {
      await saveTimesheets(next);
    } catch (e) {
      try {
        await new Promise((r) => setTimeout(r, 1500));
        await saveTimesheets(next);
      } catch (e2) {
        alert(t('saveFailedWarning'));
      }
    }
  };

  const todayStr = () => new Date().toISOString().slice(0, 10);

  // The "open" entry for the current mechanic today: clocked in but not yet clocked out.
  // Find the mechanic's most recent still-open shift, regardless of what
  // calendar date it is right now — a shift that started before midnight and
  // gets clocked out after midnight must still be findable.
  const openEntry = timesheets
    .filter((t) => t.mechanic === currentMechanic && !t.clockOut)
    .sort((a, b) => new Date(b.clockIn) - new Date(a.clockIn))[0];

  // Prompt to clock in once per login, if they haven't already for today.
  useEffect(() => {
    if (currentMechanic && !openEntry) {
      setShowClockInPrompt(true);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [currentMechanic]);

  // Detect completed-work-order milestones per mechanic. Small ones celebrate
  // themselves automatically; big ones wait for the admin to personalize them.
  useEffect(() => {
    if (!currentMechanic || mechanics.length === 0) return;
    mechanics.forEach((m) => {
      const doneOrders = orders.filter((o) => o.status === 'Done' && getAssignedMechanics(o).includes(m));
      const count = doneOrders.length;
      if (count === 0) return;
      const already = milestonesCelebrated[m] || [];
      const nextMilestone = ALL_MILESTONES.find((n) => n <= count && !already.includes(n));
      if (!nextMilestone) return;
      const latestOrder = doneOrders.slice().sort((a, b) => (b.dateCreated || '').localeCompare(a.dateCreated || ''))[0];
      if (!latestOrder) return;

      if (BIG_MILESTONES.includes(nextMilestone)) {
        if (isAdmin && !milestonePrompt) {
          setMilestonePrompt({ mechanic: m, count: nextMilestone, orderId: latestOrder.id });
        }
      } else {
        const nextCelebrated = { ...milestonesCelebrated, [m]: [...already, nextMilestone] };
        setMilestonesCelebrated(nextCelebrated);
        saveMilestonesCelebrated(nextCelebrated);
        addNote(latestOrder.id, `🎉 ${m} just completed their ${nextMilestone}th work order! Great work.`, 'shoutout');
      }
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [orders, mechanics, currentMechanic]);

  const resolveMilestonePrompt = async (customText) => {
    if (!milestonePrompt) return;
    const { mechanic, count, orderId } = milestonePrompt;
    const message = (customText || '').trim() || `🎉 ${mechanic} just hit ${count} completed work orders! Incredible work.`;
    await addNote(orderId, message, 'shoutout');
    const already = milestonesCelebrated[mechanic] || [];
    const next = { ...milestonesCelebrated, [mechanic]: [...already, count] };
    setMilestonesCelebrated(next);
    await saveMilestonesCelebrated(next);
    setMilestonePrompt(null);
  };

  const [timeClockActionPending, setTimeClockActionPending] = useState(false);

  // These buttons react to live data from Firebase, and on a weak signal
  // there's a real window where the screen briefly reverts to the old state
  // before the write actually lands — a repeat tap in that window can hit
  // the wrong button entirely (e.g. lands on Clock Out instead of End
  // Break). Locking the button the instant it's tapped closes that window.
  const clockIn = async () => {
    if (timeClockActionPending) return;
    setTimeClockActionPending(true);
    const entry = {
      id: uid(),
      mechanic: currentMechanic,
      date: todayStr(),
      clockIn: new Date().toISOString(),
      lunchStart: null,
      lunchEnd: null,
      skippedLunch: false,
      clockOut: null,
      jobs: [],
    };
    try {
      await persistTimesheets([...timesheets, entry]);
    } finally {
      setTimeClockActionPending(false);
    }
  };

  const startLunch = async () => {
    if (!openEntry || timeClockActionPending) return;
    setTimeClockActionPending(true);
    const next = timesheets.map((t) => (t.id === openEntry.id ? { ...t, lunchStart: new Date().toISOString() } : t));
    try {
      await persistTimesheets(next);
    } finally {
      setTimeClockActionPending(false);
    }
  };

  const endLunch = async () => {
    if (!openEntry || timeClockActionPending) return;
    setTimeClockActionPending(true);
    const next = timesheets.map((t) => (t.id === openEntry.id ? { ...t, lunchEnd: new Date().toISOString() } : t));
    try {
      await persistTimesheets(next);
    } finally {
      setTimeClockActionPending(false);
    }
  };

  const [pendingClockOutSkippedLunch, setPendingClockOutSkippedLunch] = useState(null);

  const clockOut = async (skippedLunch, signatureDataUrl) => {
    if (!openEntry) return;
    const next = timesheets.map((t) =>
      t.id === openEntry.id
        ? {
            ...t,
            clockOut: new Date().toISOString(),
            skippedLunch: !!skippedLunch,
            signature: signatureDataUrl || null,
            signedAt: signatureDataUrl ? new Date().toISOString() : null,
          }
        : t
    );
    await persistTimesheets(next);
    setLunchPrompt(false);
    setPendingClockOutSkippedLunch(null);
  };

  const attemptClockOut = () => {
    if (!openEntry) return;
    const hasLunch = openEntry.lunchStart && openEntry.lunchEnd;
    if (!hasLunch && !openEntry.skippedLunch) {
      setLunchPrompt(true);
      return;
    }
    setPendingClockOutSkippedLunch(openEntry.skippedLunch || false);
  };

  const addTimesheetJob = async (entryId, unit, hours) => {
    const trimmedUnit = unit.trim();
    const parsedHours = parseFloat(hours);
    if (!trimmedUnit || !parsedHours || parsedHours <= 0) return;
    const next = timesheets.map((t) =>
      t.id === entryId ? { ...t, jobs: [...(t.jobs || []), { id: uid(), unit: trimmedUnit, hours: parsedHours }] } : t
    );
    await persistTimesheets(next);
  };

  const removeTimesheetJob = async (entryId, jobId) => {
    const next = timesheets.map((t) =>
      t.id === entryId ? { ...t, jobs: (t.jobs || []).filter((j) => j.id !== jobId) } : t
    );
    await persistTimesheets(next);
  };

  const updateTimesheetEntry = async (entryId, patch) => {
    const next = timesheets.map((t) => (t.id === entryId ? { ...t, ...patch } : t));
    await persistTimesheets(next);
  };

  const deleteTimesheetEntry = async (entryId) => {
    await persistTimesheets(timesheets.filter((t) => t.id !== entryId));
  };

  // Adds a whole missed day — for when clock in/out was forgotten entirely,
  // so there's no existing entry to edit. mechanicName lets an admin add a
  // day on behalf of anyone; a mechanic adding their own just passes their
  // own name.
  const addManualEntry = async (mechanicName, date, clockInLocal, clockOutLocal, lunchStartLocal, lunchEndLocal) => {
    const entry = {
      id: uid(),
      mechanic: mechanicName,
      date,
      clockIn: clockInLocal ? new Date(clockInLocal).toISOString() : null,
      clockOut: clockOutLocal ? new Date(clockOutLocal).toISOString() : null,
      lunchStart: lunchStartLocal ? new Date(lunchStartLocal).toISOString() : null,
      lunchEnd: lunchEndLocal ? new Date(lunchEndLocal).toISOString() : null,
      skippedLunch: !lunchStartLocal && !lunchEndLocal,
      jobs: [],
    };
    await persistTimesheets([...timesheets, entry]);
  };

  const isWeekApproved = (weekStart) => !!timesheetApprovals[weekStart];

  const approveWeek = async (weekStart) => {
    const next = { ...timesheetApprovals, [weekStart]: { approvedBy: currentMechanic, approvedAt: new Date().toISOString() } };
    setTimesheetApprovals(next);
    await saveTimesheetApprovals(next);
  };

  const exportTimesheets = async (entries, filenamePrefix) => {
    const sorted = [...entries].sort((a, b) => (a.mechanic || '').localeCompare(b.mechanic || '') || a.date.localeCompare(b.date));
    const rows = [['Mechanic', 'Date', 'Clock In', 'Clock Out', 'Break Start', 'Break End', 'Worked Through Break', 'Paid Hours', 'Signed', 'Jobs (unit: hours)']];
    let lastMechanic = null;
    sorted.forEach((e) => {
      if (e.mechanic !== lastMechanic) {
        if (lastMechanic !== null) rows.push([]); // a blank row alone can collapse to nothing in some previews
        rows.push([`── ${e.mechanic} ──`]); // so a clearly labeled divider does the actual separating
      }
      lastMechanic = e.mechanic;
      const jobsStr = (e.jobs || []).map((j) => `${j.unit}: ${j.hours}h`).join(' | ');
      rows.push([
        e.mechanic,
        e.date,
        fmtTime(e.clockIn),
        fmtTime(e.clockOut),
        fmtTime(e.lunchStart),
        fmtTime(e.lunchEnd),
        e.skippedLunch ? 'Yes' : 'No',
        fmtHoursDecimal(entryHours(e)),
        e.signature ? 'Yes' : 'No',
        jobsStr,
      ]);
    });
    const csv = rows.map((r) => r.map((cell) => `"${String(cell || '').replace(/"/g, '""')}"`).join(',')).join('\n');
    const filename = `${filenamePrefix || 'timesheets'}-${todayStr()}.csv`;
    const file = new File([csv], filename, { type: 'text/csv' });

    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: 'Timesheets export',
          text: timesheetSettings.email ? `Timesheets for ${timesheetSettings.email}` : 'Timesheets export',
        });
        return;
      } catch (e) {
        // user cancelled the share sheet — fall through to download
      }
    }
    // Fallback: plain download if sharing isn't available on this device
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  };

  // read it, then opens the normal new-work-order form pre-filled with
  // whatever it found — nothing is ever saved without the person reviewing

  const handleScanReceipt = async (file) => {
    setScanningReceipt(true);
    try {
      const compressed = await compressImage(file);
      const base64 = compressed.split(',')[1];
      const res = await fetch(CLOUD_FUNCTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: APP_SECRET, mode: 'scanReceipt', image: base64, mediaType: 'image/jpeg' }),
      });
      if (!res.ok) throw new Error('Scan failed');
      const data = await res.json();
      const ex = data.extracted || {};
      const descParts = [];
      if (ex.vendor) descParts.push(`Vendor: ${ex.vendor}`);
      if (ex.amount) descParts.push(`Amount: ${ex.amount}`);
      if (ex.date) descParts.push(`Date on receipt: ${ex.date}`);
      if (ex.description) descParts.push(ex.description);
      setScanReviewData({
        description: descParts.join('\n'),
        unit: ex.unit && units.includes(ex.unit) ? ex.unit : '',
        photoDataUrl: compressed,
      });
      setShowAddOrder(true);

      alert("Couldn't read that photo — check your signal and try again, or just type in the work order normally.");

                onClick={() => setScreen('settings')}
                className="font-display text-xs uppercase tracking-wider font-semibold px-3 py-2 rounded-lg transition-all hover:scale-105"
                style={{ color: COLORS.accent, background: COLORS.surface, border: `1px solid ${COLORS.line}` }}
              >
                ⚙️ Settings
              </button>
              <button
                onClick={async () => {
                  const keepSession = !!localStorage.getItem('webauthn_cred_' + currentMechanic);
                  if (!keepSession) { await firebase.auth().signOut().catch(() => {}); }
                  setCurrentMechanic(null);
                  setScreen('login');
                  setShowClockInPrompt(false);
                }}
                className="font-display text-xs uppercase tracking-wider font-semibold px-3 py-2 rounded-lg transition-all hover:scale-105"
                style={{ color: COLORS.inkDim, background: COLORS.surface, border: `1px solid ${COLORS.line}` }}
              >
                👤 {currentMechanic}
              </button>
              <button
                onClick={async () => {
                  try {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map((r) => r.unregister()));
                    const keys = await caches.keys();
                    await Promise.all(keys.map((k) => caches.delete(k)));
                  } catch (e) {
                    // ignore — reload will still fetch fresh from network
                  }
                  window.location.reload(true);
                }}
                className="font-display text-xs uppercase tracking-wider font-semibold px-3 py-2 rounded-lg transition-all hover:scale-105"
                style={{ color: COLORS.inkDim, background: COLORS.surface, border: `1px solid ${COLORS.line}` }}
                title="Force the app to grab the latest version"
              >
                {t('checkForUpdates')}
              </button>
            </div>
          </div>

          <div className="flex items-center justify-end gap-4 -mt-2 mb-8">
            <button onClick={startChangePin} className="text-xs underline" style={{ color: COLORS.inkDim }}>
              Change PIN
            </button>
            <button onClick={toggleBiometric} className="text-xs underline" style={{ color: COLORS.inkDim }}>
              {localStorage.getItem('webauthn_cred_' + currentMechanic) ? 'Turn off Face/Touch ID' : 'Enable Face/Touch ID'}
            </button>
            {bioMsg && <span className="text-xs font-semibold" style={{ color: COLORS.accent }}>{bioMsg}</span>}
          </div>

          <button
            onClick={() => setScreen('timeclock')}
            className="w-full flex items-center justify-between rounded-2xl px-6 py-6 mb-8 transition-all hover:scale-102 active:scale-98 focus:outline-none focus:ring-2 shop-card"
            style={{
              background: openEntry ? COLORS.accent : COLORS.surface,
              border: `3px solid ${openEntry ? COLORS.accent : COLORS.line}`,
            }}
          >
            <div className="flex items-center gap-4">
              <span style={{ fontSize: '2.5rem' }}>⏱️</span>
              <div className="text-left">
                <p
                  className="font-display text-xl font-bold"
                  style={{ color: openEntry ? '#1B1F19' : COLORS.ink }}
                >
                  {openEntry ? t('clockedIn') : t('timeClock')}
                </p>
                <p
                  className="text-sm"
                  style={{ color: openEntry ? '#1B1F19' : COLORS.inkDim, opacity: openEntry ? 0.75 : 1 }}
                >
                  {openEntry ? `${t('clockedInSince')} ${fmtTime(openEntry.clockIn)} — ${t('sinceTapToLog')}` : t('tapToClockIn')}
                </p>
              </div>
            </div>
            <span style={{ fontSize: '2rem', color: openEntry ? '#1B1F19' : COLORS.inkDim }}>→</span>
          </button>

          <div className="relative mb-8">
            <input
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              placeholder={t('searchPlaceholder')}
              className="w-full rounded-xl px-5 py-4 text-base focus:outline-none focus:ring-2"
              style={{ background: COLORS.surface, color: COLORS.ink, border: `2px solid ${COLORS.line}` }}
            />
            {searchQuery && (
              <button
                onClick={() => setSearchQuery('')}
                className="absolute right-4 top-1/2 -translate-y-1/2 text-lg"
                style={{ color: COLORS.inkDim }}
              >
                ✕
              </button>
            )}
          </div>

          {q ? (
            <div>
              <h2 className="font-display text-lg font-semibold uppercase tracking-wide mb-5">
                {searchResults.length} result{searchResults.length !== 1 ? 's' : ''} for "{searchQuery}"
              </h2>
              {searchResults.length === 0 ? (
                <div className="rounded-lg p-10 text-center" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>
                  <p className="text-base" style={{ color: COLORS.inkDim }}>{t('noOrdersMatchSearch')}</p>
                </div>
              ) : (
                <div className="space-y-3">{searchResults.map(renderOrderCard)}</div>
              )}
            </div>
          ) : (
            <React.Fragment>
              <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
                <h2 className="font-display text-lg font-semibold uppercase tracking-wide">{t('openWorkOrders')}</h2>
                <div className="flex gap-2">
                  <button
                    onClick={() => setScreen('machines')}
                    className="font-display text-xs uppercase tracking-wider font-semibold px-3 py-2 rounded-lg transition-all hover:scale-105"
                    style={{ color: COLORS.inkDim, background: COLORS.surface, border: `1px solid ${COLORS.line}` }}
                  >
                    {t('viewByMachine')}
                  </button>
                  <label
                    className="font-display font-bold uppercase tracking-wide text-sm px-4 py-3 rounded-xl transition-all cursor-pointer text-center"
                    style={{ background: COLORS.surfaceRaised, color: COLORS.accent, border: `2px solid ${COLORS.accent}` }}
                  >
                    {scanningReceipt ? 'Reading photo…' : '📷 Scan a receipt'}
                    <input
                      type="file"
                      accept="image/*"
                      capture="environment"
                      className="hidden"
                      disabled={scanningReceipt}
                      onChange={(e) => {
                        const file = e.target.files && e.target.files[0];
                        if (file) handleScanReceipt(file);
                        e.target.value = '';
                      }}
                    />
                  </label>
                  <Btn onClick={() => setShowAddOrder((s) => !s)}>{t('newWorkOrder')}</Btn>
                </div>
              </div>

              {showAddOrder && (
                <NewOrderForm
                  mechanics={mechanics}
                  units={units}
                  onCancel={() => { setShowAddOrder(false); setScanReviewData(null); }}
                  onSubmit={(data) => createOrder(data, scanReviewData ? scanReviewData.photoDataUrl : null)}
                  initialDescription={scanReviewData ? scanReviewData.description : ''}
                  initialUnit={scanReviewData ? scanReviewData.unit : ''}
                  scanBanner={!!scanReviewData}
                  t={t}
                />
              )}

              {openOrders.length === 0 ? (
                <div className="rounded-lg p-10 text-center" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>
                  <p className="font-body text-base mb-2" style={{ color: COLORS.inkDim }}>All caught up!</p>
                  <p className="font-body text-sm" style={{ color: COLORS.line }}>{t('noOpenOrders')}</p>
                </div>
              ) : (
                <div className="space-y-3">{openOrders.map(renderOrderCard)}</div>
              )}
            </React.Fragment>
          )}

          <p className="font-body text-xs mt-12 text-center" style={{ color: COLORS.line }}>All mechanics see the same board in real time</p>
        </div>
      </div>
    );
  }

  // ---------- MACHINES (grouped by unit) ----------
  if (screen === 'machines') {
    const counts = (unit) => {
      const list = orders.filter((o) => o.unit === unit);
      return {
        Open: list.filter((o) => o.status === 'Open').length,
        'In Progress': list.filter((o) => o.status === 'In Progress').length,
        Done: list.filter((o) => o.status === 'Done').length,
      };
    };
    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <FireworksOverlay show={showFireworks} />
        <OfflineBanner isOnline={isOnline} />
        <PinModalOverlay
          pinModal={pinModal}
          pinInput={pinInput}
          setPinInput={setPinInput}
          pinError={pinError}
          onSubmit={submitPin}
          onCancel={cancelPinModal}
          onForgot={forgotPin}
          t={t}
        />
        <EmailPromptOverlay
          show={showEmailPrompt}
          onSave={async (email) => {
            await saveMechanicEmail(currentMechanic, email);
            setShowEmailPrompt(false);
          }}
          onSkip={() => setShowEmailPrompt(false)}
        />
        <PushPromptOverlay
          show={showPushPrompt}
          mechanic={currentMechanic}
          onEnable={async () => {
            await registerPushNotifications(currentMechanic);
            setShowPushPrompt(false);
          }}
          onSkip={() => setShowPushPrompt(false)}
        />
        <BiometricOfferOverlay
          mechanic={offerBiometric}
          onEnable={async () => {
            const name = offerBiometric;
            setOfferBiometric(null);
            try {
              await registerBiometric(name);
            } catch (e) {
              // ignore
            }
          }}
          onSkip={() => setOfferBiometric(null)}
        />
        <div className="max-w-5xl mx-auto">
          <button onClick={() => setScreen('dashboard')} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>

          <div className="flex items-center justify-between mb-5">
            <h2 className="font-display text-lg font-semibold uppercase tracking-wide">Your machines</h2>
            <Btn variant="ghost" onClick={() => setShowAddUnit((s) => !s)}>+ Add machine</Btn>
          </div>

          {showAddUnit && (
            <div className="flex gap-2 mb-5">
              <input
                value={newUnitName}
                onChange={(e) => setNewUnitName(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && addUnit()}
                placeholder="Unit number, e.g. UNIT-104"
                className="flex-1 rounded-sm px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
              />
              <Btn onClick={addUnit}>Add</Btn>
            </div>
          )}

          {units.length === 0 ? (
            <div className="rounded-lg p-10 text-center" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>
              <p className="font-body text-base mb-4" style={{ color: COLORS.inkDim }}>No machines added yet</p>
              <p className="font-body text-sm" style={{ color: COLORS.line }}>Tap "Add machine" above to get started</p>
            </div>
          ) : (
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
              {units.map((u) => {
                const c = counts(u);
                const totalJobs = c.Open + c['In Progress'] + c.Done;
                return (
                  <button
                    key={u}
                    onClick={() => { setActiveUnit(u); setScreen('unit'); }}
                    className="text-left rounded-lg p-5 focus:outline-none focus:ring-2 transition-all hover:scale-105 active:scale-95"
                    style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}
                  >
                    <p className="font-mono text-xl font-semibold mb-4 truncate">{u}</p>
                    <div className="space-y-2">
                      <div className="flex items-center justify-between text-sm">
                        <span style={{ color: COLORS.open }}>📋 {t('statusOpen')}</span>
                        <span className="font-semibold" style={{ color: COLORS.open }}>{c.Open}</span>
                      </div>
                      <div className="flex items-center justify-between text-sm">
                        <span style={{ color: COLORS.progress }}>🔧 {t('statusInProgress')}</span>
                        <span className="font-semibold" style={{ color: COLORS.progress }}>{c['In Progress']}</span>
                      </div>
                      <div className="flex items-center justify-between text-sm">
                        <span style={{ color: COLORS.done }}>✓ {t('statusDone')}</span>
                        <span className="font-semibold" style={{ color: COLORS.done }}>{c.Done}</span>
                      </div>
                    </div>
                    {totalJobs > 0 && (
                      <div className="mt-3 pt-3 border-t" style={{ borderColor: COLORS.line }}>
                        <span className="text-xs font-display uppercase tracking-wide" style={{ color: COLORS.inkDim }}>
                          {totalJobs} job{totalJobs !== 1 ? 's' : ''} total
                        </span>
                      </div>
                    )}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      </div>
    );
  }


  // ---------- TIME CLOCK ----------
  if (screen === 'timeclock') {
    const myEntries = timesheets
      .filter((t) => t.mechanic === currentMechanic)
      .slice()
      .sort((a, b) => b.date.localeCompare(a.date) || (b.clockIn || '').localeCompare(a.clockIn || ''));
    const onLunch = openEntry && openEntry.lunchStart && !openEntry.lunchEnd;

    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <OfflineBanner isOnline={isOnline} />
        <div className="max-w-2xl mx-auto">
          <button onClick={() => setScreen('dashboard')} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>
          <h1 className="font-display text-3xl font-bold mb-2">{t('timeClock')}</h1>
          <p className="text-sm mb-8" style={{ color: COLORS.inkDim }}>{currentMechanic}</p>

          {/* Current status card */}
          <div className="rounded-lg p-6 mb-8 text-center" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
            {!openEntry ? (
              <React.Fragment>
                <p className="text-base mb-5" style={{ color: COLORS.inkDim }}>{t('notClockedIn')}</p>
                <Btn onClick={clockIn} disabled={timeClockActionPending}>{timeClockActionPending ? '…' : t('clockIn')}</Btn>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <p className="font-mono text-sm mb-1" style={{ color: COLORS.inkDim }}>{t('clockedInAt')}</p>
                <p className="font-display text-2xl font-bold mb-5">{fmtTime(openEntry.clockIn)}</p>

                {onLunch ? (
                  <React.Fragment>
                    <p className="text-sm mb-4" style={{ color: COLORS.progress }}>{t('onBreakSince')} {fmtTime(openEntry.lunchStart)}</p>
                    <Btn onClick={endLunch} disabled={timeClockActionPending}>{timeClockActionPending ? '…' : t('endBreak')}</Btn>
                  </React.Fragment>
                ) : (
                  <div className="flex flex-col gap-3 items-center">
                    {openEntry.lunchStart && openEntry.lunchEnd && (
                      <p className="text-xs font-mono" style={{ color: COLORS.inkDim }}>
                        {t('breakLabel')}: {fmtTime(openEntry.lunchStart)} – {fmtTime(openEntry.lunchEnd)}
                      </p>
                    )}
                    <div className="flex gap-3">
                      {!openEntry.lunchStart && (
                        <Btn variant="ghost" onClick={startLunch} disabled={timeClockActionPending}>{timeClockActionPending ? '…' : t('startBreak')}</Btn>
                      )}
                      <Btn onClick={attemptClockOut} disabled={timeClockActionPending}>{t('clockOut')}</Btn>
                    </div>
                  </div>
                )}
              </React.Fragment>
            )}
          </div>

          {lunchPrompt && (
            <div className="absolute inset-0 z-50 p-6" style={{ background: 'rgba(0,0,0,0.75)', minHeight: '100vh' }}>
              <div className="w-full max-w-xs mx-auto my-8 rounded-2xl p-6 overflow-y-auto" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}`, maxHeight: '85vh' }}>
                <p className="font-display text-lg font-bold mb-3 text-center">{t('noBreakLoggedToday')}</p>
                <p className="text-sm mb-5 text-center" style={{ color: COLORS.inkDim }}>
                  {t('goBackBreakReminder')}
                </p>
                <div className="flex flex-col gap-2">
                  <Btn variant="ghost" onClick={() => setLunchPrompt(false)}>{t('goBack')}</Btn>
                  <Btn variant="danger" onClick={() => { setLunchPrompt(false); setPendingClockOutSkippedLunch(true); }}>{t('workedStraightThrough')}</Btn>
                </div>
              </div>
            </div>
          )}

          <ClockOutReviewOverlay
            show={pendingClockOutSkippedLunch !== null}
            openEntry={openEntry}
            skippedLunch={pendingClockOutSkippedLunch}
            mechanic={currentMechanic}
            onConfirm={(signature) => clockOut(pendingClockOutSkippedLunch, signature)}
            onCancel={() => setPendingClockOutSkippedLunch(null)}
          />

          {/* Jobs worked on today */}
          {openEntry && (
            <div className="mb-8">
              <h2 className="font-display text-lg font-semibold uppercase tracking-wide mb-4">{t('whatDidYouWorkOn')}</h2>
              <TimesheetJobsEditor entry={openEntry} onAdd={addTimesheetJob} onRemove={removeTimesheetJob} />
            </div>
          )}

          {/* Add a missed day */}
          {showAddMissedDay ? (
            <AddMissedDayForm
              t={t}
              defaultMechanic={currentMechanic}
              onSubmit={async (mechanicName, date, ci, co, ls, le, setError) => {
                if (isWeekApproved(weekStartOf(date))) {
                  setError("That week's already been approved — ask admin to add this one for you.");
                  return;
                }
                await addManualEntry(mechanicName, date, ci, co, ls, le);
                setShowAddMissedDay(false);
              }}
              onCancel={() => setShowAddMissedDay(false)}
            />
          ) : (
            <button
              onClick={() => setShowAddMissedDay(true)}
              className="w-full text-center text-sm font-display uppercase tracking-wide mb-8 py-3 rounded-lg"
              style={{ color: COLORS.accent, background: COLORS.surface, border: `2px dashed ${COLORS.accent}` }}
            >
              + Add a missed day
            </button>
          )}

          {/* Past entries */}
          <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
            <h2 className="font-display text-sm font-bold uppercase tracking-wide mb-1">{t('checkMyHours')}</h2>
            <p className="text-xs mb-3" style={{ color: COLORS.inkDim }}>
              {t('checkMyHoursHelp')}
            </p>
            <div className="grid grid-cols-2 gap-3 mb-3">
              <label className="block">
                <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>{t('from')}</span>
                <input
                  type="date"
                  value={mySummaryStart}
                  onChange={(e) => setMySummaryStart(e.target.value)}
                  className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                  style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                />
              </label>
              <label className="block">
                <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>{t('to')}</span>
                <input
                  type="date"
                  value={mySummaryEnd}
                  onChange={(e) => setMySummaryEnd(e.target.value)}
                  className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                  style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                />
              </label>
            </div>
            {mySummaryStart && mySummaryEnd ? (
              <p className="font-display text-xl font-bold" style={{ color: COLORS.accent }}>
                {fmtHours(
                  myEntries
                    .filter((e) => e.date >= mySummaryStart && e.date <= mySummaryEnd)
                    .reduce((sum, e) => sum + entryHours(e), 0)
                )}
              </p>
            ) : (
              <p className="text-sm" style={{ color: COLORS.line }}>{t('pickBothDates')}</p>
            )}
          </div>

          <h2 className="font-display text-lg font-semibold uppercase tracking-wide mb-4">Your recent shifts</h2>
          {myEntries.length === 0 ? (
            <p className="text-sm" style={{ color: COLORS.line }}>No shifts logged yet.</p>
          ) : (
            <div className="space-y-3">
              {myEntries.map((entry) => (
                <TimesheetEntryCard
                  key={entry.id}
                  entry={entry}
                  locked={isWeekApproved(weekStartOf(entry.date))}
                  canEdit={isAdmin || !isWeekApproved(weekStartOf(entry.date))}
                  isEditing={editingEntryId === entry.id}
                  onEdit={() => setEditingEntryId(entry.id)}
                  onCancelEdit={() => setEditingEntryId(null)}
                  onSave={async (patch) => {
                    await updateTimesheetEntry(entry.id, patch);
                    setEditingEntryId(null);
                  }}
                  onDelete={() => deleteTimesheetEntry(entry.id)}
                  onAddJob={addTimesheetJob}
                  onRemoveJob={removeTimesheetJob}
                />
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ---------- TIMESHEETS (admin only) ----------
  if (screen === 'timesheets') {
    if (!isAdmin) {
      return (
        <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8 flex items-center justify-center">
          {FONT_STYLE}
          <div className="text-center">
            <p className="font-display text-lg font-bold mb-4">Admins only</p>
            <Btn onClick={() => setScreen('dashboard')}>Back to board</Btn>
          </div>
        </div>
      );
    }

    const filtered = timesheets.filter((t) => {
      if (tsFilterMechanic && t.mechanic !== tsFilterMechanic) return false;
      if (tsFilterStart && t.date < tsFilterStart) return false;
      if (tsFilterEnd && t.date > tsFilterEnd) return false;
      return true;
    });

    const totalsByMechanic = {};
    filtered.forEach((e) => {
      totalsByMechanic[e.mechanic] = (totalsByMechanic[e.mechanic] || 0) + entryHours(e);
    });

    // Group shifts by mechanic (each person's shifts together, newest first)
    // instead of interleaving everyone by date.
    const groupedByMechanic = {};
    filtered.forEach((e) => {
      if (!groupedByMechanic[e.mechanic]) groupedByMechanic[e.mechanic] = [];
      groupedByMechanic[e.mechanic].push(e);
    });
    Object.values(groupedByMechanic).forEach((list) => list.sort((a, b) => b.date.localeCompare(a.date)));
    const mechanicGroups = Object.keys(groupedByMechanic).sort((a, b) => a.localeCompare(b));

    const clockedInNow = timesheets.filter((t) => !t.clockOut && t.date === todayStr());

    // Weekly view for the overtime flag + approval workflow
    const baseWeekStart = weekStartOf(todayStr());
    const viewedWeekStart = (() => {
      const d = new Date(baseWeekStart + 'T00:00:00');
      d.setDate(d.getDate() + tsWeekOffset * 7);
      return d.toISOString().slice(0, 10);
    })();
    const viewedWeekEnd = weekEndOf(viewedWeekStart);
    const weekEntries = timesheets.filter((t) => t.date >= viewedWeekStart && t.date <= viewedWeekEnd);
    const weekTotalsByMechanic = {};
    weekEntries.forEach((e) => {
      weekTotalsByMechanic[e.mechanic] = (weekTotalsByMechanic[e.mechanic] || 0) + entryHours(e);
    });
    const weekApproved = isWeekApproved(viewedWeekStart);

    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <OfflineBanner isOnline={isOnline} />
        <div className="max-w-3xl mx-auto">
          <button onClick={() => setScreen('dashboard')} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>
          <h1 className="font-display text-3xl font-bold mb-8">Timesheets</h1>

          {/* Who's clocked in right now */}
          <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
            <h2 className="font-display text-sm font-bold uppercase tracking-wide mb-3">Clocked in right now</h2>
            {clockedInNow.length === 0 ? (
              <p className="text-sm" style={{ color: COLORS.line }}>Nobody's clocked in at the moment.</p>
            ) : (
              <div className="space-y-2">
                {clockedInNow.map((t) => (
                  <div key={t.id} className="flex items-center justify-between">
                    <span className="font-display font-semibold">🟢 {t.mechanic}</span>
                    <span className="font-mono text-sm" style={{ color: COLORS.inkDim }}>
                      since {fmtTime(t.clockIn)}{t.lunchStart && !t.lunchEnd ? ' (on break)' : ''}
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Weekly totals, overtime flag, and approval */}
          <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
            <div className="flex items-center justify-between mb-4">
